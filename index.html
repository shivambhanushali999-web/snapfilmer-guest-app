  function handleWebUpload(evt, mode) {
    const files = Array.prototype.slice.call(evt.target.files || []);
    uploadFilesToEvent(files, mode);
    evt.target.value = '';
  }

  function uploadFilesToEvent(files, mode) {
    const imageFiles = files.filter(function (f) { return f.type && f.type.indexOf('image/') === 0; });
    if (!imageFiles.length) return;
    const queue = document.getElementById('up-queue');
    const eventSelect = document.getElementById('up-event-select');
    const eventId = eventSelect ? eventSelect.value : (EVENTS[0] ? EVENTS[0].id : '');
    const albumSelect = document.getElementById('up-album-select');
    const albumName = albumSelect ? albumSelect.value : '';
    // "Legacy Upload" deliberately trades quality for smaller/faster uploads on bad
    // venue Wi-Fi, so it always compresses. The normal Web Portal tab instead honors
    // whatever's picked in the Upload Quality selector — previously that <select> had
    // no id at all, so the choice was silently ignored and every photo got crushed
    // down to 900px regardless of what the photographer selected.
    let quality = 'standard';
    if (mode !== 'legacy') {
      const qSelect = document.getElementById('up-quality-select');
      quality = qSelect ? qSelect.value : 'standard';
    }

    if (!storage || !db) {
      if (queue) queue.innerHTML = '<div style="padding:9px 0;font-size:12.5px;">No cloud connection</div>';
      return;
    }
    uploadPhotosWithPool(imageFiles, {
      eventId: eventId, albumName: albumName, quality: mode === 'legacy' ? 'legacy' : quality,
      resize: function (file) { return mode === 'legacy' ? resizeFileToBlob(file, 1000, 0.6) : prepareUploadBlob(file, quality); },
      onFileStart: function (file) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;';
        row.innerHTML = '<span>' + file.name + '</span><span class="pill orange">Uploading...</span>';
        if (queue) queue.appendChild(row);
        return row.querySelector('.pill');
      },
      onFileDone: function (statusEl, ok) {
        if (!statusEl) return;
        statusEl.textContent = ok ? 'Uploaded' : 'Failed';
        statusEl.className = ok ? 'pill green' : 'pill gray';
      },
    }).then(function (result) {
      const ev = EVENTS.find(function (e) { return e.id === eventId; });
      if (ev) {
        ev.photos += result.done;
        if (albumName) {
          const album = ev.albums.find(function (a) { return a.name === albumName; });
          if (album) album.count += result.done;
        }
        // See the matching comment in handleEventPhotoUpload() — album counts need to
        // be pushed to Firestore too, not just the event's total photo count, otherwise
        // the album sidebar shows a stale "(0)" even once photos are really there.
        syncEventPrivacyToCloud(eventId, { photos: ev.photos, albums: ev.albums });
      }
    });
  }

  // TinyURL's classic api-create.php endpoint doesn't send CORS headers, so a fetch()
  // read of the response can be blocked depending on the browser — tries the real
  // fetch first (works in some environments and gives a seamless inline swap), and
  // falls back to just opening that same real shortening request as a normal page
  // navigation (always works, no CORS involved) if the read gets blocked. Either way
  // this only ever shows a genuinely shortened link, never a fake placeholder one.
  function toggleShareShortenLinks(checked, eventId) {

        .then(function (res) { if (!res.ok) throw new Error('bad response'); return res.text(); })
        .then(function (short) {

          if (short.indexOf('http') !== 0) throw new Error('unexpected response');
          shareShortLinkCache[eventId] = short;

        .catch(function () {

  // Logo is stored as a small resized PNG data URL directly on the studio/profile
  // Firestore doc (not Storage) — it's tiny (well under Firestore's 1MB doc cap) and
  // this avoids needing another Storage security-rules path just for one small image.
  function uploadStudioLogo(evt) {
    const file = evt.target.files && evt.target.files[0];
    evt.target.value = '';
    if (!file) return;
    const statusEl = document.getElementById('logo-upload-status');
    if (statusEl) { statusEl.style.display = 'block'; statusEl.style.color = 'var(--muted)'; statusEl.textContent = 'Uploading...'; }
    const reader = new FileReader();
    reader.onload = function () {
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        const maxDim = 240;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        // PNG (not JPEG) to keep transparency — logos get composited onto a white QR
        // background below, and a JPEG would force an opaque white/black box behind it.
        const dataUrl = canvas.toDataURL('image/png');
        STUDIO.logoUrl = dataUrl;
        // Used to silently swallow a failed save here — the preview updated locally so
        // it LOOKED uploaded, but if the Firestore write itself failed, nothing was
        // really persisted and the logo would just be gone again on the next reload,
        // with zero indication anything had gone wrong.
        if (db) db.collection('studio').doc('profile').set({ logoUrl: dataUrl }, { merge: true }).catch(showSyncFailureToast);
        if (statusEl) statusEl.style.display = 'none';
        const e = EVENTS.find(function (x) { return x.id === currentEventId; }) || EVENTS[0];
        if (e) renderShareTab(e);
      };
      img.onerror = function () {
        if (statusEl) { statusEl.style.color = '#D0342C'; statusEl.textContent = 'Could not read that image — try a different file.'; }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function removeStudioLogo() {
    if (!confirm('Remove the custom logo from QR codes?')) return;
    STUDIO.logoUrl = '';
    if (db) db.collection('studio').doc('profile').set({ logoUrl: '' }, { merge: true }).catch(showSyncFailureToast);
    const e = EVENTS.find(function (x) { return x.id === currentEventId; }) || EVENTS[0];
    if (e) renderShareTab(e);

  // Cover Photo — the studio-wide banner (shown on the guest app's Portfolio screen,
  // and used as the default cover photo for brand-new events instead of a random

  // goes to Firebase Storage (same path pattern as everything else) rather than an

  function uploadStudioCover(evt) {
    const file = evt.target.files && evt.target.files[0];
    evt.target.value = '';
    if (!file || file.type.indexOf('image/') !== 0) return;
    resizeFileToBlob(file, 1600, 0.85).then(function (blob) {

      // gets silently permission-denied. This was the actual cause of the "could not
      // upload" error: not a connection issue, a rules-scoping mismatch.
      return uploadPhotoToStorage(blob, file.name, 'photos/studio-cover');

      // The old cover's Storage file is otherwise never referenced by anything again
      // the moment coverUrl is overwritten below — without this, every single re-upload
      // (studios tend to swap this seasonally/per-branding-refresh) leaves another
      // orphaned file behind.
      const oldUrl = STUDIO.coverUrl;
      STUDIO.coverUrl = url;

      if (oldUrl) deleteStorageFileByUrl(oldUrl);
      renderProfileWizard(document.getElementById('page-content'));
    }).catch(function (err) {
      console.error('uploadStudioCover failed', err);

    if (oldUrl) deleteStorageFileByUrl(oldUrl);

  // Guest Reels background music — deliberately stored as an inline base64 data URL on
  // the studio/profile doc (like the small logo above), NOT uploaded to Firebase
  // Storage like the cover photo. This isn't just a style choice: a Storage download URL
  // is cross-origin from the guest app's own domain, and the guest app's canvas/
  // MediaRecorder pipeline has to load it with crossOrigin="anonymous" to be able to
  // actually capture its audio into the recorded video — which silently fails (loads/
  // plays fine for the studio here, but produces a track with NO audio in the guest's
  // recording) unless the Storage bucket's CORS is separately configured, which nothing
  // in this app does. A data: URL has no origin at all, so that whole class of failure
  // disappears — this was the actual cause of "music nahi aaya". Kept small (700KB raw,
  // ~930KB once base64-encoded) since it shares Firestore's 1MB doc-size ceiling with
  // every other Profile field — plenty for a compressed 15-25s clip.
  function uploadReelMusic(evt) {
    const file = evt.target.files && evt.target.files[0];
    evt.target.value = '';
    if (!file) return;
    if (file.type.indexOf('audio/') !== 0) { alert('Please choose an audio file (MP3, M4A, etc.).'); return; }
    if (file.size > 700 * 1024) { alert('That file is too big — please use something under 700KB (a short, compressed 15-25 second MP3 clip is plenty, and keeps things fast for guests).'); return; }
    const reader = new FileReader();
    reader.onload = function () {
      const dataUrl = reader.result;
      STUDIO.reelMusicUrl = dataUrl;
      if (db) db.collection('studio').doc('profile').set({ reelMusicUrl: dataUrl }, { merge: true }).catch(showSyncFailureToast);
      renderProfileWizard(document.getElementById('page-content'));
    };
    reader.onerror = function () {
      alert('Could not read that file — please try again.');
    };
    reader.readAsDataURL(file);
  }

  function removeReelMusic() {
    if (!confirm('Remove the background music from Guest Reels? New reels will be silent until another track is added.')) return;
    STUDIO.reelMusicUrl = '';
    if (db) db.collection('studio').doc('profile').set({ reelMusicUrl: '' }, { merge: true }).catch(showSyncFailureToast);
    renderProfileWizard(document.getElementById('page-content'));
  }

  // Builds a real qrserver.com request URL — color/bgcolor are genuine API params (hex,
  // no '#'), not decorative; format defaults to png but 'svg' is used for the vector
  // download, which can't carry the canvas-composited logo (see composeQrWithLogo below).
  // ecc=H (highest error-correction level, ~30% of the code can be damaged/obscured and
  // still scan) is required here, not optional — without it (qrserver.com's default is
  // much lower), baking a logo into the center covers enough of the code that phone
  // cameras simply fail to read it at all, which is exactly what "scan karne par kuch
  // nahi hota" was — the QR images looked fine but were silently unscannable.
  function qrApiUrl(data, color, size, format) {
    return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size +
      '&data=' + encodeURIComponent(data) + '&color=' + (color || '000000').replace('#', '') +
      '&bgcolor=FFFFFF&ecc=H' + (format ? '&format=' + format : '');
  }

  // The free qrserver.com QR generator has no logo-embedding option of its own, so this
  // draws the plain (already-colored) QR image and the uploaded logo onto a canvas
  // together (with a small white backing square behind the logo — standard practice
  // that keeps the QR still scannable), then swaps the on-screen preview and PNG
  // download link over to that composited image. Falls back to the plain QR silently if
  // the canvas can't be read back out (e.g. no internet, or a cross-origin read block).
  function composeQrWithLogo(wrapId, downloadLinkId, qrData, color, filename) {
    const wrap = document.getElementById(wrapId);
    const downloadLink = document.getElementById(downloadLinkId);
    if (!wrap) return;
    const qrImg = new Image();
    qrImg.crossOrigin = 'anonymous';
    qrImg.onload = function () {
      const logoImg = new Image();
      logoImg.onload = function () {
        try {
          const size = 600;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(qrImg, 0, 0, size, size);
          const logoSize = Math.round(size * 0.22);
          const logoX = (size - logoSize) / 2;
          const logoY = (size - logoSize) / 2;
          const pad = Math.round(logoSize * 0.12);
          ctx.fillStyle = '#fff';
          ctx.fillRect(logoX - pad, logoY - pad, logoSize + pad * 2, logoSize + pad * 2);
          ctx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
          const composedUrl = canvas.toDataURL('image/png');
          wrap.innerHTML = '<img src="' + composedUrl + '" style="width:160px;height:160px;">';
          if (downloadLink) { downloadLink.href = composedUrl; downloadLink.download = filename; }
        } catch (err) {
          // Tainted-canvas / cross-origin failure — plain QR stays showing, which is
          // still fully functional, just without the logo baked in.
        }
      };
      logoImg.src = STUDIO.logoUrl;
    };
    qrImg.src = qrApiUrl(qrData, color, 600);
  }

  function generateRandomPin() {
    return String(Math.floor(1000 + Math.random() * 9000));

  function resetSharePin() {
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    if (!confirm('Generate a new PIN? The old one stops working immediately.')) return;
    e.privacy.pin = generateRandomPin();

  // The guest app now actually reads ?album= from the URL (see openHomeAlbum-style
  // deep-link handling in index.html's Init) and jumps straight into that folder.
  function generateAlbumLink() {
    const select = document.getElementById('adv-album-select');
    const out = document.getElementById('adv-album-link');
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!select || !select.value || !e) { if (out) out.textContent = 'Choose an album first.'; return; }
    const url = GUEST_APP_URL + '?event=' + e.id + '&album=' + encodeURIComponent(select.value);
    if (out) out.innerHTML = 'Link: <b>' + url + '</b> &nbsp;<span style="cursor:pointer;color:var(--accent-ink);" onclick="copyText(\'' + url + '\')">Copy</span>';
  }

  // Uploads the studio's chosen "this is definitely their face" photo to Storage and
  // saves a small Firestore record the guest app can fetch by ID — the generated link
  // then opens My Photos with that selfie already applied and matching already running,
  // so the guest never has to take their own selfie at all.
  function generateSelfieLink(evt) {
    const file = evt.target.files && evt.target.files[0];
    const out = document.getElementById('adv-selfie-link');
    if (!file || !out) return;
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    if (!storage || !db) { out.textContent = 'No cloud connection — please try again.'; return; }
    out.textContent = 'Uploading "' + file.name + '"...';
    resizeFileToBlob(file, 800, 0.85).then(function (blob) {
      return uploadPhotoToStorage(blob, file.name, 'photos/' + e.id);
    }).then(function (url) {
      return db.collection('prefillSelfies').add({ eventId: e.id, dataUrl: url, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }).then(function (docRef) {
      const link = GUEST_APP_URL + '?event=' + e.id + '&prefill=' + docRef.id;
      out.innerHTML = 'Link generated from "' + file.name + '": <b>' + link + '</b> &nbsp;<span style="cursor:pointer;color:var(--accent-ink);" onclick="copyText(\'' + link + '\')">Copy</span>';
    }).catch(function () {
      out.textContent = 'Could not generate the link — please try again.';
    });
  }

  function generateVipLink() {
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    const skipLogin = document.getElementById('vip-skip-login').checked;
    const embedPin = document.getElementById('vip-embed-pin').checked;
    const out = document.getElementById('vip-link-result');
    if (!skipLogin && !embedPin) { out.textContent = 'Select at least one option above to generate a VIP link.'; return; }
    let url = GUEST_APP_URL + '?event=' + e.id;
    let note = '';
    if (embedPin && e.privacy.pin) { url += '&pin=' + e.privacy.pin; }
    if (skipLogin) { note = ' (browsing without an account is already the default for every guest, so nothing extra to add here)'; }
    out.innerHTML = 'VIP link: <b>' + url + '</b>' + note + ' &nbsp;<span style="cursor:pointer;color:var(--accent-ink);" onclick="copyText(\'' + url + '\')">Copy</span>';
  }

  function createCommonQR() {
    const nameInput = document.getElementById('cqr-name-input');
    const eventSelect = document.getElementById('cqr-event-select');
    const name = nameInput ? nameInput.value.trim() : '';
    const eventId = eventSelect ? eventSelect.value : (EVENTS[0] ? EVENTS[0].id : '');
    if (!name) { alert('Please enter a name for this Common QR.'); return; }
    COMMON_QRS.push({ id: 'cqr_' + Date.now(), name: name, eventId: eventId });
    document.getElementById('cqr-create-form').innerHTML = '';

  function deleteCommonQR(id) {
    if (!confirm('Delete this Common QR? Any printed poster for it will stop working.')) return;
    const idx = COMMON_QRS.findIndex(function (q) { return q.id === id; });
    if (idx > -1) COMMON_QRS.splice(idx, 1);
    renderCommonQR(document.getElementById('page-content'));
    renderSidebar();
  }

  // ================= Events (real Firestore-backed multi-event) =================
  // Same pattern as startPostsAdminSync() below — the whole EVENTS array is now the
  // live Firestore collection, not a local-only mock. This is what actually lets the
  // studio run more than one event: every event created here is now visible to the
  // guest app (which loads a specific event by ID from the same collection) and
  // survives a dashboard reload / different device.
  let eventsUnsub = null;
  function startEventsSync() {
    if (!db || eventsUnsub) return;
    eventsUnsub = db.collection('events').onSnapshot(function (snap) {
      if (snap.empty) return; // nothing in the cloud yet — keep showing the local seed
      EVENTS = snap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); });
      // Older/partial docs (only ever touched by syncEventPrivacyToCloud's privacy
      // patches) might be missing structural fields the UI expects — fill in safe
      // defaults so nothing crashes rendering an event created before this sync existed.
      EVENTS.forEach(function (e) {
        if (!e.albums) e.albums = [];
        if (!e.privacy) e.privacy = { faceRecognition: true, facePrivacy: false, anonymousMyPhotos: false, registration: false, guestUpload: false, guestUploadLimit: 10, pin: '', coHosts: [], enquiry: false, disabled: false };
        if (e.privacy.guestUploadLimit === undefined) e.privacy.guestUploadLimit = 10;
        if (!e.downloads) e.downloads = { permission: 'all', anonymous: true, originalQuality: false };
        migrateEventWatermarkShape(e);
        if (!e.photoSelling) e.photoSelling = freshPhotoSelling();
        if (!e.videos) e.videos = [];
        if (typeof e.photos !== 'number') e.photos = 0;
      });
      renderSidebar();
      if (currentPage === 'events') renderEventsCardGrid();
      if (currentPage === 'event-detail') {
        // This listener also fires for the studio's OWN writes bouncing back from
        // Firestore (e.g. every single Watermark/Downloads/Privacy field change syncs
        // here) — a full renderEventDetail() rebuild resets the tab strip back to
        // "General" every time, which made it look like the page was kicking you out
        // mid-edit. Remember whichever tab was open and restore it after rebuilding.
        const activeBtn = document.querySelector('#ed-tabs .tab-btn.active');
        const activeTab = activeBtn ? activeBtn.dataset.tab : 'general';
        renderEventDetail(document.getElementById('page-content'));
        if (activeTab !== 'general') {
          const restoreBtn = document.querySelector('#ed-tabs [data-tab="' + activeTab + '"]');
          if (restoreBtn) restoreBtn.click();
        }
      }
      if (currentPage === 'overview') renderOverview(document.getElementById('page-content'));
    }, function () {});
  }

  // One-time migration: the pre-existing "vaibhav-komal" event was never fully written
  // to Firestore (only individual privacy fields were, via syncEventPrivacyToCloud), so
  // the guest app has never actually been able to load its name/date/cover from the
  // cloud. This patches in just the missing structural fields (merge, so it can never
  // overwrite already-configured privacy/albums/downloads/watermark data).
  function backfillSeedEventsToCloud() {
    if (!db) return;
    EVENTS.forEach(function (e) {
      syncEventPrivacyToCloud(e.id, {
        name: e.name, date: e.date, cover: e.cover, photos: e.photos, photoLimit: e.photoLimit,
        guests: e.guests, views: e.views, status: e.status, validUpto: e.validUpto,
        videos: e.videos, highlightEnabled: e.highlightEnabled,
      });
    });
  }

  // ================= Posts =================
  function startPostsAdminSync() {
    if (!db || postsAdminUnsub) return;
    postsAdminUnsub = db.collection('posts').onSnapshot(function (snap) {
      POSTS_ADMIN = snap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); });
      POSTS_ADMIN.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      renderSidebar();
      if (currentPage === 'posts') renderPostsPage(document.getElementById('page-content'));
    }, function () {});
  }

  let editingPostId = null;

  // Real Kamero's "My Posts" is a table (Post/Notification/Created/Actions columns
  // with Edit+Delete per row), not a stack of cards — matches that format.
  function renderPostsPage(el) {
    el.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
        '<div><h2 style="margin:0;color:var(--accent-ink);">My Posts</h2><div class="card-sub" style="margin:2px 0 0;">' + POSTS_ADMIN.length + ' posts published</div></div>' +
        '<button class="btn-solid" onclick="openCreatePost()">' + ICONS.PLUS + ' Create Post</button>' +
      '</div>' +
      '<div id="post-create-form" style="margin-top:14px;"></div>' +
      (POSTS_ADMIN.length === 0
        ? '<div class="card" style="text-align:center;padding:48px 24px;margin-top:14px;">' +
            '<div style="width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">' + ICONS.POSTS + '</div>' +
            '<div style="font-weight:800;font-size:15px;margin-bottom:6px;">No posts yet</div>' +
            '<div class="card-sub" style="max-width:360px;margin:0 auto;">Publish an update and it shows up instantly in every targeted guest&rsquo;s app.</div>' +
          '</div>'
        : '<div class="table-card" style="margin-top:14px;"><table><thead><tr><th>Post</th><th>Notification</th><th>Created</th><th>Actions</th></tr></thead><tbody id="posts-table-body"></tbody></table></div>');

    if (POSTS_ADMIN.length > 0) {
      const tbody = document.getElementById('posts-table-body');
      POSTS_ADMIN.forEach(function (p) {
        const ev = p.audience !== 'all' ? EVENTS.find(function (e) { return e.id === p.audience; }) : null;
        const tr = document.createElement('tr');
        const bodyPreview = p.body.length > 60 ? p.body.slice(0, 60) + '...' : p.body;
        tr.innerHTML =
          '<td style="max-width:260px;"><div style="font-weight:800;font-size:13px;">' + p.title + '</div>' +
            '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">' +
              '<span class="pill' + (p.audience === 'all' ? ' blue' : ' orange') + '">' + (p.audience === 'all' ? 'All Users' : (ev ? ev.name : 'Event')) + '</span>' +
            '</div></td>' +
          '<td style="max-width:280px;color:var(--muted);font-size:12px;">' + bodyPreview + '</td>' +
          '<td style="font-size:12px;color:var(--muted);">' + (p.date || '') + '</td>' +
          '<td><div class="row-actions"><a class="link" data-edit-post="' + p.id + '" style="cursor:pointer;color:var(--accent-ink);font-weight:700;">' + ICONS.EDIT.replace('width="18" height="18"', 'width="13" height="13"') + ' Edit</a>' +
            '<a class="link" data-del-post="' + p.id + '" style="cursor:pointer;color:#D64545;font-weight:700;margin-left:12px;">' + ICONS.TRASH.replace('width="18" height="18"', 'width="13" height="13"') + ' Delete</a></div></td>';
        tr.querySelector('[data-del-post]').addEventListener('click', function () { deletePost(p.id); });
        tr.querySelector('[data-edit-post]').addEventListener('click', function () { openCreatePost(p); });
        tbody.appendChild(tr);
      });
    }
    fillIcons();
  }

  function openCreatePost(existing) {
    const form = document.getElementById('post-create-form');
    if (!form) return;
    editingPostId = existing ? existing.id : null;
    form.innerHTML =
      '<div class="card" style="margin-bottom:18px;">' +
        '<div class="card-title">' + (existing ? 'Edit Post' : 'New Post') + '</div>' +
        '<div class="field"><label>Title</label><input class="input" id="post-title-input" placeholder="e.g. Your gallery is now live!" value="' + (existing ? existing.title : '') + '"></div>' +
        '<div class="field"><label>Message</label><textarea class="input" id="post-body-input" rows="4" placeholder="Write your update...">' + (existing ? existing.body : '') + '</textarea></div>' +
        '<div class="field"><label>Type</label><select class="input" id="post-type-select">' +
          ['announcement', 'update', 'event'].map(function (t) {
            const label = t === 'announcement' ? 'Announcement' : (t === 'event' ? 'Event' : 'Update');
            return '<option value="' + t + '"' + ((existing ? (existing.type || 'update') : 'update') === t ? ' selected' : '') + '>' + label + '</option>';
          }).join('') +
        '</select></div>' +
        '<div class="field"><label>Audience</label><select class="input" id="post-audience-select">' +
          '<option value="all">All Guests (every event)</option>' +
          EVENTS.map(function (e) { return '<option value="' + e.id + '"' + (existing && existing.audience === e.id ? ' selected' : '') + '>' + e.name + ' only</option>'; }).join('') +
        '</select></div>' +
        '<div style="display:flex;gap:10px;">' +
          '<button class="btn-solid" onclick="createPost()">' + (existing ? 'Save Changes' : 'Publish') + '</button>' +
          '<button class="btn-ghost" onclick="document.getElementById(\'post-create-form\').innerHTML=\'\';editingPostId=null;">Cancel</button>' +
        '</div>' +
      '</div>';
  }

  function createPost() {
    const titleInput = document.getElementById('post-title-input');
    const bodyInput = document.getElementById('post-body-input');
    const typeSelect = document.getElementById('post-type-select');
    const audienceSelect = document.getElementById('post-audience-select');
    const title = titleInput ? titleInput.value.trim() : '';
    const body = bodyInput ? bodyInput.value.trim() : '';
    const type = typeSelect ? typeSelect.value : 'update';
    const audience = audienceSelect ? audienceSelect.value : 'all';
    if (!title || !body) { alert('Please add a title and a message.'); return; }
    if (!db) { alert('Not connected — check your internet connection.'); return; }
    if (editingPostId) {
      db.collection('posts').doc(editingPostId).set({ title: title, body: body, type: type, audience: audience }, { merge: true }).then(function () {
        editingPostId = null;
        const f = document.getElementById('post-create-form');
        if (f) f.innerHTML = '';
      }).catch(function () {
        alert('Could not save changes — check your internet connection and try again.');
      });
      return;
    }
    const now = new Date();
    db.collection('posts').add({
      title: title, body: body, type: type, audience: audience,
      createdAt: now.getTime(),
      date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }),
    }).then(function () {
      const f = document.getElementById('post-create-form');
      if (f) f.innerHTML = '';
    }).catch(function () {
      alert('Could not publish — check your internet connection and try again.');
    });
  }

  function deletePost(id) {
    if (!confirm('Delete this post? It will disappear from every guest\'s app.')) return;
    if (!db) return;
    db.collection('posts').doc(id).delete().catch(function () {});
  }

  // ================= Watermark (account-level defaults) =================
  function saveWatermarkDefaults() {
    if (!db) { showSyncFailureToast(null); return; }
    db.collection('studio').doc('profile').set({ watermarkDefaults: WATERMARK_DEFAULTS }, { merge: true }).catch(showSyncFailureToast);
  }

  function wmPositionBtnHtml(key, value, label) {
    const active = WATERMARK_DEFAULTS[key].position === value;
    return '<button type="button" class="wm-pos-btn' + (active ? ' active' : '') + '" onclick="setWatermarkPosition(\'' + key + '\',\'' + value + '\')">' + label + '</button>';
  }

  function wmTypeBtnHtml(key, value, label) {
    const active = WATERMARK_DEFAULTS[key].logoMode === value;
    return '<button type="button" class="wm-pos-btn wm-type-btn' + (active ? ' active' : '') + '" onclick="setWatermarkMode(\'' + key + '\',\'' + value + '\')">' + label + '</button>';
  }

  function setWatermarkPosition(key, value) {
    WATERMARK_DEFAULTS[key].position = value;
    saveWatermarkDefaults();
    renderWatermarkPage(document.getElementById('page-content'));
  }

  function setWatermarkMode(key, value) {
    WATERMARK_DEFAULTS[key].logoMode = value;
    saveWatermarkDefaults();
    renderWatermarkPage(document.getElementById('page-content'));
  }

  // Two-column layout — a compact settings column on the left (position grid,
  // watermark type, logo, opacity) and a large live preview on the right — matching
  // how Kamero's own "Configure your standard watermark" screen is laid out, instead
  // of stacking a small preview underneath a long single column of form fields (which
  // made the whole card feel oversized and the photo itself cramped/small).
  function watermarkCard(key, title, desc) {
    const w = WATERMARK_DEFAULTS[key];
    return '<div class="card" style="margin-bottom:18px;">' +
      '<div class="card-title">' + title + '</div>' +
      '<div class="card-sub">' + desc + '</div>' +
      toggleRowHtml('Enable ' + title, 'Turn this watermark on for all new events by default.', w.enabled, 'wm-' + key + '-enabled', '') +
      '<div style="display:flex;gap:22px;align-items:flex-start;margin-top:10px;flex-wrap:wrap;">' +
        '<div style="width:230px;flex-shrink:0;">' +
          '<div style="font-size:12.5px;font-weight:800;margin-bottom:8px;">Choose Position</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">' +
            wmPositionBtnHtml(key, 'top-left', 'Top Left') + wmPositionBtnHtml(key, 'top-right', 'Top Right') +
            wmPositionBtnHtml(key, 'bottom-left', 'Bottom Left') + wmPositionBtnHtml(key, 'bottom-right', 'Bottom Right') +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;">' +
            wmPositionBtnHtml(key, 'center', 'Center') + wmPositionBtnHtml(key, 'custom', 'Custom') +
          '</div>' +
          '<div style="font-size:12.5px;font-weight:800;margin-bottom:8px;">Watermark Type</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">' +
            wmTypeBtnHtml(key, 'text', 'Text Watermark') + wmTypeBtnHtml(key, 'logo', 'Image Watermark') + wmTypeBtnHtml(key, 'both', 'Text + Image') +
          '</div>' +
          (w.logoMode !== 'text'
            ? '<div class="field">' +
                '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
                  (STUDIO.logoUrl ? '<img src="' + STUDIO.logoUrl + '" style="width:38px;height:38px;border-radius:9px;object-fit:cover;border:1px solid var(--border);">' : '<span class="card-sub" style="margin:0;">No logo yet.</span>') +
                  '<label class="btn-outline btn-sm" style="cursor:pointer;">' + ICONS.UPLOAD + ' ' + (STUDIO.logoUrl ? 'Change' : 'Upload') +
                    '<input type="file" accept="image/*" style="display:none" onchange="uploadStudioLogo(event);setTimeout(function(){renderWatermarkPage(document.getElementById(\'page-content\'));},50);">' +
                  '</label>' +
                  (STUDIO.logoUrl ? '<button type="button" class="btn-outline btn-sm" style="color:#D0342C;border-color:#f0c9c7;" onclick="removeStudioLogo();setTimeout(function(){renderWatermarkPage(document.getElementById(\'page-content\'));},50);">Remove</button>' : '') +
                '</div>' +
                '<div class="hint">Same logo used on your Share/QR codes.</div>' +
              '</div>' +
              '<div class="field"><label id="wm-' + key + '-logoscale-label">Logo Size (' + w.logoScale + '%)</label><input class="input" type="range" min="50" max="250" step="10" id="wm-' + key + '-logoscale" value="' + w.logoScale + '"></div>'
            : '') +
          (w.logoMode !== 'logo' ? '<div class="field"><label>Watermark Text</label><input class="input" id="wm-' + key + '-text" value="' + w.text + '"></div>' : '') +
          '<div class="field" style="margin-bottom:0;"><label id="wm-' + key + '-opacity-label">Opacity (' + w.opacity + '%)</label><input class="input" type="range" min="0" max="100" id="wm-' + key + '-opacity" value="' + w.opacity + '"></div>' +
        '</div>' +
        '<div style="flex:1;min-width:300px;">' +
          '<div style="font-size:12.5px;font-weight:800;margin-bottom:8px;">Live Preview' + (w.position === 'custom' ? ' <span style="font-weight:400;color:var(--muted);">— drag directly on the photo to place it exactly where you want</span>' : '') + '</div>' +
          watermarkPreviewHtml(key) +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // Real photos from the studio's own events (each event's cover, already a real
  // uploaded photo) used as sample backgrounds for the watermark preview below —
  // deliberately not stock/placeholder art, so the preview actually shows how the
  // watermark will look on this studio's real work. Falls back to a plain gradient
  // card (with a friendly note) only for a brand-new account with no events yet.
  function watermarkPreviewPhotos() {
    const seen = {};
    const urls = [];
    EVENTS.forEach(function (e) {
      if (e.cover && !seen[e.cover] && e.cover.indexOf('picsum.photos') === -1) {
        seen[e.cover] = true;
        urls.push(e.cover);
      }
    });
    return urls.slice(0, 6);
  }

  let wmPreviewIndex = { standard: 0, original: 0 };

  function watermarkPreviewHtml(key) {
    const photos = watermarkPreviewPhotos();
    if (wmPreviewIndex[key] >= photos.length) wmPreviewIndex[key] = 0;
    const hasPhotos = photos.length > 0;
    const src = hasPhotos ? photos[wmPreviewIndex[key]] : '';
    return '<div class="wm-live-preview" id="wm-preview-' + key + '" style="position:relative;display:block;width:100%;min-height:280px;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--bg);">' +
      (hasPhotos
        ? '<img src="' + src + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        : '') +
      '<span class="card-sub" style="margin:0;text-align:center;padding:0 20px;' + (hasPhotos ? 'display:none;' : 'display:flex;') + 'align-items:center;justify-content:center;position:absolute;inset:0;">Upload your first event photo to see a live preview here.</span>' +
      '<div id="wm-preview-overlay-' + key + '"></div>' +
      (photos.length > 1
        ? '<button type="button" class="icon-btn" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border-color:transparent;" onclick="cycleWatermarkPreview(\'' + key + '\',-1)">' + ICONS.CHEVRON_LEFT + '</button>' +
          '<button type="button" class="icon-btn" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border-color:transparent;" onclick="cycleWatermarkPreview(\'' + key + '\',1)">' + ICONS.CHEVRON_RIGHT + '</button>' +
          '<div style="position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;">' +
            photos.map(function (p, i) { return '<span style="width:6px;height:6px;border-radius:50%;background:' + (i === wmPreviewIndex[key] ? '#fff' : 'rgba(255,255,255,.4)') + ';"></span>'; }).join('') +
          '</div>'
        : '') +
    '</div>';
  }

  function cycleWatermarkPreview(key, delta) {
    const photos = watermarkPreviewPhotos();
    if (!photos.length) return;
    wmPreviewIndex[key] = (wmPreviewIndex[key] + delta + photos.length) % photos.length;
    const holder = document.getElementById('wm-preview-' + key);
    if (holder) holder.outerHTML = watermarkPreviewHtml(key);
    renderWatermarkPreviewOverlay(key);
    wireWatermarkPreviewDrag(key);
  }

  // Renders just the watermark overlay on top of whichever preview photo is currently
  // showing — kept separate from the photo <img> itself so dragging/toggling settings
  // doesn't have to re-fetch or re-render the photo every time.
  function renderWatermarkPreviewOverlay(key) {
    const holder = document.getElementById('wm-preview-overlay-' + key);
    if (!holder) return;
    const w = WATERMARK_DEFAULTS[key];
    if (!w.enabled) { holder.innerHTML = ''; return; }
    const hasLogo = (w.logoMode === 'logo' || w.logoMode === 'both') && STUDIO.logoUrl;
    const hasText = w.logoMode !== 'logo' && w.text;
    if (!hasLogo && !hasText) { holder.innerHTML = ''; return; }
    let inner = '';
    if (hasLogo) {
      // Sized as a % of the actual preview box's own width (same 10%-of-photo-width
      // baseline compositeForDownload() bakes into a real download), times the Logo
      // Size slider — so what's shown here actually matches what guests/downloads will
      // see, instead of a fixed 32px thumbnail that only looked reasonable in a small
      // form field, not against a full photo.
      const wrap = document.getElementById('wm-preview-' + key);
      const boxW = wrap ? wrap.getBoundingClientRect().width : 300;
      const logoScale = (w.logoScale || 100) / 100;
      const logoPx = Math.max(20, Math.round(boxW * 0.1 * logoScale));
      inner += '<img src="' + STUDIO.logoUrl + '" style="width:' + logoPx + 'px;height:' + logoPx + 'px;object-fit:contain;border-radius:6px;display:block;">';
    }
    if (hasText) inner += '<span style="color:#fff;font-size:13px;font-weight:800;letter-spacing:.3px;background:rgba(0,0,0,.4);padding:5px 10px;border-radius:8px;white-space:nowrap;">' + w.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span>';
    const opacity = Math.max(0, Math.min(100, w.opacity)) / 100;
    let posStyle;
    if (w.position === 'custom') {
      const cx = Math.max(0, Math.min(100, w.customX != null ? w.customX : 88));
      const cy = Math.max(0, Math.min(100, w.customY != null ? w.customY : 88));
      posStyle = 'left:' + cx + '%;top:' + cy + '%;transform:translate(-50%,-50%);';
    } else if (w.position === 'center') {
      posStyle = 'left:50%;top:50%;transform:translate(-50%,-50%);';
    } else if (w.position === 'top-left') {
      posStyle = 'left:12px;top:12px;';
    } else if (w.position === 'top-right') {
      posStyle = 'right:12px;top:12px;';
    } else if (w.position === 'bottom-left') {
      posStyle = 'left:12px;bottom:12px;';
    } else {
      posStyle = 'right:12px;bottom:12px;';
    }
    holder.style.cssText = 'position:absolute;display:flex;align-items:center;gap:6px;pointer-events:none;z-index:2;opacity:' + opacity + ';' + posStyle;
    holder.innerHTML = inner;
  }

  let wmPreviewDrag = null; // { key } while a drag is in progress

  function wireWatermarkPreviewDrag(key) {
    const wrap = document.getElementById('wm-preview-' + key);
    if (!wrap) return;
    wrap.style.cursor = WATERMARK_DEFAULTS[key].position === 'custom' ? 'crosshair' : 'default';
    wrap.onpointerdown = function (ev) {
      if (WATERMARK_DEFAULTS[key].position !== 'custom') return;
      wmPreviewDrag = { key: key };
      moveWatermarkPreviewDrag(ev);
    };
  }

  function moveWatermarkPreviewDrag(ev) {
    if (!wmPreviewDrag) return;
    const wrap = document.getElementById('wm-preview-' + wmPreviewDrag.key);
    if (!wrap) return;
    const rect = wrap.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, ((ev.clientX - rect.left) / rect.width) * 100));
    const y = Math.max(0, Math.min(100, ((ev.clientY - rect.top) / rect.height) * 100));
    const w = WATERMARK_DEFAULTS[wmPreviewDrag.key];
    w.customX = x; w.customY = y;
    renderWatermarkPreviewOverlay(wmPreviewDrag.key);
  }

  window.addEventListener('pointermove', function (ev) {
    if (wmPreviewDrag) moveWatermarkPreviewDrag(ev);
  });
  window.addEventListener('pointerup', function () {
    if (wmPreviewDrag) { saveWatermarkDefaults(); wmPreviewDrag = null; }
  });

  function wireWatermarkCard(key) {
    const w = WATERMARK_DEFAULTS[key];
    const enabledInput = document.getElementById('wm-' + key + '-enabled');
    const textInput = document.getElementById('wm-' + key + '-text');
    const opacityInput = document.getElementById('wm-' + key + '-opacity');
    const logoScaleInput = document.getElementById('wm-' + key + '-logoscale');
    // Position and Watermark Type are now the card-button grids above (see
    // wmPositionBtnHtml/wmTypeBtnHtml + setWatermarkPosition/setWatermarkMode) instead
    // of <select> dropdowns, since those buttons also show/hide the Logo/Text fields
    // and need their own "active" highlight updated — simplest to have them trigger a
    // full re-render of this page rather than patching several things in place here.

  // Guests favorite photos in the guest app, then "Share with Photographer" (My
  // Favorites screen) emails the studio a plain list of the real camera filenames
  // (see shareFavoritesWithPhotographer() in the guest app — it sends p.filename, not
  // a generated id, specifically so it can be pasted straight in here). The
  // photographer pastes that list below, points this at the folder holding the actual
  // full-resolution originals on THIS computer — which can be nested many folders deep
  // (multiple cameras/days/sub-shoots) — and it recursively searches every subfolder
  // for exact-name matches and copies just those files into a new
  // "snapfilmer-favorites" folder, so nobody has to hunt through thousands of RAW/JPEG
  // files by hand.
  //
  // This needs the File System Access API (showDirectoryPicker + createWritable) —
  // real read/write access to an arbitrary folder on disk is a Chrome/Edge-on-desktop
  // feature; Safari and every mobile browser refuse to grant it at all, so
  // favExtractSupported() gates the whole UI and explains that plainly instead of the
  // buttons just silently doing nothing.
  let favExtractRootHandle = null;
  let favExtractResults = [];
  let favExtractRunning = false;

  async function selectFavExtractFolder() {
    if (!favExtractSupported()) return;
    try {
      favExtractRootHandle = await window.showDirectoryPicker();
      const statusEl = document.getElementById('favext-folder-status');
      if (statusEl) { statusEl.textContent = 'Selected: "' + favExtractRootHandle.name + '" — will search this folder and everything inside it.'; statusEl.style.color = 'var(--ink)'; }

  // Recursively walks a directory handle, collecting { name, handle } for every FILE
  // found at any depth — this is what lets one selected top-level folder (with
  // cameras/days/sub-shoots nested inside it) get fully searched instead of just its
  // immediate contents.
  async function walkFavExtractDir(dirHandle, out) {
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file') {
        out.push({ name: entry.name, handle: entry });
      } else if (entry.kind === 'directory') {
        // Never descend into a folder this tool itself created on a previous run —
        // otherwise re-running it would "find" its own previously-copied output and
        // copy it right back into itself.
        if (entry.name === 'snapfilmer-favorites') continue;
        await walkFavExtractDir(entry, out);
      }
    }
  }

  async function runFavoriteExtraction() {
    if (!favExtractRootHandle || favExtractRunning) return;
    const namesEl = document.getElementById('favext-names');
    const wanted = (namesEl ? namesEl.value : '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (!wanted.length) return;

    favExtractRunning = true;
    favExtractResults = [];
    const runBtn = document.getElementById('favext-run-btn');
    const pickBtn = document.getElementById('favext-pick-btn');
    if (runBtn) { runBtn.disabled = true; runBtn.textContent = 'Scanning folder…'; }
    if (pickBtn) pickBtn.disabled = true;
    const progressWrap = document.getElementById('favext-progress-wrap');
    const progressLabel = document.getElementById('favext-progress-label');
    const progressPct = document.getElementById('favext-progress-pct');
    const progressBar = document.getElementById('favext-progress-bar');
    const summaryEl = document.getElementById('favext-summary');
    const listEl = document.getElementById('favext-results-list');
    if (progressWrap) progressWrap.style.display = 'block';
    if (summaryEl) summaryEl.style.display = 'none';
    if (listEl) listEl.innerHTML = '';
    if (progressLabel) progressLabel.textContent = 'Scanning folder and all its subfolders…';
    if (progressPct) progressPct.textContent = '';
    if (progressBar) progressBar.style.width = '0%';

    try {
      const allFiles = [];
      await walkFavExtractDir(favExtractRootHandle, allFiles);
      // Case-insensitive lookup — first match wins if the same filename somehow shows
      // up in two different subfolders (e.g. two cameras that both reset to
      // IMG_0001.JPG).
      const byLowerName = new Map();
      allFiles.forEach(function (f) { if (!byLowerName.has(f.name.toLowerCase())) byLowerName.set(f.name.toLowerCase(), f); });

      let destDirHandle = null;
      let copied = 0, missing = 0, errors = 0;
      for (let i = 0; i < wanted.length; i++) {
        const name = wanted[i];
        const match = byLowerName.get(name.toLowerCase());
        const row = { name: name };
        if (!match) {
          row.status = 'missing';
          missing++;
        } else {
          try {
            if (!destDirHandle) destDirHandle = await favExtractRootHandle.getDirectoryHandle('snapfilmer-favorites', { create: true });
            const file = await match.handle.getFile();
            const destHandle = await destDirHandle.getFileHandle(match.name, { create: true });
            const writable = await destHandle.createWritable();
            await writable.write(file);
            await writable.close();
            row.status = 'copied';
            row.path = 'snapfilmer-favorites/' + match.name;
            copied++;
          } catch (err) {
            row.status = 'error';
            row.error = (err && err.message) || 'Copy failed';
            errors++;
          }
        }
        favExtractResults.push(row);
        const pct = Math.round(((i + 1) / wanted.length) * 100);
        if (progressLabel) progressLabel.textContent = 'Copying ' + (i + 1) + ' of ' + wanted.length + '…';
        if (progressPct) progressPct.textContent = pct + '%';
        if (progressBar) progressBar.style.width = pct + '%';
        renderFavExtractResultsList();
      }

      if (progressLabel) progressLabel.textContent = 'Extraction completed';
      if (summaryEl) {
        summaryEl.style.display = 'grid';
        summaryEl.innerHTML =
          '<div class="card" style="background:#eef8f2;border-color:#bfe3cd;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:800;color:#1FA97A;">' + copied + '</div><div class="card-sub" style="margin:2px 0 0;">Copied</div></div>' +
          '<div class="card" style="background:#fff8ec;border-color:#f0dfb8;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:800;color:#B8860B;">' + missing + '</div><div class="card-sub" style="margin:2px 0 0;">Missing</div></div>' +
          '<div class="card" style="background:#fdf0ef;border-color:#f0c9c7;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:800;color:#D0342C;">' + errors + '</div><div class="card-sub" style="margin:2px 0 0;">Errors</div></div>';
      }
    } catch (err) {
      if (progressLabel) progressLabel.textContent = 'Failed to scan folder: ' + ((err && err.message) || 'unknown error');
    } finally {
      favExtractRunning = false;
      if (pickBtn) pickBtn.disabled = false;
      if (runBtn) runBtn.textContent = 'Extract Favorites';
      updateFavExtractRunButton();
    }
  }

  function renderFavExtractResultsList() {
    const listEl = document.getElementById('favext-results-list');
    if (!listEl) return;
    const statusMeta = {

      missing: { label: 'Missing', color: '#B8860B' },

        '<div style="min-width:0;"><div style="font-weight:700;font-size:12.5px;">' + (i + 1) + '. ' + escapeHtmlGD(r.name) + '</div>' +

        '<div style="font-size:11.5px;font-weight:800;color:' + meta.color + ';white-space:nowrap;">' + meta.label + '</div>' +
      '</div>';
    }).join('');
  }

  // Logo storage mirrors uploadStudioLogo() — small resized PNG data URL, stored
  // directly on the event doc (well under Firestore's 1MB doc cap).
  function uploadSponsorLogo(evt, eventId) {
    const file = evt.target.files && evt.target.files[0];
    evt.target.value = '';
    if (!file) return;
    const e = EVENTS.find(function (x) { return x.id === eventId; });
    if (!e) return;
    const reader = new FileReader();
    reader.onload = function () {
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        const maxDim = 240;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        e.watermark.sponsorLogoUrl = canvas.toDataURL('image/png');
        syncEventPrivacyToCloud(eventId, { watermark: e.watermark });
        // Refresh only the Watermark tab's own content (not the whole event-detail
        // page via renderEventDetail) — that full rebuild resets the tab strip back
        // to "General" every time, which is what was kicking studios out of whatever
        // tab they were on after any watermark change.
        if (currentPage === 'event-detail' && currentEventId === eventId) renderEventDetailTab('watermark', e);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function removeSponsorLogo(eventId) {
    const e = EVENTS.find(function (x) { return x.id === eventId; });
    if (!e) return;
    if (!confirm('Remove the sponsor logo from this event\'s watermark?')) return;
    e.watermark.sponsorLogoUrl = '';
    syncEventPrivacyToCloud(eventId, { watermark: e.watermark });
    if (currentPage === 'event-detail' && currentEventId === eventId) renderEventDetailTab('watermark', e);
  }

  function createTicket() {
    const subjectInput = document.getElementById('ticket-subject-input');
    const categorySelect = document.getElementById('ticket-category-select');
    const messageInput = document.getElementById('ticket-message-input');
    const subject = subjectInput ? subjectInput.value.trim() : '';
    const category = categorySelect ? categorySelect.value : 'Other';
    const message = messageInput ? messageInput.value.trim() : '';
    if (!subject || !message) { alert('Please add a subject and a message.'); return; }
    if (!db) { alert('Not connected — check your internet connection.'); return; }
    const now = new Date();
    db.collection('tickets').add({
      subject: subject, category: category, message: message, status: 'open',
      createdAt: now.getTime(),
      date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }),
    }).then(function () {
      if (subjectInput) subjectInput.value = '';
      if (messageInput) messageInput.value = '';
    }).catch(function () {
      alert('Could not submit — check your internet connection and try again.');
    });
  }

  function toggleTicketStatus(id, currentStatus) {
    if (!db) return;
    db.collection('tickets').doc(id).update({ status: currentStatus === 'resolved' ? 'open' : 'resolved' }).catch(function () {});
  }

  function deleteTicket(id) {
    if (!confirm('Delete this ticket?')) return;
    if (!db) return;
    db.collection('tickets').doc(id).delete().catch(function () {});

  function createSaleEvent() {
    const select = document.getElementById('sale-event-select');
    const priceInput = document.getElementById('sale-price-input');
    const msg = document.getElementById('create-sale-msg');
    const eventId = select ? select.value : '';
    const price = priceInput ? Number(priceInput.value) : 0;
    const ev = EVENTS.find(function (e) { return e.id === eventId; });
    if (!ev || !price || price <= 0) {
      if (msg) { msg.style.color = '#D0342C'; msg.textContent = 'Pick an event and enter a valid price per photo.'; msg.style.display = 'block'; }
      return;
    }
    const existing = SALES.topEvents.find(function (t) { return t.name === ev.name; });
    if (!existing) {
      SALES.topEvents.unshift({ name: ev.name, sold: 0, revenue: 0 });
      renderTopEventsList();
    }
    if (msg) {
      msg.style.color = 'var(--green)';
      msg.textContent = 'Sale event created for "' + ev.name + '" at ₹' + price + '/photo. Note: real payments (Razorpay/PayPal/PhonePe) still need to be connected before this can accept money.';
      msg.style.display = 'block';
    }
  }

    const sizePx = { '1x': 12, '2x': 16, '3x': 22, '4x': 30, '5x': 40 }[w.size] || 22;
    const rotation = w.orientation === 'diagonal' ? -30 : w.orientation === 'vertical' ? -90 : 0;
    overlay.innerHTML = '<div style="transform:rotate(' + rotation + 'deg);white-space:nowrap;font-weight:800;letter-spacing:2px;font-size:' + sizePx + 'px;color:' + w.color + ';opacity:' + (w.opacity / 100) + ';">' +
      (Array(8).fill(w.text || 'FOR SALE').join('&nbsp;&nbsp;&nbsp;&nbsp;')) + '</div>';
  }

  function renderLineChart(container, labels, values) {
    const w = 640, h = 180, pad = 20;
    const max = Math.max.apply(null, values);
    const min = Math.min.apply(null, values);
    const stepX = (w - pad * 2) / (values.length - 1);
    const points = values.map(function (v, i) {
      const x = pad + i * stepX;
      const y = h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
      return x + ',' + y;
    }).join(' ');
    const areaPoints = points + ' ' + (pad + (values.length - 1) * stepX) + ',' + (h - pad) + ' ' + pad + ',' + (h - pad);
    container.innerHTML =
      '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:180px;">' +
        '<polygon points="' + areaPoints + '" fill="rgba(255,90,54,0.12)"/>' +
        '<polyline points="' + points + '" fill="none" stroke="#4B5D3A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '</svg>' +
      '<div style="display:flex;justify-content:space-between;margin-top:6px;">' +
        labels.map(function (l) { return '<span style="font-size:9.5px;color:var(--muted);font-weight:700;">' + l + '</span>'; }).join('') +
      '</div>';
  }

          ? '<div style="display:flex;align-items:center;gap:10px;margin:14px 0;padding:10px 12px;background:var(--bg);border-radius:10px;">' +
              '<audio controls src="' + STUDIO.reelMusicUrl + '" style="flex:1;height:32px;"></audio>' +
            '</div>' +
            '<div style="display:flex;gap:10px;">' +
              '<label class="btn-outline btn-sm">Replace Track<input type="file" accept="audio/*" style="display:none" onchange="uploadReelMusic(event)"></label>' +
              '<button class="btn-outline btn-sm" style="color:#D0342C;border-color:#f0c9c7;" onclick="removeReelMusic()">Remove</button>' +
            '</div>'
          : '<label class="btn-outline btn-sm" style="margin-top:12px;">Upload Track<input type="file" accept="audio/*" style="display:none" onchange="uploadReelMusic(event)"></label>') +
      '</div>';
    fillIcons();
    wireProfileWizardStep(profileWizardStep);
    // A fresh iframe always starts by loading whatever's actually saved in Firestore —
    // push the current in-memory (possibly unsaved) draft the moment it finishes
    // loading, so switching wizard steps doesn't make the preview flash back to stale
    // saved data before catching up with edits made earlier in this same visit.
    const pwIframe = document.getElementById('pw-phone-iframe');
    if (pwIframe) pwIframe.addEventListener('load', postProfileDraftToPreview);

    const prefUploads = document.getElementById('pref-new-uploads');
    const prefOrders = document.getElementById('pref-new-orders');
    const prefWeekly = document.getElementById('pref-weekly-summary');
    if (prefUploads) prefUploads.addEventListener('change', function () { NOTIFICATION_PREFS.newGuestUploads = prefUploads.checked; saveNotificationPrefs(); });
    if (prefOrders) prefOrders.addEventListener('change', function () { NOTIFICATION_PREFS.newOrders = prefOrders.checked; saveNotificationPrefs(); });
    if (prefWeekly) prefWeekly.addEventListener('change', function () { NOTIFICATION_PREFS.weeklySummary = prefWeekly.checked; saveNotificationPrefs(); });
    const reelsToggle = document.getElementById('toggle-reels-enabled');
    if (reelsToggle) reelsToggle.addEventListener('change', function () { toggleReelsEnabled(reelsToggle.checked); });
  }

  // Master on/off switch for the guest app's "Create My Reel" feature — see the
  // reelsEnabled comment on STUDIO above and the guard in the guest app's
  // openMyReel(). Saved to the same studio/profile doc the phone preview iframe
  // already reads from, so the live preview reflects the change immediately.
  function toggleReelsEnabled(enabled) {
    STUDIO.reelsEnabled = enabled;
    if (db) db.collection('studio').doc('profile').set({ reelsEnabled: enabled }, { merge: true }).catch(showSyncFailureToast);
    postProfileDraftToPreview();
  }

  function profileWizardStepContent(key) {
    if (key === 'company') {
      return '<div class="card-title">Company Info</div>' +
        '<div class="field"><label>Company Name</label><input class="input" id="pw-name" value="' + STUDIO.name + '"></div>' +
        '<div class="field"><label>Custom subdomain <span style="font-weight:400;color:var(--muted);">(optional)</span></label><input class="input" id="pw-subdomain" placeholder="e.g. mystudio" value="' + STUDIO.subdomain + '"></div>' +
        '<div class="hint" style="margin-bottom:16px;">Saved for your reference — guest links are still shared from Events &rarr; Share &amp; QR (this build runs on one shared address, not a real per-studio subdomain yet). Your gallery link: ' + GUEST_APP_URL + '?event=&lt;eventid&gt;</div>' +
        '<div class="field" style="margin-bottom:6px;"><label>About your company</label><textarea class="input" id="pw-about" rows="8" maxlength="1000" style="resize:vertical;">' + STUDIO.about + '</textarea></div>' +
        '<div style="text-align:right;font-size:11px;color:var(--muted);" id="pw-about-count">' + STUDIO.about.length + ' / 1000</div>';
    }
    if (key === 'contact') {
      return '<div class="card-title">Contact Info</div>' +
        '<div class="field"><label>Mobile Number</label><input class="input" id="pw-phone" value="' + STUDIO.phone + '"></div>' +
        '<div class="field"><label>Website Link</label><input class="input" id="pw-website" placeholder="https://" value="' + STUDIO.website + '"></div>' +
        '<div class="hint" style="margin-top:-10px;margin-bottom:16px;">Don\'t have a website? You can use your Instagram, portfolio, or any other profile link.</div>' +
        '<div class="field" style="margin-bottom:0;"><label>Email</label><input class="input" id="pw-email" value="' + STUDIO.email + '"></div>';
    }
    if (key === 'color') {
      return '<div class="card-title">Color Theme</div>' +
        '<div class="card-sub">Used for accents across your dashboard and guest galleries.</div>' +
        '<label style="font-size:12.5px;font-weight:700;display:block;margin-bottom:8px;">Select your Brand Color</label>' +
        '<div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;">' +
          '<input type="color" id="pw-color" value="' + STUDIO.brandColor + '" style="width:52px;height:44px;padding:2px;border:1px solid var(--border);border-radius:10px;cursor:pointer;">' +
          '<input class="input" id="pw-color-hex" value="' + STUDIO.brandColor + '" style="flex:1;">' +
        '</div>' +
        '<label style="font-size:12.5px;font-weight:700;display:block;margin-bottom:8px;">Quick Colors</label>' +
        '<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:0;" id="pw-quick-colors">' +
          QUICK_COLORS.map(function (c) {
            return '<button type="button" class="pw-quick-color' + (c.toLowerCase() === STUDIO.brandColor.toLowerCase() ? ' active' : '') + '" style="background:' + c + ';" data-color="' + c + '" title="' + c + '"></button>';
          }).join('') +
        '</div>';
    }
    if (key === 'photos') {
      return '<div class="card-title">Photos</div>' +
        '<div class="grid-2">' +
          '<div>' +
            '<label style="font-size:12.5px;font-weight:700;display:block;margin-bottom:8px;">Profile Photo</label>' +
            (STUDIO.logoUrl
              ? '<img src="' + STUDIO.logoUrl + '" style="width:100%;max-width:180px;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--border);display:block;margin-bottom:10px;">'
              : '<div style="width:100%;max-width:180px;aspect-ratio:1;border-radius:12px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;margin-bottom:10px;">No logo yet</div>') +
            '<div style="display:flex;gap:8px;">' +
              '<label class="btn-outline btn-sm" style="cursor:pointer;">' + ICONS.UPLOAD + ' Change' +
                '<input type="file" accept="image/*" style="display:none" onchange="uploadStudioLogo(event);setTimeout(function(){renderProfileWizard(document.getElementById(\'page-content\'));},50);">' +
              '</label>' +
              (STUDIO.logoUrl ? '<button class="btn-outline btn-sm" style="color:#D0342C;border-color:#f0c9c7;" onclick="removeStudioLogo();setTimeout(function(){renderProfileWizard(document.getElementById(\'page-content\'));},50);">Remove</button>' : '') +
            '</div>' +
            '<div class="hint">Shown as a round photo in your gallery</div>' +
          '</div>' +
          '<div>' +
            '<label style="font-size:12.5px;font-weight:700;display:block;margin-bottom:8px;">Cover Photo</label>' +
            (STUDIO.coverUrl
              ? '<div style="position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/10;margin-bottom:10px;"><img src="' + STUDIO.coverUrl + '" style="width:100%;height:100%;object-fit:cover;display:block;"></div>'
              : '<div style="width:100%;aspect-ratio:16/10;border-radius:12px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;margin-bottom:10px;">No cover yet</div>') +
            '<div style="display:flex;gap:8px;">' +
              '<label class="btn-outline btn-sm" style="cursor:pointer;">' + ICONS.UPLOAD + ' Change' +
                '<input type="file" accept="image/*" style="display:none" onchange="uploadStudioCover(event)">' +
              '</label>' +
              (STUDIO.coverUrl ? '<button class="btn-outline btn-sm" style="color:#D0342C;border-color:#f0c9c7;" onclick="removeStudioCover()">Remove</button>' : '') +
            '</div>' +
            '<div class="hint">Displayed as the Portfolio banner, and as the default cover photo for brand-new events</div>' +
          '</div>' +
        '</div>';
    }
    if (key === 'social') {
      const filled = Object.values(STUDIO.social).filter(Boolean).length;
      return '<div class="card-title">Social Media Links</div>' +
        '<div class="card-sub">Add at least 2 social links to your profile <span data-social-counter style="font-weight:800;color:' + (filled >= 2 ? 'var(--accent-ink)' : 'var(--muted)') + ';">(' + filled + '/2' + (filled >= 2 ? ' &#10003;' : '') + ')</span></div>' +
        socialRowHtml('instagram', 'INSTAGRAM', 'Instagram', STUDIO.social.instagram) +
        socialRowHtml('youtube', 'YOUTUBE', 'YouTube', STUDIO.social.youtube) +
        socialRowHtml('whatsapp', 'WHATSAPP', 'WhatsApp', STUDIO.social.whatsapp) +
        socialRowHtml('vimeo', 'VIMEO', 'Vimeo', STUDIO.social.vimeo);
    }
    if (key === 'portfolio') {
      return '<div class="card-title">Portfolio Event</div>' +
        '<div class="card-sub">Your portfolio event showcases your best work — guests browsing your studio before joining a specific event see this one\'s real albums and photos.</div>' +
        '<div class="field" style="margin-bottom:0;"><label>Portfolio Event</label><select class="input" id="pw-portfolio-event">' +
          '<option value="">&mdash; None &mdash;</option>' +
          EVENTS.map(function (e) { return '<option value="' + e.id + '"' + (STUDIO.portfolioEventId === e.id ? ' selected' : '') + '>' + e.name + ' (' + e.id + ')</option>'; }).join('') +
        '</select></div>' +
        (EVENTS.length === 0
          ? '<div class="hint" style="margin-top:10px;background:#FBF3D9;border:1px solid #F0DFA0;border-radius:10px;padding:12px;color:#7A5C00;">No events created yet? Create one first (Events &rarr; Create Event), then come back and pick it here as your showcase.</div>'
          : '');
    }
    return '';
  }

  function socialRowHtml(key, iconName, label, value) {
    return '<div class="field"><label style="display:flex;align-items:center;gap:8px;">' + ICONS[iconName] + label + '</label>' +
      '<div style="display:flex;gap:8px;">' +
        '<input class="input" id="pw-social-' + key + '" placeholder="Link or number" value="' + value + '" style="flex:1;">' +
        '<button class="icon-mini" id="pw-social-' + key + '-clear" title="Clear" style="' + (value ? '' : 'display:none;') + '" onclick="clearSocialField(\'' + key + '\')"><i data-icon="TRASH"></i></button>' +
      '</div></div>';
  }

  function clearSocialField(key) {
    const input = document.getElementById('pw-social-' + key);
    if (!input) return;
    input.value = '';
    STUDIO.social[key] = '';
    const clearBtn = document.getElementById('pw-social-' + key + '-clear');
    if (clearBtn) clearBtn.style.display = 'none';
    const counter = document.querySelector('.card-sub span[data-social-counter]');
    if (counter) {
      const filled = Object.values(STUDIO.social).filter(Boolean).length;
      counter.textContent = '(' + filled + '/2' + (filled >= 2 ? ' ✓' : '') + ')';
      counter.style.color = filled >= 2 ? 'var(--accent-ink)' : 'var(--muted)';
    }
    postProfileDraftToPreview();
  }

  // Pushes the whole current STUDIO shape to Firestore — this is the only thing that
  // actually goes live for real guests, and only happens on Save/Save & Next.
  function persistStudioProfileToCloud() {
    if (!db) { showSyncFailureToast(null); return; }
    db.collection('studio').doc('profile').set({
      name: STUDIO.name, email: STUDIO.email, phone: STUDIO.phone, website: STUDIO.website,
      about: STUDIO.about, brandColor: STUDIO.brandColor, social: STUDIO.social,
      subdomain: STUDIO.subdomain, portfolioEventId: STUDIO.portfolioEventId,
    }, { merge: true }).catch(showSyncFailureToast);
    renderSidebar();
  }

  let guestAppOrigin = null;
  try { guestAppOrigin = new URL(GUEST_APP_URL).origin; } catch (e) { guestAppOrigin = '*'; }

  // Posts the current in-memory (not-yet-saved) STUDIO fields into the preview iframe
  // so it updates instantly as the studio types/clicks — without writing anything to
  // Firestore, so real guests never see a draft. The iframe runs the actual guest app,
  // which applies these via the exact same applyStudioProfile() its live Firestore
  // listener normally calls (see the 'message' listener added in the guest app).
  function postProfileDraftToPreview() {
    const iframe = document.getElementById('pw-phone-iframe');
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage({
      type: 'SNAPFILMER_PROFILE_DRAFT',
      profile: {
        name: STUDIO.name, email: STUDIO.email, phone: STUDIO.phone, website: STUDIO.website,
        about: STUDIO.about, brandColor: STUDIO.brandColor, social: STUDIO.social,
        logoUrl: STUDIO.logoUrl, coverUrl: STUDIO.coverUrl, portfolioEventId: STUDIO.portfolioEventId,
        reelsEnabled: STUDIO.reelsEnabled,
      },
    }, guestAppOrigin);
  }

  function wireProfileWizardStep(key) {
    // Inputs mutate STUDIO in-memory as the studio types AND push a live draft into the
    // preview iframe (postProfileDraftToPreview) so the preview feels instant — but the
    // actual Firestore write (what real guests would ever see) only happens on
    // Save/Save & Next, via persistStudioProfileToCloud().
    function bind(id, apply) {
      const input = document.getElementById(id);
      if (!input) return;
      input.addEventListener('input', function () { apply(input.value); postProfileDraftToPreview(); });
    }
    if (key === 'company') {
      bind('pw-name', function (v) { STUDIO.name = v; });
      bind('pw-subdomain', function (v) { STUDIO.subdomain = v; });
      bind('pw-about', function (v) {
        STUDIO.about = v;
        const counter = document.getElementById('pw-about-count');
        if (counter) counter.textContent = v.length + ' / 1000';
      });
    }
    if (key === 'contact') {
      bind('pw-phone', function (v) { STUDIO.phone = v; });
      bind('pw-website', function (v) { STUDIO.website = v; });
      bind('pw-email', function (v) { STUDIO.email = v; });
    }
    if (key === 'color') {
      const colorPicker = document.getElementById('pw-color');
      const colorHex = document.getElementById('pw-color-hex');
      if (colorPicker && colorHex) {
        colorPicker.addEventListener('input', function () {
          colorHex.value = colorPicker.value;
          STUDIO.brandColor = colorPicker.value;
          postProfileDraftToPreview();
        });
        colorHex.addEventListener('input', function () {
          if (/^#[0-9a-fA-F]{6}$/.test(colorHex.value)) {
            colorPicker.value = colorHex.value;
            STUDIO.brandColor = colorHex.value;
            postProfileDraftToPreview();
          }
        });
      }
      document.querySelectorAll('#pw-quick-colors [data-color]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          STUDIO.brandColor = btn.dataset.color;
          document.querySelectorAll('#pw-quick-colors [data-color]').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          if (colorPicker) colorPicker.value = STUDIO.brandColor;
          if (colorHex) colorHex.value = STUDIO.brandColor;
          postProfileDraftToPreview();
        });
      });
    }
    if (key === 'social') {
      ['instagram', 'youtube', 'whatsapp', 'vimeo'].forEach(function (k) {
        const input = document.getElementById('pw-social-' + k);
        const clearBtn = document.getElementById('pw-social-' + k + '-clear');
        if (input) input.addEventListener('input', function () {
          STUDIO.social[k] = input.value;
          // Toggle the clear button + "N/2" counter directly instead of re-rendering
          // the whole step — a full re-render would rebuild every input and knock
          // focus out of whichever field the studio is mid-typing in.
          if (clearBtn) clearBtn.style.display = input.value ? '' : 'none';
          const counter = document.querySelector('.card-sub span[data-social-counter]');
          if (counter) {
            const filled = Object.values(STUDIO.social).filter(Boolean).length;
            counter.textContent = '(' + filled + '/2' + (filled >= 2 ? ' ✓' : '') + ')';
            counter.style.color = filled >= 2 ? 'var(--accent-ink)' : 'var(--muted)';
          }
          postProfileDraftToPreview();
        });
      });
    }
    if (key === 'portfolio') {
      const sel = document.getElementById('pw-portfolio-event');
      if (sel) sel.addEventListener('change', function () { STUDIO.portfolioEventId = sel.value; postProfileDraftToPreview(); });
    }
  }

  function saveProfileWizardStep(advance) {
    const btn = document.getElementById('pw-save-btn');
    persistStudioProfileToCloud();
    if (btn) {
      btn.textContent = 'Saved ✓';
      setTimeout(function () { if (btn) btn.textContent = 'Save'; }, 1200);
    }
    if (advance) {
      const idx = PROFILE_WIZARD_STEPS.findIndex(function (s) { return s.key === profileWizardStep; });
      if (idx < PROFILE_WIZARD_STEPS.length - 1) setProfileWizardStep(PROFILE_WIZARD_STEPS[idx + 1].key);
    } else {
      renderProfileWizard(document.getElementById('page-content'));
    }
  }

  // ================= Init =================
  // renderShell() + showPage() are now triggered from the onAuthStateChanged listener
  // above, once we know the signed-in user is actually authorized (or the login screen
  // is shown instead if not signed in / not authorized).
</script>
</body>
</html>
