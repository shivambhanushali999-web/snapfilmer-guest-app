<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SnapFilmer Studio</title>
<!-- Firebase (Firestore + Auth) — same project/backend as the guest app, so uploads here show up there -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<!-- Reads real camera/lens/capture-date metadata straight out of the JPEG bytes at
     upload time (see extractExifTags()) — powers the Photo Details panel in the
     lightbox instead of showing made-up EXIF values. -->
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
<style>
  :root {
    /* Earthy sage-green / warm cream palette, matched to the guest app's palette. */
    --bg: #F5F1E7;
    --surface: #FFFFFF;
    --ink: #2B2F22;
    --muted: #7C7A6C;
    --accent: #4B5D3A;
    --accent-soft: #E6E8E3;
    --accent-ink: #3B492D;
    --border: #E8E2D2;
    --green: #1FA97A;
    --green-soft: #E4F7EF;
    --blue: #3A7CFF;
    --blue-soft: #E8EFFF;
    --sidebar-w: 244px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); }

  [data-icon] { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
  [data-icon] svg { display: block; }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ---- App shell ----
     Real Kamero uses a single horizontal top nav bar (not a left sidebar) — the
     ".sidebar" class below is deliberately re-skinned to lay out horizontally rather
     than renamed, so the existing renderSidebar()/NAV_GROUPS JS keeps working as-is. */
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  .sidebar {
    width: 100%; flex-shrink: 0; background: var(--accent-ink); color: #fff; border-bottom: 1px solid rgba(0,0,0,.1);
    display: flex; flex-direction: row; align-items: center; position: sticky; top: 0; z-index: 20;
    height: 60px; overflow-x: auto; overflow-y: hidden; padding: 0 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 18px 0 0; flex-shrink: 0; }
  .brand .mark { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.15); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12.5px; }
  .brand .nm { font-weight: 800; font-size: 14.5px; letter-spacing: -.3px; color: #fff; }
  .brand .sub { display: none; }

  .nav-group { display: flex; align-items: center; flex-shrink: 0; }
  .nav-label { display: none; }
  .nav-link {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; cursor: pointer;
    color: rgba(255,255,255,.82); font-size: 12.5px; font-weight: 700; margin: 0 2px; white-space: nowrap; flex-shrink: 0;
  }
  .nav-link:hover { background: rgba(255,255,255,.1); }
  .nav-link.active { background: #fff; color: var(--accent-ink); }
  .nav-link .badge { margin-left: 2px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
  /* Secondary nav groups render icon-only, like Kamero's compact top-bar icon
     buttons, to leave room for every page without crowding a single-row nav. */
  .nav-group.icon-only .nav-link span:not(.badge) { display: none; }
  .nav-group.icon-only .nav-link { padding: 9px; }
  .nav-group + .nav-group { margin-left: 4px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,.15); }
  .nav-right-spacer { margin-left: auto; }

  .sidebar-foot { display: none; } /* credits now live on the Home page's Available Credits card instead */

  .nav-panel { display: flex; align-items: center; flex: 1; min-width: 0; }
  .nav-toggle {
    display: none; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.1); border: none;
    color: #fff; align-items: center; justify-content: center; cursor: pointer; margin-left: auto; flex-shrink: 0;
  }

  /* ---- Mobile nav: below this width the horizontal nav bar can't fit, so it
     collapses into a hamburger button that opens a dropdown panel instead. ---- */
  @media (max-width: 860px) {
    .sidebar { position: relative; overflow: visible; padding: 0 12px; }
    .brand .sub { display: none; }
    .nav-toggle { display: flex; }
    .nav-panel {
      display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 25;
      background: var(--accent-ink); flex-direction: column; align-items: stretch;
      max-height: calc(100vh - 60px); overflow-y: auto; padding: 6px 12px 14px;
      box-shadow: 0 14px 28px rgba(0,0,0,.28); border-bottom-left-radius: 14px; border-bottom-right-radius: 14px;
    }
    .sidebar.nav-open .nav-panel { display: flex; }
    .nav-group { flex-direction: column; align-items: stretch; width: 100%; }
    .nav-group.icon-only .nav-link span:not(.badge) { display: inline; }
    .nav-group.icon-only .nav-link { padding: 10px 12px; }
    .nav-link { width: 100%; margin: 2px 0; }
    .nav-group + .nav-group { margin-left: 0; padding-left: 0; border-left: none; border-top: 1px solid rgba(255,255,255,.15); padding-top: 8px; margin-top: 8px; }

    .topbar { padding: 0 14px; }
    .search-box { display: none; }
    .content { padding: 18px 14px 60px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }

    /* Wide tables scroll within their own card instead of blowing out page width. */
    .table-card { overflow-x: auto; }
    .table-card table { min-width: 560px; }
  }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 56px; flex-shrink: 0; border-bottom: 1px solid var(--border); background: rgba(250,250,248,.9);
    backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
    position: sticky; top: 60px; z-index: 10;
  }
  .page-title { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; height: 36px; width: 220px; color: var(--muted); }
  .search-box input { border: none; outline: none; background: none; font-size: 13px; flex: 1; color: var(--ink); }
  .icon-btn { width: 36px; height: 36px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); flex-shrink: 0; }
  /* Red count badge on the topbar bell — shows new enquiries since this was last opened
     (see startEnquiriesBadgeSync()/updateTopbarNotifBadge() in the script below). */
  .notif-badge { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; background: #FF4747; color: #fff; font-size: 10px; font-weight: 800; align-items: center; justify-content: center; border: 2px solid var(--bg); box-sizing: border-box; }
  .avatar { width: 36px; height: 36px; border-radius: 12px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; cursor: pointer; flex-shrink: 0; }

  .content { flex: 1; padding: 26px 28px 60px; overflow-y: auto; }
  .page { display: none; }
  .page.active { display: block; }

  /* ---- Generic building blocks ---- */
  .btn-solid { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 10px 18px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-outline { background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 12px; padding: 9px 16px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-outline.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .account-menu { position: absolute; top: 48px; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.14); width: 230px; padding: 8px; z-index: 60; }
  .account-menu-item { padding: 10px 12px; font-size: 12.5px; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 9px; color: var(--ink); }
  .account-menu-item:hover { background: var(--bg); }
  .account-menu-divider { height: 1px; background: var(--border); margin: 6px 4px; }
  .btn-ghost { background: none; color: var(--muted); border: 1px solid var(--border); border-radius: 12px; padding: 9px 16px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 10px; }
  .btn-danger { background: #FDECEA; color: #D64545; border: none; border-radius: 12px; padding: 9px 16px; font-weight: 700; font-size: 12.5px; cursor: pointer; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
  .card-title { font-weight: 800; font-size: 14.5px; margin: 0 0 4px; }
  .card-sub { color: var(--muted); font-size: 12px; margin: 0 0 16px; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
  .stat-card .top-row { display: flex; align-items: center; justify-content: space-between; }
  .stat-card .ic { width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
  .stat-card .trend { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 10px; }
  .stat-card .trend.up { color: var(--green); background: var(--green-soft); }
  .stat-card .val { font-size: 25px; font-weight: 800; margin-top: 14px; letter-spacing: -.5px; }
  .stat-card .lbl { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .section-row { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 14px; }
  .section-row h3 { font-size: 15.5px; font-weight: 800; margin: 0; }
  .section-row a.link { color: var(--accent); font-size: 12.5px; font-weight: 700; cursor: pointer; }

  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 800; padding: 0 12px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 6px 14px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.orange { background: var(--accent-soft); color: var(--accent-ink); }
  .pill.gray { background: var(--border); color: var(--muted); }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }

  .ev-cell { display: flex; align-items: center; gap: 10px; }
  .ev-cell img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
  .ev-cell .nm { font-weight: 700; font-size: 13px; }
  .ev-cell .dt { font-size: 11px; color: var(--muted); }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .icon-mini { width: 30px; height: 30px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }

  /* ---- Switch ---- */
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; cursor: pointer; transition: .2s; }
  .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #514D53; margin-bottom: 6px; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .input, select.input, textarea.input {
    width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 11px; padding: 10px 13px;
    font-size: 13px; color: var(--ink); outline: none; font-family: inherit;
  }
  .input:focus { border-color: var(--accent); }
  .field-pass-wrap { position: relative; }
  .field-pass-wrap .input { padding-right: 40px; }
  .field-eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer; display: flex; padding: 2px;
  }
  .field-eye svg { width: 17px; height: 17px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row .t { font-weight: 700; font-size: 13px; }
  .toggle-row .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; max-width: 380px; }

  .tabs-row { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 5px; width: fit-content; margin-bottom: 20px; }
  .tab-btn { padding: 9px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .tab-btn.active { background: var(--ink); color: #fff; }

  .empty-note { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

  /* Watermark config: Position / Type picker buttons, styled like real Kamero's
     "Choose Position" / "Watermark Type" cards (a highlighted card-button, not a
     dropdown) so the whole settings column reads the same way. */
  .wm-pos-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer; text-align: center; }
  .wm-pos-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .wm-pos-btn.wm-type-btn { justify-content: flex-start; padding-left: 14px; width: 100%; }

  /* Update Profile wizard — step pills + progress bar (Company Info / Contact Info /
     Color Theme / Photos / Social Links / Portfolio), matching Kamero's own profile
     setup flow instead of one long flat settings form. */
  .pw-step-pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .pw-step-pill .num { width: 20px; height: 20px; border-radius: 50%; background: var(--border); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
  .pw-step-pill.done { color: var(--accent-ink); border-color: var(--accent-soft); background: var(--accent-soft); }
  .pw-step-pill.done .num { background: var(--accent); color: #fff; }
  .pw-step-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pw-step-pill.active .num { background: rgba(255,255,255,.25); color: #fff; }
  .pw-progress-track { height: 6px; border-radius: 4px; background: var(--border); margin: 14px 0 22px; overflow: hidden; }
  .pw-progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .2s ease; }
  .pw-quick-color { width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
  .pw-quick-color.active { border-color: var(--ink); }

  /* Create Event wizard — matches Kamero's own "Create New Event" layout: a vertical
     labelled rail (EVENT DETAILS / SETTINGS / HOSTS) down the left of each section
     instead of plain stacked cards. */
  .wiz-section { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
  .wiz-rail { width: 56px; flex-shrink: 0; background: var(--accent-soft); color: var(--accent-ink); display: flex; flex-direction: column; align-items: center; padding: 22px 0; gap: 16px; }
  .wiz-rail .lbl { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 800; letter-spacing: 1.5px; }
  .wiz-body { flex: 1; min-width: 0; padding: 22px 26px; }
  .wiz-req { color: #E5484D; }
  .wiz-help { display: inline-flex; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-size: 9.5px; align-items: center; justify-content: center; cursor: help; flex-shrink: 0; }
  .dl-opt-btn { display: flex; align-items: center; gap: 9px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .dl-opt-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  .dl-opt-btn svg { flex-shrink: 0; }
  .host-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: start; margin-bottom: 12px; }

  /* Live phone preview — the real guest app embedded in an iframe (see
     renderProfileWizard). The guest app's CSS assumes a real phone's viewport width
     (via <meta viewport width=device-width>), so simply squeezing the iframe itself
     down to the mockup's ~250px content box makes "device-width" resolve to 250px,
     way below any real phone and far outside anything the guest app's layout was
     built to handle — that's what caused the overlapping/cramped screenshot. Instead
     the iframe renders at a real phone size (400x800) and is scaled down with a CSS
     transform to fit the mockup frame, the standard device-preview trick — the guest
     app always thinks it has a normal phone's width, it just displays smaller here. */
  .pw-phone-frame { width: 270px; height: 520px; border-radius: 34px; border: 10px solid #1a1a1a; background: #1a1a1a; box-shadow: 0 24px 60px -20px rgba(0,0,0,.4); flex-shrink: 0; overflow: hidden; position: relative; }
  .pw-phone-screen { width: 400px; height: 800px; transform: scale(0.625); transform-origin: top left; border: none; display: block; background: #F5F1E8; }

  /* ---- WhatsApp Inbox (Messages page) ----
     Two-pane layout: conversation list on the left, active thread on the right —
     same shape as the WhatsApp Web / WhatsApp Business app the studio already knows. */
  .wa-shell { display: flex; height: calc(100vh - 140px); min-height: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
  .wa-list { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; }
  .wa-list-row { display: flex; gap: 10px; align-items: center; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .wa-list-row:hover { background: var(--bg); }
  .wa-list-row.active { background: var(--accent-soft); }
  .wa-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
  .wa-list-meta { flex: 1; min-width: 0; }
  .wa-list-name { font-weight: 800; font-size: 13px; }
  .wa-list-preview { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .wa-list-time { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .wa-unread-dot { min-width: 18px; height: 18px; border-radius: 10px; background: var(--green); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  .wa-thread { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .wa-thread-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .wa-thread-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #F5F1E8; }
  .wa-bubble { max-width: 62%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
  .wa-bubble.in { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .wa-bubble.out { align-self: flex-end; background: var(--accent-soft); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .wa-bubble img, .wa-bubble video { max-width: 100%; border-radius: 8px; display: block; margin-bottom: 4px; }
  .wa-bubble .wa-meta { font-size: 9.5px; color: var(--muted); margin-top: 3px; text-align: right; }
  .wa-composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); align-items: center; }
  .wa-composer input[type=text] { flex: 1; }
  .wa-window-banner { padding: 8px 14px; font-size: 11.5px; text-align: center; background: #FFF6E0; color: #8A5A2C; border-bottom: 1px solid var(--border); }
  .wa-empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="app" id="app-root"></div>
<script>
  // ================= ICONS =================
  function icon(paths) {
    return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';

  // Same Lambda Function URL the guest app calls for face matching. The dashboard uses
  // it too, to index each photo's face into that event's AWS Rekognition Collection
  // right after upload — that one-time indexing is what lets a guest's later selfie
  // search find every match in ONE call instead of comparing against every photo.
  const FACE_MATCH_API_URL = 'https://qnb4d2vksrtafq2vjf2jhoecyi0apyod.lambda-url.eu-north-1.on.aws/';

  function callFaceMatchLambda(payload) {
    return fetch(FACE_MATCH_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (res) { return res.json(); });
  }

  // Fire-and-forget: indexing failure should never block the upload itself from
  // succeeding — worst case that one photo just isn't searchable yet, and can be
  // re-indexed later without redoing the upload.
  function indexPhotoFace(eventId, photoId, photoUrl) {
    return callFaceMatchLambda({ action: 'index', eventId: eventId, photoId: photoId, photoUrl: photoUrl }).catch(function () {});
  }

  function createEventFaceCollection(eventId) {
    return callFaceMatchLambda({ action: 'createCollection', eventId: eventId }).catch(function () {});
  }

  function deleteEventFaceCollection(eventId) {
    return callFaceMatchLambda({ action: 'deleteCollection', eventId: eventId }).catch(function () {});
  }

  function resizeDataUrl(dataUrl, maxWidth) {
    return new Promise(function (resolve) {
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { resolve(dataUrl); };
      img.src = dataUrl;
    });
  }

  // Generic auto-save wiring: any input/select/checkbox/radio rendered with a
  // data-field="a.b" attribute gets its change written straight back into the event
  // object (and re-rendered where needed) — this is what makes the Privacy/Downloads/
  // Watermark tabs actually persist instead of just sitting there looking clickable.
  function wireSettingsFields(container, e, tab) {
    container.querySelectorAll('[data-field]').forEach(function (input) {
      const evtName = (input.type === 'range' || input.type === 'number' || input.tagName === 'SELECT' || input.type === 'text') ? 'input' : 'change';
      input.addEventListener(evtName, function () {
        let val;
        if (input.type === 'checkbox') val = input.checked;
        else if (input.type === 'radio') { if (!input.checked) return; val = input.value; }
        else if (input.type === 'range' || input.type === 'number') val = Number(input.value) || 0;
        else val = input.value;
        setNestedField(e, input.dataset.field, val);

        if (/^watermark\.(standard|original)\.opacity$/.test(input.dataset.field)) {
          const tierKey = input.dataset.field.split('.')[1];
          const lbl = document.getElementById('ed-wm-' + tierKey + '-opacity-label');
          if (lbl) lbl.textContent = 'Opacity (' + val + '%)';
        }
        if (/^watermark\.(standard|original)\.logoScale$/.test(input.dataset.field)) {
          const tierKey = input.dataset.field.split('.')[1];
          const lbl = document.getElementById('ed-wm-' + tierKey + '-logoscale-label');
          if (lbl) lbl.textContent = 'Logo Size (' + val + '%, used when Content includes Logo)';
        }
        if (input.dataset.field === 'watermark.dualLogo') {
          const row = document.getElementById('ed-sponsor-logo-row');
          if (row) row.style.display = val ? '' : 'none';
        }
        // These fields are what the guest app reads live to decide the selfie/My
        // Photos/Gallery access flow, so push them to Firestore the moment any of
        // them change (not just facePrivacy) — otherwise the guest app would keep
        // using a stale default until some other field happened to sync. "pin" lets
        // a guest unlock the full private gallery instead of only their own matched
        // photos; "enquiry" turns on the real lead-capture form on the Gallery screen.
        // 'privacy.registration' was missing from this list entirely — the toggle updated
        // the local e.privacy.registration value and looked like it saved, but never
        // actually reached Firestore, so the guest app (which now reads d.registration to
        // decide whether to show the name/phone/email gate) would never see it turned on.
        if (['privacy.faceRecognition', 'privacy.facePrivacy', 'privacy.anonymousMyPhotos', 'privacy.registration', 'privacy.pin', 'privacy.enquiry'].indexOf(input.dataset.field) !== -1) {
          syncEventPrivacyToCloud(e.id, {
            faceRecognition: e.privacy.faceRecognition,
            facePrivacy: e.privacy.facePrivacy,
            anonymousMyPhotos: e.privacy.anonymousMyPhotos,
            registration: e.privacy.registration,
            pin: e.privacy.pin,
            enquiry: e.privacy.enquiry,
          });
        }
        // Downloads and Watermark tabs used to only update this local e object and
        // never actually reach Firestore — they looked like they saved but the guest
        // app (and any other device) never saw the change. Push the whole sub-object
        // any time one of its fields changes.
        if (input.dataset.field.indexOf('downloads.') === 0) {
          syncEventPrivacyToCloud(e.id, { downloads: e.downloads });
        }
        if (input.dataset.field.indexOf('watermark.') === 0) {
          syncEventPrivacyToCloud(e.id, { watermark: e.watermark });
        }
        if (input.dataset.field.indexOf('photoSelling.') === 0) {
          syncEventPrivacyToCloud(e.id, { photoSelling: e.photoSelling });
        }
      });
    });
  }

      }
      group.items.forEach(function (item) {
        const link = document.createElement('div');
        link.className = 'nav-link' + (item.id === currentPage ? ' active' : '');
        link.dataset.page = item.id;
        // Icon-only nav items hide their <span> label via CSS, so give them a

        // an icon-only button does before clicking it.
        if (group.style === 'icon') link.title = item.label;

          (item.id === 'kamsync' ? '<span class="badge">' + KAMSYNC_ACCOUNTS.length + '</span>' : '') +

  // ================= Enquiries badge (topbar bell) =================
  // Studio-wide (not per-event) live count of new leads submitted through any event's
  // "Interested in booking us?" form — a red badge on the bell so a new enquiry doesn't
  // just silently sit in Firestore until someone happens to open an event's Enquiries
  // panel. "New" is tracked client-side (sf_dash_enquiries_seen in localStorage) rather
  // than a per-doc read flag in Firestore, since there's only ever one studio owner using
  // this dashboard — no need for real per-user read-state.
  let ALL_ENQUIRIES_DASH = [];
  let enquiriesBadgeUnsub;
  // ---- WhatsApp Inbox state ----
  let WA_CONVERSATIONS = [];
  let WA_TOTAL_UNREAD = 0;
  let waBadgeUnsub = null;
  let waActivePhone = null;
  let waMessagesUnsub = null;
  let waMessages = [];
  function startEnquiriesBadgeSync() {
    if (!db || enquiriesBadgeUnsub) return;
    enquiriesBadgeUnsub = db.collection('enquiries').onSnapshot(function (snap) {
      ALL_ENQUIRIES_DASH = snap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); });
      updateTopbarNotifBadge();
    }, function () {});
  }

  function updateTopbarNotifBadge() {
    const badge = document.getElementById('topbar-notif-badge');
    if (!badge) return;
    let lastSeen = 0;
    try { lastSeen = Number(localStorage.getItem('sf_dash_enquiries_seen') || 0); } catch (err) {}
    const unseen = ALL_ENQUIRIES_DASH.filter(function (d) {
      const t = d.createdAt && d.createdAt.toMillis ? d.createdAt.toMillis() : 0;
      return t > lastSeen;
    }).length;
    if (unseen > 0) {
      badge.textContent = unseen > 9 ? '9+' : String(unseen);
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }

  // Studio-wide Enquiries page (top nav) — every lead across every event in one list,
  // instead of having to open each event's own Enquiries panel one at a time to check.
  // Reuses the same live ALL_ENQUIRIES_DASH data the topbar badge tracks; the per-event
  // Enquiries panel inside Event Settings still exists too, for when the studio wants to
  // see just one event's leads specifically.
  function renderEnquiriesPage(el) {
    // Opening this page is the real "I looked at these" signal — clears the bell badge,
    // same as actually reading the alert from showTopbarNotifications() does.
    try { localStorage.setItem('sf_dash_enquiries_seen', String(Date.now())); } catch (err) {}
    updateTopbarNotifBadge();

    const rows = ALL_ENQUIRIES_DASH.slice().sort(function (a, b) {
      const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return bt - at;
    });

    if (!rows.length) {
      el.innerHTML = '<div class="card" style="text-align:center;padding:48px 24px;">' +
        '<div style="width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">' + ICONS.BELL + '</div>' +
        '<div style="font-weight:800;font-size:15px;margin-bottom:6px;">No enquiries yet</div>' +
        '<div class="card-sub" style="max-width:380px;margin:0 auto;">Leads submitted from any event\'s "Interested in booking us?" form will show up here — across every event, no need to open each one. Make sure "Enquiry / Lead Capture Form" is turned on per-event in Settings &gt; Privacy &amp; Access.</div>' +
        '</div>';
      return;

    el.innerHTML = '<div class="card"><div class="card-title">Enquiries</div>' +
      '<div class="card-sub">Every lead submitted across all your events, newest first.</div>' +
      '<div class="table-card" style="margin-top:14px;"><table><thead><tr><th>Event</th><th>Name</th><th>Contact</th><th>Message</th><th>Received</th></tr></thead><tbody>' +

        const ev = EVENTS.find(function (e) { return e.id === d.eventId; });

        return '<tr><td>' + escapeHtmlGD(ev ? ev.name : (d.eventId || '—')) + '</td>' +
          '<td>' + escapeHtmlGD(d.name || '—') + '</td>' +
          '<td>' + escapeHtmlGD(d.email || '—') + (d.phone ? '<br>' + escapeHtmlGD(d.phone) : '') + '</td>' +
          '<td style="max-width:260px;">' + escapeHtmlGD(d.message || '—') + '</td>' +
          '<td style="white-space:nowrap;">' + when + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';

  // ================= WhatsApp Inbox =================
  // Talks straight to Meta's Cloud API via three Cloud Functions (whatsappWebhook,
  // sendWhatsappMessage, markWhatsappRead — see functions/index.js) instead of a paid
  // BSP dashboard like AiSensy/WATI. Every conversation with a client lives in Firestore
  // under whatsappConversations/{phone}, kept in sync live here the same way the rest of
  // this dashboard mirrors Firestore (onSnapshot, no manual refresh needed).
  function startWhatsappBadgeSync() {
    if (!db || waBadgeUnsub) return;
    waBadgeUnsub = db.collection('whatsappConversations')
      .orderBy('lastMessageAt', 'desc')
      .onSnapshot(function (snap) {
        WA_CONVERSATIONS = snap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); });
        WA_TOTAL_UNREAD = WA_CONVERSATIONS.reduce(function (s, c) { return s + (c.unreadCount || 0); }, 0);
        // Keep the sidebar badge current even when the studio isn't on the Messages
        // page — re-render just the sidebar rather than the whole page.
        renderSidebar();
        if (currentPage === 'messages') renderMessagesPage(document.getElementById('page-content'));
      }, function () {});
  }

  function waInitials(convo) {
    const label = (convo.name || convo.phone || '?').trim();
    return label.slice(0, 2).toUpperCase();
  }

  function waFormatTime(ts) {
    if (!ts || !ts.toDate) return '';
    const d = ts.toDate();
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay
      ? d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })
      : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function renderMessagesPage(el) {
    if (!functionsSDK) {

    el.innerHTML =

  function renderWaList() {
    const list = document.getElementById('wa-list');
    if (!list) return;
    if (!WA_CONVERSATIONS.length) {
      list.innerHTML = '<div style="padding:24px 16px;color:var(--muted);font-size:12.5px;text-align:center;">No conversations yet.<br>They\'ll show up here the moment a client messages your WhatsApp number.</div>';
      return;
    }
    list.innerHTML = WA_CONVERSATIONS.map(function (c) {
      return '<div class="wa-list-row' + (c.phone === waActivePhone ? ' active' : '') + '" data-wa-phone="' + c.phone + '">' +
        '<div class="wa-avatar">' + waInitials(c) + '</div>' +

        '</div>' +

        '</div>' +
      '</div>';

    list.querySelectorAll('[data-wa-phone]').forEach(function (row) {
      row.addEventListener('click', function () { openWaConversation(row.dataset.waPhone); });
    });
  }

  function openWaConversation(phone) {
    waActivePhone = phone;
    renderWaList();
    renderWaThread();
    if (waMessagesUnsub) { waMessagesUnsub(); waMessagesUnsub = null; }
    waMessages = [];
    waMessagesUnsub = db.collection('whatsappConversations').doc(phone)
      .collection('messages').orderBy('timestamp', 'asc')
      .onSnapshot(function (snap) {
        waMessages = snap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); });
        renderWaThread();
      }, function () {});

    functionsSDK.httpsCallable('markWhatsappRead')({ phone: phone }).catch(function () {});
  }

  function renderWaThread() {
    const thread = document.getElementById('wa-thread');
    if (!thread) return;
    if (!waActivePhone) {
      thread.innerHTML = '<div class="wa-empty">' + ICONS.WHATSAPP + '<div>Select a conversation to start chatting.</div></div>';
      return;
    }
    const convo = WA_CONVERSATIONS.find(function (c) { return c.phone === waActivePhone; }) || { phone: waActivePhone };
    const windowOpen = convo.windowExpiresAt && convo.windowExpiresAt.toDate
      ? convo.windowExpiresAt.toDate().getTime() > Date.now()
      : (convo.windowExpiresAt instanceof Date ? convo.windowExpiresAt.getTime() > Date.now() : false);

    thread.innerHTML =
      '<div class="wa-thread-head"><div class="wa-avatar">' + waInitials(convo) + '</div>' +
        '<div><div style="font-weight:800;font-size:14px;">' + escapeHtmlGD(convo.name || convo.phone) + '</div>' +
        '<div style="font-size:11px;color:var(--muted);">+' + escapeHtmlGD(convo.phone) + '</div></div></div>' +
      (windowOpen ? '' : '<div class="wa-window-banner">24-hour reply window has closed — this client needs to message you again before you can send a free-text reply.</div>') +
      '<div class="wa-thread-body" id="wa-thread-body"></div>' +
      '<div class="wa-composer">' +
        '<input type="text" class="input" id="wa-composer-input" placeholder="' + (windowOpen ? 'Type a message…' : 'Reply window closed…') + '"' + (windowOpen ? '' : ' disabled') + '>' +
        '<button class="btn-solid" id="wa-composer-send"' + (windowOpen ? '' : ' disabled') + '>Send</button>' +
      '</div>';

    const body = document.getElementById('wa-thread-body');
    if (!waMessages.length) {
      body.innerHTML = '<div style="margin:auto;color:var(--muted);font-size:12.5px;">No messages yet.</div>';
    } else {
      body.innerHTML = waMessages.map(function (m) {
        let inner = '';
        if (m.mediaUrl && m.type === 'image') inner += '<img src="' + m.mediaUrl + '" alt="">';
        else if (m.mediaUrl && m.type === 'video') inner += '<video src="' + m.mediaUrl + '" controls></video>';
        else if (m.mediaUrl) inner += '<a href="' + m.mediaUrl + '" target="_blank" rel="noopener">Download ' + (m.type || 'file') + '</a><br>';
        if (m.text) inner += escapeHtmlGD(m.text);
        const tickLabel = m.direction === 'out' ? (' · ' + (m.status || 'sent')) : '';
        return '<div class="wa-bubble ' + m.direction + '">' + inner +
          '<div class="wa-meta">' + waFormatTime(m.timestamp) + tickLabel + '</div></div>';
      }).join('');
    }
    body.scrollTop = body.scrollHeight;

    const sendBtn = document.getElementById('wa-composer-send');
    const input = document.getElementById('wa-composer-input');
    if (sendBtn) {
      sendBtn.addEventListener('click', sendWaMessage);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendWaMessage(); });
    }
  }

  function sendWaMessage() {
    const input = document.getElementById('wa-composer-input');
    const text = input ? input.value.trim() : '';
    if (!text || !waActivePhone) return;
    input.value = '';
    input.disabled = true;
    functionsSDK.httpsCallable('sendWhatsappMessage')({ phone: waActivePhone, text: text })
      .catch(function (err) {
        alert((err && err.message) || 'Could not send — check your internet connection and try again.');
      })
      .finally(function () { input.disabled = false; input.focus(); });
  }

  function daysUntil(dateStr) {
    const target = new Date(dateStr + 'T00:00:00');

  // and scoped to a single event from the Event Detail "Increase Photo Limit" modal.
  function renderEventPackTable(context) {
    const idPrefix = context === 'home' ? 'pack-home' : 'pack-event';

  let packCart = { 'pack-home': {}, 'pack-event': {} };
  function addPackToCart(idPrefix, index) {
    packCart[idPrefix] = packCart[idPrefix] || {};
    packCart[idPrefix][index] = (packCart[idPrefix][index] || 0) + 1;
    const total = Object.keys(packCart[idPrefix]).reduce(function (sum, i) {
      return sum + EVENT_PACKS[i].cost * packCart[idPrefix][i];
    }, 0);
    const totalEl = document.getElementById(idPrefix + '-total');
    const buyBtn = document.getElementById(idPrefix + '-buy');
    if (totalEl) totalEl.innerHTML = '&#8377;' + total.toLocaleString() + '.00';
    if (buyBtn) buyBtn.disabled = total === 0;
  }

  function buyEventPacks(idPrefix) {
    const cart = packCart[idPrefix] || {};
    const totalPhotos = Object.keys(cart).reduce(function (sum, i) { return sum + EVENT_PACKS[i].photos * cart[i]; }, 0);
    if (!totalPhotos) return;
    if (idPrefix === 'pack-event') {
      // Scoped purchase from "Increase Photo Limit" — raises just this event's photo
      // cap, not the account-wide subscription limit.
      const e = EVENTS.find(function (x) { return x.id === currentEventId; });
      if (e) {
        e.photoLimit = (e.photoLimit || e.photos) + totalPhotos;
        syncEventPrivacyToCloud(e.id, { photoLimit: e.photoLimit });
      }
      alert(totalPhotos.toLocaleString() + ' photos added to this event\'s limit (mock purchase — no real payment charged).');
    } else {
      // Home page purchase — creates discrete, standalone "My Event Packs" (each with
      // its own 12-month validity from today), NOT a bump to the shared subscription
      // credit pool. These are what "Create Event from Purchased Pack" consumes one
      // of, separately from anything tied to the studio's plan/renewal date.
      const today = new Date().toISOString().slice(0, 10);
      let packCount = 0;
      Object.keys(cart).forEach(function (i) {
        const tier = EVENT_PACKS[i];
        for (let n = 0; n < cart[i]; n++) {
          STUDIO.eventPacks.push({
            id: 'pack_' + Date.now() + '_' + i + '_' + n + '_' + Math.random().toString(36).slice(2, 6),
            photos: tier.photos, cost: tier.cost, purchasedAt: today, used: false, usedByEventId: null,
          });
          packCount++;
        }
      });
      if (db) db.collection('studio').doc('profile').set({ eventPacks: STUDIO.eventPacks }, { merge: true }).catch(function () {});
      alert(totalPhotos.toLocaleString() + ' photos across ' + packCount + ' pack(s) added to My Event Packs (mock purchase — no real payment charged).');
    }
    packCart[idPrefix] = {};
    const panel = document.getElementById('ed-action-panel');
    if (panel && panel.dataset.open === 'photolimit') { panel.dataset.open = ''; panel.innerHTML = ''; }
    if (currentPage === 'overview') renderOverview(document.getElementById('page-content'));
    renderSidebar();
  }

    const input = document.getElementById('home-coupon-input');
    const code = input ? input.value.trim() : '';
    if (!code) { alert('Enter a coupon code first.'); return; }
    alert('"' + code + '" is not a valid or active coupon (mock — no real coupon backend in this test build).');

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { alert('Copied: ' + text); }).catch(function () { alert(text); });
    } else {
      alert(text);
    }
  }

  // ================= Events =================
  let eventsFilter = 'all';

  let eventsSearch = '';

  // Real Kamero's "My Events" is a cover-photo card grid (photo count + valid-until
  // badges baked into each thumbnail), not a data table — matches that layout instead.
  function renderEvents(el) {
    el.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;">' +
        '<h2 style="margin:0;color:var(--accent-ink);">My Events</h2>' +
        '<div style="display:flex;gap:8px;flex:1;max-width:420px;">' +
          '<input class="input" id="events-search-input" placeholder="Search by name or event id" value="' + eventsSearch + '">' +
          '<button class="btn-solid btn-sm" onclick="setEventsSearch()">Search</button>' +
        '</div>' +
        '<button class="btn-solid" onclick="openCreateEventWizard()">' + ICONS.PLUS + ' Create Event</button>' +
      '</div>' +
      renderExpiryBanners(EVENTS.filter(function (e) { return e.status === 'disabled'; }).length || 3) +
      '<div class="tabs-row" id="events-filter-tabs">' +
        '<div class="tab-btn' + (eventsFilter === 'all' ? ' active' : '') + '" data-filter="all">All Events</div>' +
        '<div class="tab-btn' + (eventsFilter === 'active' ? ' active' : '') + '" data-filter="active">Active</div>' +
        '<div class="tab-btn' + (eventsFilter === 'disabled' ? ' active' : '') + '" data-filter="disabled">Disabled</div>' +
      '</div>' +
      '<div class="grid-3" id="events-card-grid"></div>';

    document.querySelectorAll('#events-filter-tabs .tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        eventsFilter = btn.dataset.filter;
        document.querySelectorAll('#events-filter-tabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderEventsCardGrid();
      });
    });
    const searchInput = document.getElementById('events-search-input');
    if (searchInput) searchInput.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') setEventsSearch(); });
    renderEventsCardGrid();
    fillIcons();
  }

  function setEventsSearch() {
    const input = document.getElementById('events-search-input');
    eventsSearch = input ? input.value.trim().toLowerCase() : '';
    renderEventsCardGrid();
  }

  function renderEventsCardGrid() {
    const grid = document.getElementById('events-card-grid');
    if (!grid) return;
    grid.innerHTML = '';
    const filtered = EVENTS.filter(function (e) {
      if (eventsFilter !== 'all' && e.status !== eventsFilter) return false;
      if (!eventsSearch) return true;
      return e.name.toLowerCase().indexOf(eventsSearch) > -1 || e.id.toLowerCase().indexOf(eventsSearch) > -1;
    });
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-note" style="grid-column:1/-1;">No events match this filter or search.</div>';
      return;
    }
    filtered.forEach(function (e) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = 'padding:0;overflow:hidden;cursor:pointer;';
      card.innerHTML =
        '<div style="position:relative;aspect-ratio:4/3;background:var(--bg);">' +
          '<img src="' + e.cover + '" style="width:100%;height:100%;object-fit:cover;display:block;">' +
          '<span style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;display:flex;align-items:center;gap:4px;">' + ICONS.IMAGE + ' ' + e.photos.toLocaleString() + (e.photoLimit ? '/' + e.photoLimit.toLocaleString() : '') + '</span>' +
          '<span style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:8px;">Valid upto: ' + formatShortDate(e.validUpto || STUDIO.renewalDate) + '</span>' +
        '</div>' +
        '<div style="padding:14px 16px;">' +
          '<div style="font-weight:800;font-size:14px;">' + e.name + '</div>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">' +
            '<div style="font-size:11.5px;color:var(--accent-ink);">ID: ' + e.id + ' <span data-rename-event style="cursor:pointer;">' + ICONS.EDIT.replace('width="18" height="18"', 'width="12" height="12"') + '</span></div>' +
            '<div style="display:flex;gap:4px;"><button class="icon-mini" data-edit><i data-icon="SETTINGS"></i></button><button class="icon-mini" data-del><i data-icon="TRASH"></i></button></div>' +
          '</div>' +
        '</div>';
      card.addEventListener('click', function () { showPage('event-detail', e.id); });
      card.querySelector('[data-edit]').addEventListener('click', function (ev) { ev.stopPropagation(); showPage('event-detail', e.id); });
      card.querySelector('[data-del]').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!confirm('Delete "' + e.name + '"? This cannot be undone.')) return;
        const idx = EVENTS.findIndex(function (x) { return x.id === e.id; });
        if (idx !== -1) EVENTS.splice(idx, 1);
        if (db) db.collection('events').doc(e.id).delete().catch(function () {});
        deleteEventFaceCollection(e.id);
        renderEventsCardGrid();
        renderSidebar();
      });
      card.querySelector('[data-rename-event]').addEventListener('click', function (ev) {
        ev.stopPropagation();
        const newId = prompt('Change Event ID (used in guest links):', e.id);
        if (!newId || !newId.trim() || newId.trim() === e.id) return;
        const cleanId = newId.trim().toLowerCase().replace(/\s+/g, '-');
        if (EVENTS.some(function (x) { return x.id === cleanId; })) { alert('That Event ID is already used by another event.'); return; }
        const oldId = e.id;
        // Firestore has no "rename doc ID" operation — copy the full doc to the new ID,
        // then delete the old one, so guest links under the old ID stop resolving and
        // the new ID carries over everything (privacy, albums, etc.) exactly as-is.
        if (db) {
          db.collection('events').doc(oldId).get().then(function (doc) {
            const data = doc.exists ? doc.data() : Object.assign({}, e);
            return db.collection('events').doc(cleanId).set(data).then(function () {
              return db.collection('events').doc(oldId).delete();
            });
          }).catch(function () {});
        }
        e.id = cleanId;
        if (currentEventId === oldId) currentEventId = cleanId;
        renderEventsCardGrid();
      });
      grid.appendChild(card);
    });
    fillIcons();
  }

  function formatShortDate(d) {
    const dt = new Date(d + 'T00:00:00');

  function submitCreateEventFromSubscription() {
    const d = CREATE_EVENT_WIZARD;
    if (!d.name.trim() || !d.category || !d.date || !d.downloadPermission) {
      alert('Please fill in Event Name, Event Category, Event Date and Download Options.');
      return;
    }
    const validHosts = d.hosts.filter(function (h) { return h.name.trim() && h.email.trim() && h.mobile.trim(); });
    if (!validHosts.length) {
      alert('Please add at least one host with name, email and mobile number.');
      return;
    }

    const id = 'evt_new_' + Date.now();
    // "From Subscription" (as opposed to a Purchased Pack) means this event rides on
    // the studio's existing plan rather than a separately bought add-on: its gallery
    // validity is whatever's LEFT on the current billing cycle — not a fresh full
    // period, so a plan 6 months into a 1-year cycle only gives a new event the 6
    // months actually remaining — and its starting photo capacity comes out of the
    // plan's currently unused upload-credit pool, not a flat made-up number.
    const creditsLeft = Math.max(0, STUDIO.creditsTotal - STUDIO.creditsUsed);
    const newEvent = {
      id: id, name: d.name.trim(), date: d.date, category: d.category, venue: '',
      cover: STUDIO.coverUrl || ('https://picsum.photos/seed/' + id + '/300/300'),
      photos: 0, photoLimit: creditsLeft, guests: 0, views: 0, status: 'active', validUpto: STUDIO.renewalDate,
      albums: [], hosts: validHosts,
      privacy: { faceRecognition: true, facePrivacy: false, anonymousMyPhotos: false, registration: false, guestUpload: d.guestUpload, guestUploadLimit: 10, pin: '', coHosts: [], enquiry: d.enquiry, disabled: false },
      downloads: { permission: d.downloadPermission, anonymous: true, originalQuality: false },
      watermark: freshEventWatermark(),
      photoSelling: freshPhotoSelling(),
      videos: [], highlightEnabled: false,
    };
    EVENTS.unshift(newEvent);
    // Full write (not merge) since this is a brand-new doc — nothing to clobber. This is
    // what makes the event actually exist for the guest app / other devices instead of
    // only living in this browser tab until reload.
    if (db) db.collection('events').doc(id).set(newEvent).catch(function () {});
    // Prime the AWS Rekognition Collection now so the first photo upload doesn't pay
    // the extra "collection doesn't exist yet" round-trip.
    createEventFaceCollection(id);
    showPage('event-detail', id);
  }

  function submitCreateEventFromPack() {
    const pack = (STUDIO.eventPacks || []).find(function (p) { return p.id === createEventSelectedPackId; });
    if (!pack || pack.used) {
      alert('That pack is no longer available — please choose another.');
      createEventWizardStep = 'pack-select';
      showPage('createevent');
      return;
    }
    const d = CREATE_EVENT_WIZARD;
    if (!d.name.trim() || !d.category || !d.date || !d.downloadPermission) {
      alert('Please fill in Event Name, Event Category, Event Date and Download Options.');
      return;
    }
    const validHosts = d.hosts.filter(function (h) { return h.name.trim() && h.email.trim() && h.mobile.trim(); });
    if (!validHosts.length) {
      alert('Please add at least one host with name, email and mobile number.');
      return;
    }

    const id = 'evt_new_' + Date.now();
    // "From Purchased Pack": this event's validity and photo capacity come from the
    // ONE specific pack the studio picked — 12 months from when THAT pack was bought,
    // completely independent of the studio's subscription cycle — and that pack gets
    // marked used immediately so it can't also be handed to a second event.
    const newEvent = {
      id: id, name: d.name.trim(), date: d.date, category: d.category, venue: '',
      cover: STUDIO.coverUrl || ('https://picsum.photos/seed/' + id + '/300/300'),
      photos: 0, photoLimit: pack.photos, guests: 0, views: 0, status: 'active',
      validUpto: addMonthsToDate(pack.purchasedAt, 12),
      albums: [], hosts: validHosts, eventPackId: pack.id,
      privacy: { faceRecognition: true, facePrivacy: false, anonymousMyPhotos: false, registration: false, guestUpload: d.guestUpload, guestUploadLimit: 10, pin: '', coHosts: [], enquiry: d.enquiry, disabled: false },
      downloads: { permission: d.downloadPermission, anonymous: true, originalQuality: false },
      watermark: freshEventWatermark(),
      photoSelling: freshPhotoSelling(),
      videos: [], highlightEnabled: false,
    };
    EVENTS.unshift(newEvent);
    if (db) db.collection('events').doc(id).set(newEvent).catch(function () {});
    createEventFaceCollection(id);

    pack.used = true;
    pack.usedByEventId = id;
    if (db) db.collection('studio').doc('profile').set({ eventPacks: STUDIO.eventPacks }, { merge: true }).catch(function () {});
    renderSidebar();

    showPage('event-detail', id);
  }

    // Only reset the filter when actually switching TO this event — renderEventDetail()
    // also re-runs on every remote refresh of the SAME event (see
    // selectedAlbumFilterEventId above), and re-defaulting to album #1 on every one of
    // those made whichever album you had open (e.g. Cam 2) keep snapping back to Cam 1
    // right after an upload, even though the photo itself was correctly saved in Cam 2.
    const isValidExistingFilter = selectedAlbumFilter === 'HIGHLIGHTS' || selectedAlbumFilter === '' ||
      (selectedAlbumFilter && e.albums.some(function (a) { return a.name === selectedAlbumFilter; }));
    if (currentEventId !== selectedAlbumFilterEventId || !isValidExistingFilter) {
      selectedAlbumFilter = e.albums.length ? e.albums[0].name : null;

    // the guest app actually reads — this keeps the toggle here from showing a stale/default
    // value if the dashboard was reloaded after a previous session already turned it on.
    if (db) {
      db.collection('events').doc(e.id).get().then(function (doc) {
        if (doc.exists) {
          const d = doc.data();
          if (typeof d.facePrivacy === 'boolean') e.privacy.facePrivacy = d.facePrivacy;
          if (typeof d.faceRecognition === 'boolean') e.privacy.faceRecognition = d.faceRecognition;
          if (typeof d.anonymousMyPhotos === 'boolean') e.privacy.anonymousMyPhotos = d.anonymousMyPhotos;
          if (typeof d.pin === 'string') e.privacy.pin = d.pin;
          if (typeof d.enquiry === 'boolean') e.privacy.enquiry = d.enquiry;
          if (Array.isArray(d.coHosts)) e.privacy.coHosts = d.coHosts;
          if (Array.isArray(d.albums)) e.albums = d.albums;

      '</div>' +
      '<div class="tabs-row" id="ed-tabs">' +
        tabBtn('general', 'General') + tabBtn('privacy', 'Privacy & Access', true) + tabBtn('downloads', 'Downloads') + tabBtn('watermark', 'Watermark') + tabBtn('selling', 'Photo Selling') +
      '</div>' +
      '<div id="ed-content" style="margin-bottom:26px;"></div>';

    document.querySelectorAll('#ed-tabs .tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#ed-tabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderEventDetailTab(btn.dataset.tab, e);
      });
    });
    // Jumps straight to Privacy & Access — the tab that covers face recognition, guest
    // registration, guest uploads, and "who can see personal photos" — with Downloads
    // and the other tabs just one click away right there.
    renderEventDetailTab('privacy', e);
    fillIcons();

    // Same live-privacy pull the normal view does, so PIN/toggles here can't show a
    // stale value if the dashboard was reloaded after a previous session's changes.
    if (db) {
      db.collection('events').doc(e.id).get().then(function (doc) {
        if (!doc.exists) return;
        const d = doc.data();
        if (typeof d.facePrivacy === 'boolean') e.privacy.facePrivacy = d.facePrivacy;
        if (typeof d.faceRecognition === 'boolean') e.privacy.faceRecognition = d.faceRecognition;
        if (typeof d.anonymousMyPhotos === 'boolean') e.privacy.anonymousMyPhotos = d.anonymousMyPhotos;
        if (typeof d.registration === 'boolean') e.privacy.registration = d.registration;
        if (typeof d.guestUpload === 'boolean') e.privacy.guestUpload = d.guestUpload;
        if (typeof d.guestUploadLimit === 'number') e.privacy.guestUploadLimit = d.guestUploadLimit;
        if (typeof d.pin === 'string') e.privacy.pin = d.pin;
        if (typeof d.enquiry === 'boolean') e.privacy.enquiry = d.enquiry;
        if (Array.isArray(d.coHosts)) e.privacy.coHosts = d.coHosts;
        if (!edSettingsView) return; // guest navigated away before this resolved
        const pinChip = el.querySelector('.pill');
        if (pinChip) pinChip.textContent = 'PIN: ' + (e.privacy.pin || '—');
        const activeTab = document.querySelector('#ed-tabs .tab-btn.active');
        if (activeTab) renderEventDetailTab(activeTab.dataset.tab, e);
      }).catch(function () {});
    }
  }

  function renderEventDetailTab(tab, e) {

        '<div class="grid-2">' +
          '<div class="card">' +

            '<div class="field"><label>Event Date</label><input class="input" type="date" id="ed-date" value="' + e.date + '"></div>' +
            '<div class="field"><label>Venue</label><input class="input" id="ed-venue" placeholder="e.g. The Grand Ballroom, Mumbai" value="' + (e.venue || '') + '"></div>' +

        (e.category || (e.hosts && e.hosts.length)

              (e.category ? '<div class="card-sub" style="margin-bottom:10px;">Category: <b style="color:var(--ink);">' + e.category + '</b></div>' : '') +
              (e.hosts && e.hosts.length
                ? '<div class="card-sub" style="margin-bottom:6px;">Hosts</div>' +
                  e.hosts.map(function (h) {

          toggleRowHtml('Face-Based Privacy', 'Guests only see photos they appear in, not the full gallery.', e.privacy.facePrivacy, 'priv-facePrivacy', 'privacy.facePrivacy') +
          toggleRowHtml('Anonymous My Photos', 'Guests find their photos via selfie without logging in. If off, guests must sign in before taking a selfie.', e.privacy.anonymousMyPhotos, 'priv-anonymousMyPhotos', 'privacy.anonymousMyPhotos') +
          toggleRowHtml('Guest Registration Required', 'Guests must enter their name, phone, and email before viewing photos. See the collected list under Guests Data above.', e.privacy.registration, '', 'privacy.registration') +
          // No data-field here on purpose — turning this ON needs to first collect a
          // guest upload limit via a confirmation modal (see openGuestUploadLimitModal
          // below), so it can't just auto-save through the generic wireSettingsFields
          // path like every other toggle on this tab does. Wired specially right after
          // wireSettingsFields() runs, a few lines down.
          toggleRowHtml('Allow Guest Uploads', 'Let attendees contribute their own photos to the gallery.' + (e.privacy.guestUpload ? ' Limit: ' + (e.privacy.guestUploadLimit || 0) + ' photos.' : ''), e.privacy.guestUpload, 'priv-guestUpload', '') +
          toggleRowHtml('Enquiry / Lead Capture Form', 'Show a contact form to collect leads from viewers.', e.privacy.enquiry, '', 'privacy.enquiry') +
        '</div>' +
        '<div class="grid-2" style="margin-top:16px;">' +
          '<div class="card"><div class="card-title">Event PIN</div><div class="card-sub">Require a PIN for full-gallery access</div>' +
            '<div class="field"><input class="input" data-field="privacy.pin" placeholder="e.g. 4821" value="' + e.privacy.pin + '"></div></div>' +
          '<div class="card"><div class="card-title">Manage Event Host (Co-Hosts)</div><div class="card-sub">Give other accounts management access to this event</div>' +
            '<div id="ed-cohosts-list" style="margin-bottom:10px;">' +
              (e.privacy.coHosts.length
                ? e.privacy.coHosts.map(function (c) {
                    return '<span class="pill blue" style="margin:0 6px 6px 0;">' + c + ' <span data-remove-cohost="' + c + '" style="cursor:pointer;font-weight:800;margin-left:4px;" title="Remove">&times;</span></span>';
                  }).join('')
                : '<div style="color:var(--muted);font-size:12.5px;">No co-hosts added yet.</div>') +
            '</div>' +
            '<div style="display:flex;gap:8px;"><input class="input" id="ed-cohost-input" placeholder="Add co-host email" onkeydown="if(event.key===\'Enter\')addCoHost()" style="flex:1;"><button class="btn-solid btn-sm" onclick="addCoHost()">' + ICONS.PLUS + ' Add</button></div>' +
          '</div>' +

    } else if (tab === 'downloads') {
      el.innerHTML =
        '<div class="card">' +
          '<div class="card-title">Download Permissions</div>' +
          '<div class="card-sub">Choose what guests are allowed to download</div>' +
          radioRow('dl-perm', 'all', 'All Photos', e.downloads.permission === 'all', 'downloads.permission') +
          radioRow('dl-perm', 'my-photos', 'My Photos Only (face-matched)', e.downloads.permission === 'my-photos', 'downloads.permission') +
          radioRow('dl-perm', 'none', 'Disable All Downloads', e.downloads.permission === 'none', 'downloads.permission') +
        '</div>' +
        '<div class="card" style="margin-top:16px;">' +
          toggleRowHtml('Anonymous Downloads', 'Allow downloads without guest registration.', e.downloads.anonymous, '', 'downloads.anonymous') +
          toggleRowHtml('Original Quality Downloads', 'Allow full-resolution downloads (uses more credits).', e.downloads.originalQuality, '', 'downloads.originalQuality') +
        '</div>';
    } else if (tab === 'watermark') {
      el.innerHTML =
        '<div class="card-sub" style="margin-bottom:14px;">Overrides your studio-wide Watermark defaults for this one event. This actually shows on guest photos in the app and is baked into original-file downloads.</div>' +
        eventWatermarkTierCard(e, 'standard', 'Standard Watermark', 'Applied to preview images guests see and share before any purchase.') +
        eventWatermarkTierCard(e, 'original', 'Original Watermark', 'Applied to full-resolution / original files, so unpaid downloads still carry your mark.') +
        '<div class="card" style="margin-top:16px;">' +
          toggleRowHtml('Dual Logo (Studio + Sponsor)', 'Show two watermark logos side by side, wherever a tier above is set to Logo or Text + Logo.', e.watermark.dualLogo, '', 'watermark.dualLogo') +
          '<div id="ed-sponsor-logo-row" style="' + (e.watermark.dualLogo ? '' : 'display:none;') + 'margin-top:10px;">' +
            '<label>Sponsor Logo</label>' +
            '<div style="display:flex;align-items:center;gap:10px;margin-top:6px;">' +
              (e.watermark.sponsorLogoUrl ? '<img src="' + e.watermark.sponsorLogoUrl + '" style="width:38px;height:38px;border-radius:9px;object-fit:cover;border:1px solid var(--border);">' : '<span class="card-sub" style="margin:0;">No sponsor logo uploaded yet.</span>') +
              '<label class="btn-outline btn-sm" style="cursor:pointer;">' + ICONS.UPLOAD + ' ' + (e.watermark.sponsorLogoUrl ? 'Change' : 'Upload') +
                '<input type="file" accept="image/*" style="display:none" onchange="uploadSponsorLogo(event,\'' + e.id + '\')">' +
              '</label>' +
              (e.watermark.sponsorLogoUrl ? '<button class="btn-ghost btn-sm" onclick="removeSponsorLogo(\'' + e.id + '\')">Remove</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
    } else if (tab === 'selling') {
      el.innerHTML =
        '<div class="card-sub" style="margin-bottom:14px;">Let guests unlock and download their photos without the watermark by paying for them — one at a time, or as a discounted bundle covering every photo they\'re matched in. Real payments go through Razorpay (needs to be connected once — see Guide).</div>' +
        '<div class="card">' +
          '<div class="card-title">Pricing</div>' +
          toggleRowHtml('Enable Photo Selling', 'Shows a "Buy" option to guests on this event\'s photos once a price is set below.', e.photoSelling.enabled, '', 'photoSelling.enabled') +
          '<div class="grid-2" style="margin-top:14px;">' +
            '<div class="field"><label>Price per Photo (&#8377;)</label><input class="input" type="number" min="0" step="1" data-field="photoSelling.pricePerPhoto" value="' + e.photoSelling.pricePerPhoto + '" placeholder="e.g. 99"></div>' +
            '<div class="field"><label>Bundle Price &mdash; All My Photos (&#8377;)</label><input class="input" type="number" min="0" step="1" data-field="photoSelling.bundlePrice" value="' + e.photoSelling.bundlePrice + '" placeholder="e.g. 999"></div>' +
          '</div>' +
          '<div class="card-sub" style="margin-top:8px;margin-bottom:0;">Bundle unlocks every photo a guest is matched in for one price — set it to 0 to hide the bundle option and only sell single photos.</div>' +
        '</div>' +
        '<div class="card" style="margin-top:16px;">' +
          '<div class="card-title">Recent Sales</div>' +
          '<div class="card-sub">Real, verified payments for this event, most recent first.</div>' +
          '<div id="ed-sales-list">Loading&hellip;</div>' +
        '</div>';
      renderEventSalesList(e.id);

    wireSettingsFields(el, e, tab);
    if (tab === 'privacy') {
      el.querySelectorAll('[data-remove-cohost]').forEach(function (btn) {
        btn.addEventListener('click', function () { removeCoHost(btn.dataset.removeCohost); });
      });
      // Allow Guest Uploads: flipping it ON needs a limit set first (real Kamero shows
      // this exact confirmation before enabling), so this toggle is deliberately left
      // out of wireSettingsFields()'s auto-save and wired here instead. Turning it OFF
      // needs no confirmation and saves immediately, same as every other toggle.
      const guBtn = document.getElementById('priv-guestUpload');
      if (guBtn) {
        guBtn.addEventListener('change', function () {
          if (guBtn.checked) {
            guBtn.checked = false;
            openGuestUploadLimitModal(e.id);
          } else {
            e.privacy.guestUpload = false;
            syncEventPrivacyToCloud(e.id, { guestUpload: false });
            renderEventDetailTab('privacy', e);

  // Real, verified sales only — rows land in the `purchases` collection exclusively
  // from verifyRazorpayPayment (a Cloud Function), never written by the client, so
  // there's no way for this list to show a payment that didn't actually clear.
  function renderEventSalesList(eventId) {
    const wrap = document.getElementById('ed-sales-list');
    if (!wrap) return;
    if (!db) { wrap.innerHTML = '<div class="empty-note">Not connected — sales will show up here once Firebase is configured.</div>'; return; }
    db.collection('purchases').where('eventId', '==', eventId).where('status', '==', 'paid').orderBy('createdAt', 'desc').limit(25).get().then(function (snap) {
      if (!wrap.isConnected) return; // studio navigated away before this resolved
      if (snap.empty) { wrap.innerHTML = '<div class="empty-note">No sales yet for this event.</div>'; return; }
      wrap.innerHTML = '<div class="table-card"><table><thead><tr><th>When</th><th>What</th><th>Amount</th></tr></thead><tbody>' +
        snap.docs.map(function (doc) {
          const o = doc.data();
          const when = o.createdAt && o.createdAt.toDate ? formatDate(o.createdAt.toDate().toISOString().slice(0, 10)) : '—';
          const what = o.type === 'bundle' ? 'Bundle (all matched photos)' : ((o.photoIds ? o.photoIds.length : 1) + ' photo' + ((o.photoIds && o.photoIds.length === 1) ? '' : 's'));
          return '<tr><td>' + when + '</td><td>' + what + '</td><td>&#8377;' + (o.amount || 0).toLocaleString() + '</td></tr>';
        }).join('') +
      '</tbody></table></div>';
    }).catch(function (err) {
      // Most likely a missing Firestore composite index (eventId + status + createdAt)
      // — Firestore's own error message includes a direct "create it" link the first
      // time this query ever runs; surfacing the raw message here instead of a generic
      // failure makes that link visible instead of hiding it behind a vague error.
      wrap.innerHTML = '<div class="empty-note">Could not load sales' + (err && err.message ? ' (' + err.message + ')' : '') + '.</div>';
    });
  }

  // Co-Hosts ("Manage Event Host") give another account management access to this one
  // event — the input previously had no Add button at all, so nothing typed into it
  // could ever actually be saved.
  function addCoHost() {
    const input = document.getElementById('ed-cohost-input');
    const email = input ? input.value.trim() : '';
    if (!email) return;
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    if (e.privacy.coHosts.indexOf(email) !== -1) {
      alert('"' + email + '" is already a co-host on this event.');
      return;
    }
    e.privacy.coHosts.push(email);
    syncEventPrivacyToCloud(e.id, { coHosts: e.privacy.coHosts });
    renderEventDetailTab('privacy', e);
  }

  function removeCoHost(email) {
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    e.privacy.coHosts = e.privacy.coHosts.filter(function (c) { return c !== email; });
    syncEventPrivacyToCloud(e.id, { coHosts: e.privacy.coHosts });
    renderEventDetailTab('privacy', e);
  }

  // Real Kamero keeps Albums permanently visible in a left sidebar on the event page —
  // not tucked behind a settings tab — so "Add Album" is always one click away the
  // moment you open an event, matching that layout instead of hiding it.
  function renderAlbumSidebar(e) {
    const list = document.getElementById('album-sidebar-list');
    const countEl = document.getElementById('album-count');
    if (countEl) countEl.textContent = e.albums.length;
    if (!list) return;
    list.innerHTML = '';
    // "All Photos" and "Unsorted" used to always sit here as permanent folder rows —
    // removed on request, to match Kamero, where the sidebar only ever lists real
    // camera/album folders you actually created. Photos with no album still exist
    // (guest uploads before an album pick, older imports, etc.) but they're no longer
    // a permanent nav destination — see the "needs filing" banner below instead, which
    // is a one-off action to move them into a real album, not a folder to browse.
    const unsortedCount = dashboardEventPhotos.filter(function (p) { return !p.album; }).length;
    // Highlights shows up as a folder-like entry — clicking it filters the same grid to
    // just isHighlight:true photos, so the studio browses/manages Highlights exactly
    // the same way as any other album instead of only being able to reach it one photo
    // at a time from the lightbox star toggle.
    const highlightCount = dashboardEventPhotos.filter(function (p) { return p.isHighlight; }).length;
    // The Highlights row only exists in this list while Highlight is actually turned
    // on for the event (e.highlightEnabled) — disabling it should make the whole
    // folder-view disappear from the sidebar again, same as if it never had photos in
    // it, rather than leaving a dead/empty entry sitting there permanently.
    const specials = [];
    if (e.highlightEnabled) specials.push({ key: 'HIGHLIGHTS', label: 'Highlights', icon: 'STAR', count: highlightCount, round: true });
    if (selectedAlbumFilter === 'HIGHLIGHTS' && !e.highlightEnabled) {
      selectedAlbumFilter = e.albums.length ? e.albums[0].name : null;
    }
    if (unsortedCount > 0) {
      const banner = document.createElement('div');
      banner.style.cssText = 'padding:9px 10px;margin:0 -8px 6px;border-radius:8px;cursor:pointer;background:rgba(240,166,62,.12);border:1px solid rgba(240,166,62,.35);';
      banner.innerHTML = '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:#B5762A;"><i data-icon="WARNING" style="width:14px;height:14px;flex-shrink:0;"></i>' +
        unsortedCount + ' photo' + (unsortedCount === 1 ? '' : 's') + ' need' + (unsortedCount === 1 ? 's' : '') + ' an album</div>' +
        '<div style="font-size:11px;color:var(--muted);margin-top:2px;">Review &amp; File &rarr;</div>';
      banner.addEventListener('click', reviewUnsortedPhotos);
      list.appendChild(banner);
    }
    specials.forEach(function (special) {
      const row = document.createElement('div');
      const active = selectedAlbumFilter === special.key;
      row.className = 'toggle-row' + (active ? ' active-album' : '');
      row.style.cssText = 'padding:9px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;' + (active ? 'background:var(--accent-soft);' : '');
      // Highlights gets a round icon badge (gold circle) instead of the plain square-ish
      // outline icons the other folders use, so it visually reads as its own distinct,
      // curated thing rather than just another album in the list.
      const iconHtml = special.round
        ? '<span style="width:18px;height:18px;border-radius:50%;background:var(--accent-gold,#B08A4A);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;"><i data-icon="' + special.icon + '" style="width:11px;height:11px;"></i></span>'
        : '<i data-icon="' + special.icon + '"></i>';
      row.innerHTML = '<div class="t" style="display:flex;align-items:center;gap:8px;font-size:12.5px;' + (active ? 'color:var(--accent-ink);font-weight:800;' : '') + '">' + iconHtml + special.label + ' <span style="color:var(--muted);font-weight:600;">(' + special.count + ')</span></div>';
      row.addEventListener('click', function () { selectAlbum(special.key); });
      list.appendChild(row);
    });
    if (!e.albums.length) {
      fillIcons();
      return;
    }
    const divider = document.createElement('div');
    divider.style.cssText = 'height:1px;background:var(--border);margin:8px -8px;';
    list.appendChild(divider);
    e.albums.forEach(function (a) {
      const row = document.createElement('div');
      row.className = 'toggle-row' + (selectedAlbumFilter === a.name ? ' active-album' : '');
      row.style.cssText = 'padding:9px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;' +
        (selectedAlbumFilter === a.name ? 'background:var(--accent-soft);' : '');
      row.innerHTML =
        '<div class="t" style="display:flex;align-items:center;gap:8px;font-size:12.5px;' + (selectedAlbumFilter === a.name ? 'color:var(--accent-ink);font-weight:800;' : '') + '">' +
          (a.cover ? '<img src="' + a.cover + '" style="width:18px;height:18px;border-radius:4px;object-fit:cover;flex-shrink:0;">' : '<i data-icon="FOLDER"></i>') +
          a.name + ' <span style="color:var(--muted);font-weight:600;">(' + a.count + ')</span></div>' +
        '<div style="display:flex;gap:2px;">' +
          '<label class="icon-mini" data-thumb-album="' + a.name + '" title="Set Thumbnail" style="cursor:pointer;"><i data-icon="IMAGE"></i>' +
            '<input type="file" accept="image/*" style="display:none;" data-thumb-input="' + a.name + '">' +
          '</label>' +
          '<button class="icon-mini" data-rename-album="' + a.name + '"><i data-icon="EDIT"></i></button>' +
          '<button class="icon-mini" data-del-album="' + a.name + '"><i data-icon="TRASH"></i></button>' +
        '</div>';
      row.addEventListener('click', function () { selectAlbum(a.name); });
      row.querySelector('[data-thumb-album]').addEventListener('click', function (ev) { ev.stopPropagation(); });
      row.querySelector('[data-thumb-input]').addEventListener('change', function (ev) { ev.stopPropagation(); uploadAlbumThumbnail(ev, a.name); });
      row.querySelector('[data-rename-album]').addEventListener('click', function (ev) { ev.stopPropagation(); renameAlbum(a.name); });
      row.querySelector('[data-del-album]').addEventListener('click', function (ev) { ev.stopPropagation(); deleteAlbum(a.name); });
      list.appendChild(row);
    });
    fillIcons();
  }

  // "Unsorted" isn't a permanent folder in the sidebar anymore — this is the one-off
  // action behind the amber banner above, for when there actually are photos with no
  // album (guest uploads before an album pick, older imports, etc.). Turns select mode
  // on immediately since the whole point of landing here is to bulk-move them into a
  // real album via the "Move to Album" bulk action, not to browse them indefinitely.
  function reviewUnsortedPhotos() {
    selectedAlbumFilter = '';
    gridSelectMode = true;
