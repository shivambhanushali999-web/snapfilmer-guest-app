    gridSelectedPhotoIds = [];
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (e) renderAlbumSidebar(e);
    renderEventPhotosGrid();
  }

  function selectAlbum(name) {
    selectedAlbumFilter = name;
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (e) renderAlbumSidebar(e);
    renderEventPhotosGrid();
  }

  // Dashboard didn't previously read back its own uploaded photos at all — the studio
  // could upload but never actually browse what was in an event/album from here. This
  // mirrors the guest app's Firestore sync so the studio can see the same gallery.
  function startDashboardPhotosSync(eventId) {
    if (dashboardPhotosUnsub) { dashboardPhotosUnsub(); dashboardPhotosUnsub = null; }
    if (!db) return;
    dashboardPhotosUnsub = db.collection('photos').where('eventId', '==', eventId).onSnapshot(function (snap) {
      dashboardEventPhotos = snap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); });
      reconcileAlbumCounts(eventId);
      // Highlights' "(N)" count in the sidebar isn't a stored field like named-album
      // counts are — it's always derived live from dashboardEventPhotos — so it needs
      // its own refresh here rather than piggybacking on reconcileAlbumCounts, which
      // only re-renders the sidebar when a *named* album's count actually changed.
      const ev = EVENTS.find(function (x) { return x.id === eventId; });
      if (ev) renderAlbumSidebar(ev);
      renderEventPhotosGrid();
    }, function () {});
  }

  // Album "(count)" badges in the sidebar used to only update via a number that got
  // incremented by hand at upload time — any path that missed that step (or any drift
  // from deletes/moves) left the sidebar showing a stale count forever, like "(0)" next
  // to an album that visibly has photos in it. Recomputing straight from the live
  // photos collection (the same data the grid above already uses, which is why IT was
  // always correct) means the sidebar can't go stale, and self-heals old bad data too.
  function reconcileAlbumCounts(eventId) {
    const ev = EVENTS.find(function (e) { return e.id === eventId; });
    if (!ev || !Array.isArray(ev.albums) || !ev.albums.length) return;
    let changed = false;
    ev.albums.forEach(function (a) {
      const real = dashboardEventPhotos.filter(function (p) { return p.album === a.name; }).length;
      if (a.count !== real) { a.count = real; changed = true; }
    });
    if (changed) {
      renderAlbumSidebar(ev);
      syncEventPrivacyToCloud(eventId, { albums: ev.albums });
    }
  }

  // selectedAlbumFilter meanings: null = nothing selected (event has zero albums yet —
  // shows a "create an album" prompt instead of a grid), 'HIGHLIGHTS' = curated view,
  // '' = the one-off Unsorted-review triggered from the amber banner (not a permanent
  // folder), any other string = that specific real album's name. There's no more 'ALL'
  // ("All Photos") view — every real photo lives in a folder you actually created,
  // matching Kamero, and the rare unsorted leftovers get filed away via "Move to Album"
  // rather than lived in permanently.
  function renderEventPhotosGrid() {
    const titleEl = document.getElementById('ep-album-title');
    const countEl = document.getElementById('ep-album-count');
    const grid = document.getElementById('ep-photo-grid');
    const targetNote = document.getElementById('ep-upload-target-note');
    if (targetNote) {
      const targetLabel = (selectedAlbumFilter && selectedAlbumFilter !== 'HIGHLIGHTS') ? '"' + selectedAlbumFilter + '"' : 'Unsorted';
      targetNote.innerHTML = selectedAlbumFilter === 'HIGHLIGHTS'
        ? 'Uploading to: <strong style="color:var(--ink);">Highlights</strong> — new photos here are automatically marked as highlighted (and stay visible to every guest, even with Face-Based Privacy on).'
        : selectedAlbumFilter
          ? 'Uploading to: <strong style="color:var(--ink);">' + targetLabel + '</strong>'
          : 'Create an album on the left first, then upload straight into it.';
    }
    if (!grid) return;
    // null = no album exists yet for this event at all. '' is deliberately distinct —
    // that's the one-off Unsorted-review view opened from the amber banner.
    if (selectedAlbumFilter === null) {
      if (titleEl) titleEl.textContent = 'No albums yet';
      if (countEl) countEl.textContent = '';
      grid.innerHTML = '<div class="empty-note">Add an album on the left to start uploading and organizing photos into folders, just like your camera folders (Cam 1, Cam 2, ...).</div>';
      return;
    }
    const filtered = selectedAlbumFilter === 'HIGHLIGHTS'
      ? dashboardEventPhotos.filter(function (p) { return p.isHighlight; })
      : selectedAlbumFilter
        ? dashboardEventPhotos.filter(function (p) { return p.album === selectedAlbumFilter; })
        : dashboardEventPhotos.filter(function (p) { return !p.album; });
    if (titleEl) titleEl.textContent = selectedAlbumFilter === 'HIGHLIGHTS' ? 'Highlights' : (selectedAlbumFilter || 'Unsorted Photos');
    if (countEl) countEl.textContent = filtered.length + ' photos' + (gridSelectMode && gridSelectedPhotoIds.length ? ' &middot; ' + gridSelectedPhotoIds.length + ' selected' : '');
    grid.innerHTML = '';
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-note">' +
        (selectedAlbumFilter === 'HIGHLIGHTS'
          ? 'No Highlights yet — upload photos right here to mark them highlighted automatically, or select photos in an album, then "Add to Highlights".'
          : 'No photos here yet — upload above to add some to ' + (selectedAlbumFilter ? '"' + selectedAlbumFilter + '"' : 'this event') + '.') +
        '</div>';
      return;
    }
    if (gridSelectMode && gridSelectedPhotoIds.length) {
      const bar = document.createElement('div');
      bar.style.cssText = 'grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-bottom:4px;flex-wrap:wrap;';
      bar.innerHTML =
        '<button class="btn-outline btn-sm" onclick="openMoveToAlbumModal()">' + ICONS.FOLDER + ' Move to Album</button>' +
        (selectedAlbumFilter === 'HIGHLIGHTS'
          ? '<button class="btn-outline btn-sm" onclick="removeSelectedFromHighlights()">' + ICONS.STAR + ' Remove ' + gridSelectedPhotoIds.length + ' from Highlights</button>'
          : '<button class="btn-outline btn-sm" onclick="addSelectedToHighlights()">' + ICONS.STAR + ' Add ' + gridSelectedPhotoIds.length + ' to Highlights</button>') +
        '<button class="btn-danger btn-sm" onclick="deleteSelectedPhotos()">' + ICONS.TRASH + ' Delete ' + gridSelectedPhotoIds.length + ' Selected</button>';
      grid.appendChild(bar);
    }
    // Same batched/infinite-scroll rendering as the guest app's renderPhotoGrid() —
    // a studio managing a 20k-photo event needs this grid to stay responsive too, not
    // just the guest side. thumbUrl (generated at upload time) keeps each cell light;
    // the lightbox still opens the full-size dataUrl.
    if (epGridObserver) { epGridObserver.disconnect(); epGridObserver = null; }
    const EP_GRID_PAGE_SIZE = 60;
    const sentinel = document.createElement('div');
    sentinel.style.cssText = 'grid-column:1/-1;height:1px;';
    grid.appendChild(sentinel);
    let renderedCount = 0;
    function renderNextEpBatch() {
      const end = Math.min(renderedCount + EP_GRID_PAGE_SIZE, filtered.length);
      const frag = document.createDocumentFragment();
      for (let idx = renderedCount; idx < end; idx++) {
        const p = filtered[idx];
        const selected = gridSelectedPhotoIds.indexOf(p.id) > -1;
        const cell = document.createElement('div');
        cell.style.cssText = 'aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);position:relative;cursor:pointer;' + (selected ? 'outline:3px solid var(--accent-ink);outline-offset:-3px;' : '');
        cell.innerHTML = '<img src="' + (p.thumbUrl || p.dataUrl) + '" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy">' +
          (p.isHighlight ? '<div style="position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:rgba(20,16,20,.55);display:flex;align-items:center;justify-content:center;color:#f5c451;" title="Highlighted">' + ICONS.STAR + '</div>' : '') +
          (gridSelectMode ? '<div style="position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:' + (selected ? 'var(--accent-ink)' : 'rgba(255,255,255,.85)') + ';border:1px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;color:#fff;">' + (selected ? ICONS.CHECK : '') + '</div>' : '');
        cell.addEventListener('click', function () {
          if (gridSelectMode) toggleSelectPhoto(p.id);
          else openPhotoLightbox(filtered, idx);
        });
        frag.appendChild(cell);
      }
      grid.insertBefore(frag, sentinel);
      renderedCount = end;
      fillIcons();
      if (renderedCount >= filtered.length && epGridObserver) { epGridObserver.disconnect(); epGridObserver = null; }
    }
    renderNextEpBatch();
    if (filtered.length > EP_GRID_PAGE_SIZE) {
      epGridObserver = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) renderNextEpBatch();
      }, { rootMargin: '900px' });
      epGridObserver.observe(sentinel);
    }
  }

  // ================= Photo Lightbox =================
  // Real Kamero's photo grid isn't just a static grid — clicking any photo opens a
  // full-screen viewer (filename, prev/next, Event Cover / Album Cover, share /
  // download / delete, AI Enhance). The dashboard never had any click-to-view before.
  let lightboxPhotos = [];
  let lightboxIndex = 0;
  // Zoom/rotate view state — persists across a highlight-toggle or move-to-album
  // re-render (so those don't yank you back to 1x mid-inspection), but resets whenever
  // you actually move to a different photo, same as any real photo viewer.
  let lightboxZoom = 1;
  let lightboxRotation = 0;
  let lightboxSlideshowTimer = null;

  function openPhotoLightbox(list, index) {
    lightboxPhotos = list;
    lightboxIndex = index;
    lightboxZoom = 1;
    lightboxRotation = 0;
    document.addEventListener('keydown', lightboxKeyHandler);
    renderLightbox();
  }

  function closeLightbox() {
    lightboxPhotos = [];
    if (lightboxSlideshowTimer) { clearInterval(lightboxSlideshowTimer); lightboxSlideshowTimer = null; }
    document.removeEventListener('keydown', lightboxKeyHandler);
    const root = document.getElementById('lightbox-root');
    if (root) root.innerHTML = '';
  }

  function navigateLightbox(delta) {
    const next = lightboxIndex + delta;
    if (next < 0 || next >= lightboxPhotos.length) return;
    lightboxIndex = next;
    lightboxZoom = 1;
    lightboxRotation = 0;
    renderLightbox();
  }

  function lightboxKeyHandler(ev) {
    if (!lightboxPhotos.length) return;
    if (ev.key === 'Escape') { closeLightbox(); return; }
    if (ev.key === 'ArrowLeft') { navigateLightbox(-1); return; }
    if (ev.key === 'ArrowRight') { navigateLightbox(1); return; }
    if (ev.key === ' ' || ev.code === 'Space') { ev.preventDefault(); toggleLightboxSlideshow(); }
  }

  // Keeps the zoom/rotate CSS in sync without a full innerHTML rebuild — smoother for
  // the scroll-to-zoom case, which fires many times a second while the wheel moves.
  function applyLightboxTransform() {
    const img = document.getElementById('lb-stage-img');
    if (img) img.style.transform = 'scale(' + lightboxZoom + ') rotate(' + lightboxRotation + 'deg)';
  }
  function zoomLightbox(delta) {
    lightboxZoom = Math.max(0.5, Math.min(4, +(lightboxZoom + delta).toFixed(2)));
    applyLightboxTransform();
  }
  function fitLightboxView() {
    lightboxZoom = 1;
    applyLightboxTransform();
  }
  function rotateLightboxView(delta) {
    lightboxRotation = (lightboxRotation + delta + 360) % 360;
    applyLightboxTransform();
  }
  function resetLightboxView() {
    lightboxZoom = 1;
    lightboxRotation = 0;
    applyLightboxTransform();
  }
  function lightboxWheelZoom(ev) {
    ev.preventDefault();
    zoomLightbox(ev.deltaY < 0 ? 0.15 : -0.15);
  }
  function fullscreenLightbox() {
    const el = document.getElementById('lightbox-root');
    if (!document.fullscreenElement) {
      if (el && el.requestFullscreen) el.requestFullscreen().catch(function () {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(function () {});
    }
  }
  // Real auto-advance, not a decorative label — steps through every photo in this
  // view at a fixed interval and loops back to the start, same as the Space-bar hint
  // in the toolbar promises.
  function toggleLightboxSlideshow() {
    if (lightboxSlideshowTimer) {
      clearInterval(lightboxSlideshowTimer);
      lightboxSlideshowTimer = null;
    } else {
      lightboxSlideshowTimer = setInterval(function () {
        const next = lightboxIndex + 1 >= lightboxPhotos.length ? 0 : lightboxIndex + 1;
        lightboxIndex = next;
        lightboxZoom = 1;
        lightboxRotation = 0;
        renderLightbox();
      }, 3000);
    }
    renderLightbox();
  }

  function escLb(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function formatCapturedDate(iso) {
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    } catch (err) { return null; }
  }
  function lbDetailRow(label, iconName, value) {
    return '<div style="display:flex;gap:10px;align-items:flex-start;">' +
      '<div style="color:var(--accent);flex-shrink:0;margin-top:1px;">' + (ICONS[iconName] || '') + '</div>' +
      '<div style="min-width:0;">' +
        '<div style="font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;">' + label + '</div>' +
        '<div style="font-size:13px;font-weight:700;color:var(--ink);word-break:break-word;">' + (value ? escLb(value) : '<span style="color:var(--muted);font-weight:600;">Not available</span>') + '</div>' +
      '</div>' +
    '</div>';
  }

  function renderLightbox() {
    const root = document.getElementById('lightbox-root');
    if (!root || !lightboxPhotos.length) return;
    const p = lightboxPhotos[lightboxIndex];
    const total = lightboxPhotos.length;
    const evForMove = EVENTS.find(function (x) { return x.id === currentEventId; });
    const moveOptions = '<option value=""' + (!p.album ? ' selected' : '') + '>Move to: Unsorted</option>' +
      ((evForMove && evForMove.albums) || []).map(function (a) {
        return '<option value="' + a.name + '"' + (p.album === a.name ? ' selected' : '') + '>Move to: ' + a.name + '</option>';
      }).join('');
    const filename = p.filename || ('photo-' + p.id + '.jpg');
    root.innerHTML =
      '<div id="lightbox-shell" style="position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-wrap:wrap;gap:10px;background:var(--surface);border-bottom:1px solid var(--border);">' +
          '<div style="display:flex;align-items:center;gap:14px;min-width:0;">' +
            '<button class="icon-btn" onclick="closeLightbox()"><i data-icon="BACK"></i></button>' +
            '<div style="font-size:12.5px;color:var(--muted);white-space:nowrap;"><span style="color:var(--accent);font-weight:800;">' + (lightboxIndex + 1) + '</span> of ' + total + '</div>' +
            '<div style="display:flex;align-items:center;gap:6px;min-width:0;padding-left:12px;border-left:1px solid var(--border);">' +
              '<span style="font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;" title="' + escLb(filename) + '">' + escLb(filename) + '</span>' +
              '<button class="icon-btn" style="width:28px;height:28px;border-radius:8px;" title="Copy filename" onclick="copyText(\'' + filename.replace(/'/g, "\\'") + '\')"><i data-icon="COPY"></i></button>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
            '<button class="btn-outline btn-sm" onclick="toggleLightboxSlideshow()">' + (lightboxSlideshowTimer ? ICONS.PAUSE : ICONS.PLAY) + (lightboxSlideshowTimer ? ' Pause' : ' Slideshow') + '</button>' +
            '<select class="input" style="width:auto;padding:8px 10px;font-size:12px;" onchange="moveLightboxPhotoToAlbum(this.value)">' + moveOptions + '</select>' +
            '<button class="btn-outline btn-sm" onclick="setLightboxAs(\'cover\')">Event Cover</button>' +
            '<button class="btn-outline btn-sm" onclick="setLightboxAs(\'album\')">Album Cover</button>' +
            '<button class="icon-btn" style="' + (p.isHighlight ? 'background:var(--accent);color:#fff;border-color:var(--accent);' : '') + '" title="' + (p.isHighlight ? 'Remove from Highlights' : 'Mark as Highlight') + '" onclick="toggleLightboxHighlight()"><i data-icon="STAR"></i></button>' +
            '<button class="icon-btn" onclick="shareLightboxPhoto()"><i data-icon="SHARE"></i></button>' +
            '<button class="icon-btn" onclick="downloadLightboxPhoto()"><i data-icon="DOWNLOAD"></i></button>' +
            '<button class="icon-btn" onclick="deleteLightboxPhoto()"><i data-icon="TRASH"></i></button>' +
            '<button class="icon-btn" onclick="closeLightbox()"><i data-icon="CLOSE"></i></button>' +
          '</div>' +
        '</div>' +
        '<div style="flex:1;display:flex;min-height:0;">' +
          '<div style="width:230px;flex-shrink:0;padding:22px 18px;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);">' +
            '<div style="font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;margin-bottom:18px;">' + ICONS.INFO + ' Photo Details</div>' +
            '<div style="display:flex;flex-direction:column;gap:16px;">' +
              lbDetailRow('Camera', 'CAMERA', p.camera) +
              lbDetailRow('Lens', 'APERTURE', p.lens) +
              lbDetailRow('Captured', 'CALENDAR', p.capturedAt ? formatCapturedDate(p.capturedAt) : null) +
            '</div>' +
            '<button class="btn-solid" style="margin-top:22px;width:100%;background:linear-gradient(90deg,#22C1C3,#8B5CF6);" onclick="alert(\'AI Enhance would sharpen/relight this photo automatically — not wired to a real image model in this test build.\')">' + ICONS.STAR + ' AI Enhance</button>' +
          '</div>' +
          '<div id="lb-stage" style="flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;overflow:hidden;background:var(--bg);" onwheel="lightboxWheelZoom(event)">' +
            '<button class="icon-btn" style="position:absolute;left:20px;z-index:2;opacity:' + (lightboxIndex === 0 ? '.3' : '1') + ';" onclick="navigateLightbox(-1)"' + (lightboxIndex === 0 ? ' disabled' : '') + '><i data-icon="BACK"></i></button>' +
            '<img id="lb-stage-img" src="' + p.dataUrl + '" style="max-width:82%;max-height:85%;object-fit:contain;border-radius:4px;box-shadow:0 20px 50px -24px rgba(20,16,20,.35);transform:scale(' + lightboxZoom + ') rotate(' + lightboxRotation + 'deg);transition:transform .12s ease;">' +
            '<button class="icon-btn" style="position:absolute;right:20px;z-index:2;opacity:' + (lightboxIndex === total - 1 ? '.3' : '1') + ';" onclick="navigateLightbox(1)"' + (lightboxIndex === total - 1 ? ' disabled' : '') + '><i data-icon="CHEVRON_RIGHT"></i></button>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;justify-content:center;position:relative;gap:6px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--border);">' +
          '<button class="icon-btn" title="Zoom out" onclick="zoomLightbox(-0.25)"><i data-icon="ZOOM_OUT"></i></button>' +
          '<button class="btn-outline btn-sm" onclick="fitLightboxView()">Fit</button>' +
          '<button class="icon-btn" title="Zoom in" onclick="zoomLightbox(0.25)"><i data-icon="ZOOM_IN"></i></button>' +
          '<button class="icon-btn" title="Fullscreen" onclick="fullscreenLightbox()"><i data-icon="EXPAND"></i></button>' +
          '<button class="icon-btn" title="Rotate left" onclick="rotateLightboxView(-90)"><i data-icon="ROTATE_LEFT"></i></button>' +
          '<button class="icon-btn" title="Rotate right" onclick="rotateLightboxView(90)"><i data-icon="ROTATE_RIGHT"></i></button>' +
          '<button class="btn-outline btn-sm" onclick="resetLightboxView()">' + ICONS.REFRESH + ' Reset</button>' +
          '<div style="position:absolute;right:20px;font-size:10.5px;color:var(--muted);white-space:nowrap;">Scroll: Zoom &bull; Space: ' + (lightboxSlideshowTimer ? 'Pause' : 'Play') + ' &bull; Esc: Close</div>' +
        '</div>' +
      '</div>';
    fillIcons();
  }

  // "Highlights" on the guest app's Home screen used to just be hardcoded demo photos
  // with no way for a studio to actually choose what shows there — this is the real
  // thing: star any photo here and it's what guests see in that row (see the guest
  // app's renderStories(), which now filters real photos by isHighlight instead of
  // showing picsum.photos placeholders).
  function toggleLightboxHighlight() {
    const p = lightboxPhotos[lightboxIndex];
    if (!p || !db) return;
    const next = !p.isHighlight;
    db.collection('photos').doc(p.id).set({ isHighlight: next }, { merge: true }).then(function () {
      p.isHighlight = next;
      renderLightbox();
    }).catch(function () { alert('Could not update highlight status — please try again.'); });
  }

  // Used to just be a bare alert() for "Album Cover" (nothing was ever actually saved
  // anywhere) and a local-only e.cover = ... for "Event Cover" (never synced to
  // Firestore, so it looked like it worked but vanished on refresh and never reached
  // the guest app at all). Both now open a real crop tool — matching Kamero, which
  // lets you frame the cover before it's set — and actually persist the result.
  function setLightboxAs(kind) {
    const p = lightboxPhotos[lightboxIndex];
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!p || !e) return;
    if (kind === 'album' && !p.album) {
      alert('This photo is Unsorted. Move it into a real album first (use the dropdown above), then set it as that album\'s cover.');
      return;
    }
    openCoverCropModal(kind, p, e);
  }

  // ================= Cover crop tool =================
  // Real drag-to-reposition + zoom cropper, not just "upload and hope it's framed
  // right" — matches the crop step Kamero shows before confirming an Event/Album
  // cover. Output is a fixed 4:3 crop so cover art looks consistent across every
  // album/event card instead of whatever aspect the original photo happened to be.
  let coverCrop = null; // { kind, photo, eventId, albumName, scale, offsetX, offsetY, naturalW, naturalH, viewportW, viewportH, dragging, lastX, lastY }

  function openCoverCropModal(kind, p, e) {
    const root = document.getElementById('cover-crop-modal-root');
    if (!root) return;
    coverCrop = {
      kind: kind, photo: p, eventId: e.id, albumName: p.album || '',
      scale: 1, offsetX: 0, offsetY: 0, naturalW: 0, naturalH: 0,
      viewportW: 0, viewportH: 0, dragging: false, lastX: 0, lastY: 0,
    };
    const title = kind === 'cover' ? 'Set Event Cover' : ('Set Cover for "' + p.album + '"');
    root.innerHTML =
      '<div style="position:fixed;inset:0;background:rgba(20,16,20,.6);z-index:320;display:flex;align-items:center;justify-content:center;padding:24px;">' +
        '<div style="background:var(--surface);border-radius:18px;max-width:480px;width:100%;padding:24px 24px 20px;box-shadow:0 30px 70px -24px rgba(0,0,0,.4);">' +
          '<div class="card-title" style="margin:0 0 4px;">' + title + '</div>' +
          '<p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">Drag to reposition, use the slider to zoom, then save.</p>' +
          // 16:9 to match the guest app's actual .home-album-card aspect ratio exactly —
          // it used to be 4:3 here while the card was a much shorter, wider fixed-height
          // banner, so the guest app's object-fit:cover re-cropped whatever got framed
          // here a second time, cutting off faces that looked fine in this preview.
          '<div id="cover-crop-viewport" style="position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#000;cursor:grab;touch-action:none;">' +
            // crossorigin="anonymous" matters here specifically because photo bytes live
            // in Firebase Storage (a different origin than this dashboard page) — without
            // it, drawing this <img> onto the crop canvas below "taints" the canvas and
            // toBlob()/toDataURL() throw a security error instead of producing an image.
            '<img id="cover-crop-img" crossorigin="anonymous" src="' + p.dataUrl + '" style="position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;">' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px;margin-top:14px;">' +
            '<i data-icon="IMAGE" style="opacity:.5;flex-shrink:0;"></i>' +
            '<input type="range" id="cover-crop-zoom" min="100" max="300" value="100" style="flex:1;" oninput="onCoverCropZoom(this.value)">' +
          '</div>' +
          '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;">' +
            '<button class="btn-outline btn-sm" onclick="closeCoverCropModal()">Cancel</button>' +
            '<button class="btn-solid btn-sm" id="cover-crop-save-btn" onclick="confirmCoverCrop()">Save Cover</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    fillIcons();
    const img = document.getElementById('cover-crop-img');
    const viewport = document.getElementById('cover-crop-viewport');
    img.onload = function () {
      coverCrop.naturalW = img.naturalWidth;
      coverCrop.naturalH = img.naturalHeight;
      const rect = viewport.getBoundingClientRect();
      coverCrop.viewportW = rect.width;
      coverCrop.viewportH = rect.height;
      const baseScale = Math.max(coverCrop.viewportW / coverCrop.naturalW, coverCrop.viewportH / coverCrop.naturalH);
      coverCrop.baseScale = baseScale;
      const dispW = coverCrop.naturalW * baseScale;
      const dispH = coverCrop.naturalH * baseScale;
      coverCrop.offsetX = (coverCrop.viewportW - dispW) / 2;
      // Dead-centering vertically used to cut heads off by default on portrait-oriented
      // photos — fitting a tall photo into this wide 16:9 frame usually means a lot of
      // vertical overflow gets hidden, and most of a photo's important content (faces)
      // sits in the upper portion, not the middle. Biasing the default toward the top
      // (instead of centered) means the initial framing already looks reasonable before
      // the studio even touches the drag/zoom controls, rather than needing a fix every
      // single time.
      coverCrop.offsetY = Math.min(0, (coverCrop.viewportH - dispH) * 0.15);
      renderCoverCropImg();
    };
    if (img.complete && img.naturalWidth) img.onload();
    viewport.addEventListener('pointerdown', coverCropPointerDown);
    window.addEventListener('pointermove', coverCropPointerMove);
    window.addEventListener('pointerup', coverCropPointerUp);
  }

  function renderCoverCropImg() {
    const img = document.getElementById('cover-crop-img');
    if (!img || !coverCrop) return;
    const dispW = coverCrop.naturalW * coverCrop.baseScale * coverCrop.scale;
    const dispH = coverCrop.naturalH * coverCrop.baseScale * coverCrop.scale;
    img.style.width = dispW + 'px';
    img.style.height = dispH + 'px';
    img.style.transform = 'translate(' + coverCrop.offsetX + 'px, ' + coverCrop.offsetY + 'px)';
  }

  // Keeps the image edge from ever being dragged past the viewport border, i.e. no
  // gap of empty black space can appear — the cover is always fully "covered".
  function clampCoverCropOffsets() {
    const dispW = coverCrop.naturalW * coverCrop.baseScale * coverCrop.scale;
    const dispH = coverCrop.naturalH * coverCrop.baseScale * coverCrop.scale;
    const minX = Math.min(0, coverCrop.viewportW - dispW);
    const minY = Math.min(0, coverCrop.viewportH - dispH);
    coverCrop.offsetX = Math.max(minX, Math.min(0, coverCrop.offsetX));
    coverCrop.offsetY = Math.max(minY, Math.min(0, coverCrop.offsetY));
  }

  function coverCropPointerDown(ev) {
    if (!coverCrop) return;
    coverCrop.dragging = true;
    coverCrop.lastX = ev.clientX;
    coverCrop.lastY = ev.clientY;
    const viewport = document.getElementById('cover-crop-viewport');
    if (viewport) viewport.style.cursor = 'grabbing';
  }

  function coverCropPointerMove(ev) {
    if (!coverCrop || !coverCrop.dragging) return;
    const dx = ev.clientX - coverCrop.lastX;
    const dy = ev.clientY - coverCrop.lastY;
    coverCrop.lastX = ev.clientX;
    coverCrop.lastY = ev.clientY;
    coverCrop.offsetX += dx;
    coverCrop.offsetY += dy;
    clampCoverCropOffsets();
    renderCoverCropImg();
  }

  function coverCropPointerUp() {
    if (!coverCrop) return;
    coverCrop.dragging = false;
    const viewport = document.getElementById('cover-crop-viewport');
    if (viewport) viewport.style.cursor = 'grab';
  }

  function onCoverCropZoom(value) {
    if (!coverCrop) return;
    // Keep the viewport's center pointing at the same spot in the image while the
    // zoom changes, instead of the image jumping to re-center on every slider move.
    const oldScale = coverCrop.scale;
    const newScale = Number(value) / 100;
    const cx = coverCrop.viewportW / 2, cy = coverCrop.viewportH / 2;
    const imgX = (cx - coverCrop.offsetX) / oldScale;
    const imgY = (cy - coverCrop.offsetY) / oldScale;
    coverCrop.scale = newScale;
    coverCrop.offsetX = cx - imgX * newScale;
    coverCrop.offsetY = cy - imgY * newScale;
    clampCoverCropOffsets();
    renderCoverCropImg();
  }

  function closeCoverCropModal() {
    window.removeEventListener('pointermove', coverCropPointerMove);
    window.removeEventListener('pointerup', coverCropPointerUp);
    const root = document.getElementById('cover-crop-modal-root');
    if (root) root.innerHTML = '';
    coverCrop = null;
  }

  function confirmCoverCrop() {
    if (!coverCrop) return;
    const btn = document.getElementById('cover-crop-save-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
    const c = coverCrop;
    const dispScale = c.baseScale * c.scale;
    // Map the visible viewport rectangle back into the original, un-scaled image's
    // own pixel coordinates, then draw exactly that rectangle onto a fixed 16:9 output
    // canvas (matching the guest app's .home-album-card aspect ratio exactly) — this is
    // what actually "bakes in" the crop/pan/zoom into a real image file, instead of
    // only ever looking right inside this modal.
    const sx = -c.offsetX / dispScale;
    const sy = -c.offsetY / dispScale;
    const sw = c.viewportW / dispScale;
    const sh = c.viewportH / dispScale;
    const outW = 960, outH = 540;
    const canvas = document.createElement('canvas');
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext('2d');
    const img = document.getElementById('cover-crop-img');
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
    // drawImage() itself never throws for a cross-origin source — the canvas just
    // silently becomes "tainted", and it's toBlob()/toDataURL() below that then throws
    // a SecurityError. That's what the try/catch around those calls is guarding
    // against, not this line.
    const finish = function (url) {
      const e = EVENTS.find(function (x) { return x.id === c.eventId; });
      if (e) {
        if (c.kind === 'cover') {
          // Re-cropping/replacing a cover otherwise leaves the previous crop's Storage
          // file behind with nothing pointing at it anymore — clean it up once the new
          // one is safely saved.
          const oldUrl = e.cover;
          e.cover = url;
          syncEventPrivacyToCloud(e.id, { cover: url });
          if (oldUrl) deleteStorageFileByUrl(oldUrl);
        } else {
          const album = e.albums.find(function (a) { return a.name === c.albumName; });
          if (album) {
            const oldUrl = album.cover;
            album.cover = url;
            syncEventPrivacyToCloud(e.id, { albums: e.albums });
            if (oldUrl) deleteStorageFileByUrl(oldUrl);
          }
        }
        renderAlbumSidebar(e);
        if (currentEventId === e.id) renderEventPhotosGrid();
      }
      closeCoverCropModal();
    };
    try {
      if (canvas.toBlob) {
        canvas.toBlob(function (blob) {
          if (!blob || !storage) { finish(canvas.toDataURL('image/jpeg', 0.85)); return; }
          uploadPhotoToStorage(blob, 'cover.jpg', 'photos/' + c.eventId).then(finish).catch(function () {
            alert('Could not upload the cropped cover — please try again.');
            if (btn) { btn.disabled = false; btn.textContent = 'Save Cover'; }
          });
        }, 'image/jpeg', 0.85);
      } else {
        finish(canvas.toDataURL('image/jpeg', 0.85));
      }
    } catch (err) {
      // Tainted-canvas SecurityError — the photo's host didn't allow cross-origin
      // pixel reads. Rare in practice for this project's own Firebase Storage photos,
      // but fails loudly and recoverably instead of silently doing nothing.
      alert('Could not crop this photo (a browser security restriction blocked it) — please try a different photo.');
      if (btn) { btn.disabled = false; btn.textContent = 'Save Cover'; }
    }
  }

  // Fixes photos that were already misfiled (e.g. uploaded into the wrong album, or
  // Unsorted, because the upload target wasn't obvious before) — no need to re-upload,
  // just move the existing photo doc to the right album from right inside the viewer.
  function moveLightboxPhotoToAlbum(newAlbum) {
    const p = lightboxPhotos[lightboxIndex];
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!p || !e || !db) return;
    const oldAlbum = p.album || '';
    if (newAlbum === oldAlbum) return;
    db.collection('photos').doc(p.id).set({ album: newAlbum }, { merge: true }).then(function () {
      if (oldAlbum) {
        const oldA = e.albums.find(function (a) { return a.name === oldAlbum; });
        if (oldA) oldA.count = Math.max(0, oldA.count - 1);
      }
      if (newAlbum) {
        const newA = e.albums.find(function (a) { return a.name === newAlbum; });
        if (newA) newA.count += 1;
      }
      p.album = newAlbum;
      renderAlbumSidebar(e);
    }).catch(function () { alert('Could not move this photo — please try again.'); });
  }

  function shareLightboxPhoto() {
    const p = lightboxPhotos[lightboxIndex];
    if (!p) return;
    // Shares the real Firebase Storage URL for this exact photo (works immediately,
    // opens directly in a browser) rather than an app deep-link the guest app doesn't
    // parse yet.
    copyText(p.dataUrl || GUEST_APP_URL);
  }

  // Photo files now live in Firebase Storage (a different origin than this dashboard),
  // so a plain <a download> is ignored by the browser and just opens a new tab instead.
  // Fetching the bytes first and downloading from a same-origin blob: URL forces a real
  // save-to-disk, same fix applied to the guest app's triggerDownload().
  function forceDownloadDataUrl(dataUrl, filename) {
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function downloadLightboxPhoto() {
    const p = lightboxPhotos[lightboxIndex];
    if (!p || !p.dataUrl) return;
    // Keep the camera's own filename (e.g. "MITU7165.jpg") instead of renaming it to a
    // generic "photo-<firestore-id>.jpg" — the studio needs the original numbering
    // intact for their own file organization, editing workflow, and client delivery.
    // Only falls back to a generic name for the rare doc that predates filenames being
    // stored at all.
    const filename = p.filename || ('photo-' + p.id + '.jpg');
    if (p.dataUrl.indexOf('data:') === 0) {
      forceDownloadDataUrl(p.dataUrl, filename);
      return;
    }
    // Direct cross-origin fetch() to Firebase Storage was silently failing here (no
    // CORS headers on the response), so the .catch() fallback was firing every time
    // and just opening the photo in a new tab instead of actually downloading it —
    // exactly the "download button opens the photo instead" bug reported. Fixed the
    // same way the guest app's own download button already works: the AWS Lambda
    // fetches the photo server-to-server (no CORS restriction there) and hands it
    // back as base64, which the browser CAN force-download directly.
    fetch(FACE_MATCH_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'download', photoUrl: p.dataUrl }),
    }).then(function (res) { return res.json(); }).then(function (data) {
      if (data.dataUrl) forceDownloadDataUrl(data.dataUrl, filename);
      else window.open(p.dataUrl, '_blank');
    }).catch(function () {
      // At least get the studio to the photo if the Lambda call itself fails (e.g.
      // offline) — better than a silent no-op.
      window.open(p.dataUrl, '_blank');
    });
  }

  function deleteLightboxPhoto() {
    const p = lightboxPhotos[lightboxIndex];
    if (!p || !db) return;
    if (!confirm('Delete this photo? This cannot be undone.')) return;
    db.collection('photos').doc(p.id).delete().then(function () {
      // Fire-and-forget — the Firestore doc is already gone (what actually matters for
      // the UI/guest gallery), so a slow or failed Storage cleanup shouldn't block or
      // error out the delete the studio is watching for.
      deleteStorageFileByUrl(p.dataUrl);
      deleteStorageFileByUrl(p.thumbUrl);
      deleteStorageFileByUrl(p.previewUrl);
      const e = EVENTS.find(function (x) { return x.id === currentEventId; });
      if (e) e.photos = Math.max(0, e.photos - 1);
      lightboxPhotos.splice(lightboxIndex, 1);
      if (!lightboxPhotos.length) { closeLightbox(); return; }
      if (lightboxIndex >= lightboxPhotos.length) lightboxIndex = lightboxPhotos.length - 1;
      renderLightbox();
    }).catch(function () { alert('Could not delete this photo — please try again.'); });
  }

  // Real photo bytes are uploaded straight to Firebase Storage (no lossy canvas
  // re-encode for 'original'), and only the resulting download URL is written into
  // the Firestore "photos" doc — this is what actually fixes the blurry/tiny
  // (40-60KB) downloads, which were caused by every photo being crushed down to
  // fit inside Firestore's 1MB-per-document limit. 'standard' still gets a large,
  // high-quality resize (not a tiny thumbnail) to keep storage/bandwidth sane for
  // guests who don't need the full multi-MB camera file.
  function prepareUploadBlob(file, quality) {
    if (quality === 'original') return Promise.resolve(file);
    return resizeFileToBlob(file, 2000, 0.9);
  }

  function resizeFileToBlob(file, maxWidth, q) {
    return new Promise(function (resolve) {
      const reader = new FileReader();
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          let w = img.width, h = img.height;
          if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          if (canvas.toBlob) {
            canvas.toBlob(function (blob) { resolve(blob || file); }, 'image/jpeg', q);
          } else {
            resolve(file);
          }
        };
        img.onerror = function () { resolve(file); };
        img.src = reader.result;
      };
      reader.onerror = function () { resolve(file); };
      reader.readAsDataURL(file);
    });
  }

  function uploadPhotoToStorage(blob, originalName, folderPath) {
    if (!storage) return Promise.reject(new Error('Storage not available'));
    const safeName = Date.now() + '_' + Math.random().toString(36).slice(2) + '_' +
      (originalName || 'photo.jpg').replace(/[^a-zA-Z0-9_.-]/g, '_');
    const ref = storage.ref().child(folderPath + '/' + safeName);
    return ref.put(blob).then(function (snap) { return snap.ref.getDownloadURL(); });
  }

  // Deletes the actual Storage bytes behind a photo/cover's download URL — without this,
  // every "delete photo" / "delete event" / "replace cover" only ever removed the
  // Firestore *reference* to a file, leaving the real (often multi-MB) file sitting in
  // Storage forever with nothing pointing at it. That's pure orphaned cost with no way
  // to reclaim it short of manually digging through the Storage console.
  //
  // Guest-uploaded photos are base64 data URLs stored directly in Firestore (never
  // touch Storage at all — see the guest app's handleGuestPhotoUpload), so this is a
  // deliberate no-op for those; only real https:// Storage URLs are ever deletable here.
  // Firebase's storage.refFromURL() only works for URLs from THIS project's bucket, so
  // this is also naturally a no-op for anything else (e.g. a studio's own external
  // image link) rather than throwing.
  function deleteStorageFileByUrl(url) {
    if (!storage || !url || url.indexOf('http') !== 0) return Promise.resolve();
    return storage.refFromURL(url).delete().catch(function (err) {
      // 'storage/object-not-found' just means it was already gone (e.g. deleted twice,
      // or manually removed from the console) — not a real failure worth surfacing.
      if (err && err.code !== 'storage/object-not-found') {
        console.error('Could not delete Storage file for', url, err);
      }
    });
  }

  // Batches Firestore writes in groups of up to 400 instead of one .add() per photo —
  // at 10k-100k photos, one round-trip per doc is the single biggest avoidable cost;
  // batched commit() calls turn that into a couple hundred round-trips total instead of
  // tens of thousands.
  function createPhotoBatchWriter() {
    let batch = db.batch();
    let count = 0;
    const commits = [];
    function add(ref, data) {
      batch.set(ref, data);
      count++;
      if (count >= 400) {
        commits.push(batch.commit());
        batch = db.batch();
        count = 0;
      }
    }
    function flush() {
      if (count > 0) commits.push(batch.commit());
      return Promise.all(commits);
    }
    return { add: add, flush: flush };
  }

  // Real EXIF metadata (camera body, lens, capture timestamp) read straight out of the
  // original file's bytes via exif-js — run on the untouched File the browser gave us,
  // BEFORE prepareUploadBlob()/resizeFileToBlob() touches it, since re-encoding through
  // a <canvas> for the 'standard' quality tier strips all EXIF data. Resolves to {} (not
  // a rejection) on anything without usable tags, so a missing lens etc. just shows as
  // "Not available" in the lightbox instead of breaking the upload.
  function parseExifDateTime(exifDt) {
    const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})$/.exec(exifDt || '');
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
    return isNaN(d.getTime()) ? null : d.toISOString();
  }
  function extractExifTags(file) {
    return new Promise(function (resolve) {
      if (typeof EXIF === 'undefined' || !file) { resolve({}); return; }
      try {
        EXIF.getData(file, function () {
          const make = EXIF.getTag(this, 'Make');
          const model = EXIF.getTag(this, 'Model');
          const lens = EXIF.getTag(this, 'LensModel') || EXIF.getTag(this, 'LensInfo') || null;
          const dt = EXIF.getTag(this, 'DateTimeOriginal') || EXIF.getTag(this, 'DateTime');
          const camera = [make, model].filter(Boolean).join(' ').trim();
          resolve({
            camera: camera || null,
            lens: typeof lens === 'string' ? lens.trim() : null,
            capturedAt: parseExifDateTime(dt),
          });
        });
      } catch (err) { resolve({}); }
    });
  }

  // Shared engine behind both upload entry points (event-photos panel + Web
  // Portal/Legacy). Runs a fixed-size worker pool (not one-by-one, not all-at-once)
  // so thousands of files upload as fast as the connection allows without opening
  // thousands of simultaneous browser connections. Firestore writes go through the
  // batch writer above; face indexing is fired per-photo (bounded naturally by the
  // same pool) so large events become instantly searchable without a separate pass.
  const UPLOAD_CONCURRENCY = 6;
  function uploadPhotosWithPool(files, opts) {
    if (!storage || !db) return Promise.reject(new Error('No cloud connection'));
    const writer = createPhotoBatchWriter();
    let nextIndex = 0;
    let doneCount = 0;
    let failCount = 0;
    async function worker() {
      while (nextIndex < files.length) {
        const file = files[nextIndex++];
        const statusEl = opts.onFileStart ? opts.onFileStart(file) : null;
        try {
          const exifPromise = extractExifTags(file);
          // Three sizes come out of every upload: the full-size original (what
          // downloads/Reels/purchases use), a small 400px thumbnail (grid browsing),
          // and a ~1800px "preview" (what the guest's full-screen viewer shows — plenty
          // sharp to fill a phone screen, at a fraction of the original's bytes; there's
          // no pinch-zoom in the viewer, so nothing is ever visibly softer for it).
          // All three resizes AND all three uploads run in parallel (Promise.all) rather
          // than one after another — that's what keeps adding this extra tier from
          // slowing uploads down: total time is bounded by the slowest single upload
          // (almost always the original, since it's the biggest file), not the sum of
          // all three.
          const [blob, thumbBlob, previewBlob] = await Promise.all([
            opts.resize(file),
            resizeFileToBlob(file, 400, 0.6),
            resizeFileToBlob(file, 1800, 0.85),
          ]);
          const [url, thumbUrl, previewUrl] = await Promise.all([
            uploadPhotoToStorage(blob, file.name, 'photos/' + opts.eventId),
            // A failed thumb/preview upload is never worth failing the whole photo
            // over — the guest app already falls back to dataUrl (the original)
            // whenever thumbUrl/previewUrl is missing.
            uploadPhotoToStorage(thumbBlob, file.name, 'thumbs/' + opts.eventId).catch(function () { return null; }),
            uploadPhotoToStorage(previewBlob, file.name, 'previews/' + opts.eventId).catch(function () { return null; }),
          ]);
          const exif = await exifPromise;
          const ref = db.collection('photos').doc();
          writer.add(ref, {
            eventId: opts.eventId, album: opts.albumName, quality: opts.quality, dataUrl: url, thumbUrl: thumbUrl, previewUrl: previewUrl,
            filename: file.name, camera: exif.camera || null, lens: exif.lens || null, capturedAt: exif.capturedAt || null,
            isHighlight: !!opts.markHighlight,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          indexPhotoFace(opts.eventId, ref.id, url);
          doneCount++;
          if (opts.onFileDone) opts.onFileDone(statusEl, true);
        } catch (err) {
          failCount++;
          if (opts.onFileDone) opts.onFileDone(statusEl, false);
        }
      }
    }
    const workers = [];
    for (let i = 0; i < Math.min(UPLOAD_CONCURRENCY, files.length); i++) workers.push(worker());
    return Promise.all(workers).then(function () { return writer.flush(); }).then(function () {
      return { done: doneCount, failed: failCount, total: files.length };
    });
  }

  // One-time catch-up for photos uploaded BEFORE face indexing existed — new uploads
  // are indexed automatically the moment they land, but anything already sitting in
  // Firestore needs this to become searchable. Pages through the event's photos 300 at
  // a time (safe for 10,000-100,000+ photos, doesn't try to load them all into memory
  // at once) and indexes each through the same worker-pool pattern as uploads.
  function reindexEventFaces(eventId) {
    if (!db) return;
    if (!confirm('Re-index every photo in this event for face search?\n\nOnly needed once — new uploads are indexed automatically from now on. This can take a while for a large event, but you can keep using the dashboard while it runs.')) return;
    const btn = document.getElementById('ed-reindex-btn');
    if (btn) { btn.setAttribute('disabled', 'true'); btn.innerHTML = ICONS.REFRESH + ' Reindexing... (0)'; }
    const REINDEX_PAGE_SIZE = 300;
    const REINDEX_CONCURRENCY = 8;
    let indexed = 0;
    let lastDoc = null;

    function processPage() {
      let q = db.collection('photos').where('eventId', '==', eventId).limit(REINDEX_PAGE_SIZE);
      if (lastDoc) q = q.startAfter(lastDoc);
      return q.get().then(function (snap) {
        if (snap.empty) return;
        lastDoc = snap.docs[snap.docs.length - 1];
        const docs = snap.docs;
        let nextIndex = 0;
        function worker() {
          if (nextIndex >= docs.length) return Promise.resolve();
          const doc = docs[nextIndex++];
          const data = doc.data();
          return indexPhotoFace(eventId, doc.id, data.dataUrl).then(function () {
            indexed++;
            if (btn) btn.innerHTML = ICONS.REFRESH + ' Reindexing... (' + indexed + ')';
            return worker();
          });
        }
        const workers = [];
        for (let i = 0; i < Math.min(REINDEX_CONCURRENCY, docs.length); i++) workers.push(worker());
        return Promise.all(workers).then(function () {
          if (docs.length === REINDEX_PAGE_SIZE) return processPage();
        });
      });
    }

    processPage().then(function () {
      if (btn) { btn.removeAttribute('disabled'); btn.innerHTML = ICONS.REFRESH + ' Reindex Faces'; }
      alert('Done — indexed ' + indexed + ' photo(s) for face search.');
    }).catch(function () {
      if (btn) { btn.removeAttribute('disabled'); btn.innerHTML = ICONS.REFRESH + ' Reindex Faces'; }
      alert('Something went wrong while re-indexing. You can try again.');
    });
  }

  // Quick on/off right where uploading happens, instead of only being reachable a few
  // clicks away in Settings → Watermark. Writes to the exact same
  // e.watermark.<tier>.enabled flag that tab reads/shows — one real setting, two
  // places to flip it, not a second parallel one that could drift out of sync.
  function toggleUploadWatermark(tier, checked) {
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    e.watermark[tier].enabled = checked;
    syncEventPrivacyToCloud(e.id, { watermark: e.watermark });
  }

  // Upload target here is whatever album is currently selected in the sidebar (or
  // "Unsorted" if none) — no separate event/album dropdowns needed, since real Kamero
  // uploads directly into the folder you already have open.
  function handleEventPhotoUpload(evt, quality) {
    const files = Array.prototype.slice.call(evt.target.files || []).filter(function (f) { return f.type && f.type.indexOf('image/') === 0; });
    evt.target.value = '';
    if (!files.length) return;
    const eventId = currentEventId;
    // #ep-upload-target-note always tells the studio exactly where a photo is about to
    // land *before* they click Upload, so a photo can no longer land somewhere
    // unexpected without them seeing it first. 'HIGHLIGHTS' is a curated view, not a
    // real album — falls back to Unsorted, so an upload made while browsing Highlights
    // can't end up tagged with a phantom album named "HIGHLIGHTS" that no sidebar row
    // corresponds to. Same for '' (the one-off Unsorted-review view) and null (no
    // albums exist yet) — both just land the upload in Unsorted too.
    const albumName = (selectedAlbumFilter && selectedAlbumFilter !== 'HIGHLIGHTS') ? selectedAlbumFilter : '';
    // Uploading while Highlights is the selected folder marks the new photos
    // isHighlight:true directly — matches the real Kamero tooltip's own wording
    // ("Upload or move selected photos here to make them public"). They still also
    // land in Unsorted (album stays '') since Highlights isn't a real album a photo
    // can "live in" instead of one — it's an additional flag on top.
    const markHighlight = selectedAlbumFilter === 'HIGHLIGHTS';
    const queue = document.getElementById('ep-upload-queue');
    if (!storage || !db) {
      if (queue) queue.innerHTML = '<div style="padding:9px 0;font-size:12.5px;">No cloud connection</div>';
      return;
    }
    let uploadedInBatch = 0;
    uploadPhotosWithPool(files, {
      eventId: eventId, albumName: albumName, quality: quality, markHighlight: markHighlight,
      resize: function (file) { return prepareUploadBlob(file, quality); },
      onFileStart: function (file) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;';
        row.innerHTML = '<span>' + file.name + '</span><span class="pill orange">Uploading...</span>';
        if (queue) queue.appendChild(row);
        return row.querySelector('.pill');
      },
      onFileDone: function (statusEl, ok) {
        if (!statusEl) return;
        statusEl.textContent = ok ? 'Uploaded' : 'Failed';
        statusEl.className = ok ? 'pill green' : 'pill gray';
        if (ok) uploadedInBatch++;
      },
    }).then(function (result) {
      const ev = EVENTS.find(function (e) { return e.id === eventId; });
      if (ev) {
        ev.photos += result.done;
        if (albumName) {
          const album = ev.albums.find(function (a) { return a.name === albumName; });
          if (album) album.count += result.done;
        }
        // Album counts used to only update this local EVENTS copy — the sidebar's "(0)"
        // was really just stale Firestore data never written back, while the photo grid
        // above showed the correct live count because it queries photos directly instead
        // of trusting this cached number. Push albums along with photos so both agree.
        syncEventPrivacyToCloud(eventId, { photos: ev.photos, albums: ev.albums });
        renderAlbumSidebar(ev);
      }
    });
  }

  // Album cover/thumbnail — uploaded the same way as a regular event photo (resized,
  // pushed to Firebase Storage under photos/{eventId}/ so it matches the existing
  // Storage rules with zero changes needed), but the resulting URL is stored on the
  // album object itself (album.cover) instead of creating a "photos" doc, and synced
  // to Firestore via the same albums-array patch used by add/rename/delete album.
  function uploadAlbumThumbnail(evt, albumName) {
    const file = evt.target.files && evt.target.files[0];
    evt.target.value = '';
    if (!file || file.type.indexOf('image/') !== 0) return;
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    const album = e.albums.find(function (a) { return a.name === albumName; });
    if (!album) return;
    resizeFileToBlob(file, 600, 0.85).then(function (blob) {
      return uploadPhotoToStorage(blob, file.name, 'photos/' + e.id);
    }).then(function (url) {
      const oldUrl = album.cover;
      album.cover = url;
      syncEventPrivacyToCloud(e.id, { albums: e.albums });
      renderAlbumSidebar(e);
      if (oldUrl) deleteStorageFileByUrl(oldUrl);
    }).catch(function () {
      alert('Could not upload thumbnail — check your connection and try again.');
    });
  }

  function syncEventPrivacyToCloud(eventId, patch) {
    if (!db) { showSyncFailureToast(null); return; }
    db.collection('events').doc(eventId).set(patch, { merge: true }).catch(function (err) {
      // This used to be silently swallowed — every toggle/album add/highlight change
      // updates the local UI instantly (optimistic), so it always LOOKED saved. But if
      // the actual Firestore write failed (permission rules, quota, offline), nothing
      // was really persisted — and the next refresh would quietly revert it with zero
      // explanation. Surfacing the failure is what makes "did this actually save?"
      // answerable instead of a mystery.
      showSyncFailureToast(err);
    });
  }

  let syncFailureToastTimer = null;
  function showSyncFailureToast(err) {
    let toast = document.getElementById('sync-failure-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'sync-failure-toast';
      toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#D0342C;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);max-width:90vw;text-align:center;';
      document.body.appendChild(toast);
    }
    const code = err && err.code ? ' (' + err.code + ')' : '';
    toast.textContent = 'Could not save your last change — it will be lost on refresh unless you retry.' + code;
    toast.style.display = 'block';
    if (syncFailureToastTimer) clearTimeout(syncFailureToastTimer);
    syncFailureToastTimer = setTimeout(function () { toast.style.display = 'none'; }, 7000);
  }

  // Deletes every Firestore "photos" doc AND its real Storage file for one event.
  // deleteEvent() below used to only ever remove the event doc itself — every one of
  // that event's photo documents, plus the actual (often multi-MB) Storage file behind
  // each one, stayed behind forever with nothing left pointing at them. For a studio
  // shooting dozens of weddings a year, that's an unbounded, silent Storage cost leak.
  const DELETE_CONCURRENCY = 6;
  function deleteEventPhotosFromCloud(eventId) {
    if (!db) return Promise.resolve();
    return db.collection('photos').where('eventId', '==', eventId).get().then(function (snapshot) {
      const docs = snapshot.docs;
      if (!docs.length) return Promise.resolve();
      // Batch the Firestore doc deletes (same up-to-400-per-batch pattern as
      // createPhotoBatchWriter() above) rather than one .delete() call per photo.
      let batch = db.batch();
      let count = 0;
      const commits = [];
      docs.forEach(function (doc) {
        batch.delete(doc.ref);
        count++;
        if (count >= 400) { commits.push(batch.commit()); batch = db.batch(); count = 0; }
      });
      if (count > 0) commits.push(batch.commit());

      // Storage files removed through a bounded worker pool (same concurrency pattern
      // as uploadPhotosWithPool() above) so a large event doesn't fire thousands of
      // simultaneous delete requests at once.
      let nextIndex = 0;
      async function worker() {
        while (nextIndex < docs.length) {
          const data = docs[nextIndex++].data();
          await deleteStorageFileByUrl(data.dataUrl);
          await deleteStorageFileByUrl(data.thumbUrl);
          await deleteStorageFileByUrl(data.previewUrl);
        }
      }
      const workers = [];
      for (let i = 0; i < Math.min(DELETE_CONCURRENCY, docs.length); i++) workers.push(worker());
      return Promise.all(commits.concat(workers));
    }).catch(function (err) {
      console.error('Could not fully clean up photos for deleted event', eventId, err);
    });
  }

  function deleteEvent() {
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    if (!confirm('Delete "' + e.name + '"? This cannot be undone.')) return;
    const idx = EVENTS.findIndex(function (x) { return x.id === e.id; });
    if (idx !== -1) EVENTS.splice(idx, 1);
    if (db) db.collection('events').doc(e.id).delete().catch(function () {});
    deleteEventFaceCollection(e.id);
    deleteEventPhotosFromCloud(e.id);
    // The event's own cover photo and every album's thumbnail are Storage files
    // referenced only from fields on the event doc just deleted above — not from the
    // "photos" collection deleteEventPhotosFromCloud() just cleaned up — so they'd be
    // orphaned too without this.
    if (e.cover) deleteStorageFileByUrl(e.cover);
    (e.albums || []).forEach(function (a) { if (a.cover) deleteStorageFileByUrl(a.cover); });
    showPage('events');
  }

  function addAlbum() {
    const input = document.getElementById('new-album-name');
    const name = input.value.trim();
    if (!name) return;
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    if (e.albums.some(function (a) { return a.name.toLowerCase() === name.toLowerCase(); })) {
      alert('An album named "' + name + '" already exists.');
      return;
    }
    e.albums.push({ name: name, count: 0, cover: '' });
    input.value = '';
    // Persist to Firestore — this is what makes the album actually show up in the
    // Upload page's Target Album picker and in the guest app's album/folder browser,
    // instead of only existing in this dashboard tab until the page is reloaded.
    syncEventPrivacyToCloud(e.id, { albums: e.albums });
    if (!selectedAlbumFilter) selectedAlbumFilter = name;
    renderAlbumSidebar(e);
    renderEventPhotosGrid();
  }

  function deleteAlbum(name) {
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    if (!confirm('Delete album "' + name + '"? Photos already in it stay in the event, just unsorted.')) return;
    // The album's own thumbnail/cover (uploadAlbumThumbnail above) is a real Storage
    // file that nothing else references — losing the album object here would otherwise
    // orphan it, same as an event/studio cover replaced without cleanup.
    const deleted = e.albums.find(function (a) { return a.name === name; });
    e.albums = e.albums.filter(function (a) { return a.name !== name; });
    syncEventPrivacyToCloud(e.id, { albums: e.albums });
    if (deleted && deleted.cover) deleteStorageFileByUrl(deleted.cover);
    if (selectedAlbumFilter === name) selectedAlbumFilter = e.albums.length ? e.albums[0].name : null;
    renderAlbumSidebar(e);
    renderEventPhotosGrid();
  }

  function renameAlbum(oldName) {
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    const newName = prompt('Rename album "' + oldName + '" to:', oldName);
    if (!newName || !newName.trim() || newName.trim() === oldName) return;
    const trimmed = newName.trim();
    if (e.albums.some(function (a) { return a.name.toLowerCase() === trimmed.toLowerCase(); })) {
      alert('An album named "' + trimmed + '" already exists.');
      return;
    }
    const album = e.albums.find(function (a) { return a.name === oldName; });
    if (!album) return;
    album.name = trimmed;
    syncEventPrivacyToCloud(e.id, { albums: e.albums });
    // Photos already tagged with the old album name are re-tagged too, so they stay
    // grouped under the renamed folder instead of silently falling back to Unsorted.
    if (db) {
      db.collection('photos').where('eventId', '==', e.id).where('album', '==', oldName).get().then(function (snap) {
        snap.forEach(function (doc) { doc.ref.set({ album: trimmed }, { merge: true }); });
      }).catch(function () {});
    }
    if (selectedAlbumFilter === oldName) selectedAlbumFilter = trimmed;
    renderAlbumSidebar(e);
    renderEventPhotosGrid();
  }

  function refreshEventPhotosGrid() {
    if (currentEventId) startDashboardPhotosSync(currentEventId);
  }

  function toggleGridSelectMode() {
    gridSelectMode = !gridSelectMode;
    gridSelectedPhotoIds = [];
    const btn = document.getElementById('ep-select-btn');
    if (btn) btn.classList.toggle('active', gridSelectMode);
    renderEventPhotosGrid();
  }

  function toggleSelectPhoto(id) {
    const idx = gridSelectedPhotoIds.indexOf(id);
    if (idx > -1) gridSelectedPhotoIds.splice(idx, 1);
    else gridSelectedPhotoIds.push(id);
    renderEventPhotosGrid();
  }

  function deleteSelectedPhotos() {
    if (!gridSelectedPhotoIds.length || !db) return;
    if (!confirm('Delete ' + gridSelectedPhotoIds.length + ' selected photo(s)? This cannot be undone.')) return;
    const ids = gridSelectedPhotoIds.slice();
    // Look up each photo's URL before the doc is gone, so the Storage file can be
    // cleaned up too instead of being orphaned (see deleteStorageFileByUrl).
    const urls = [];
    ids.forEach(function (id) {
      const p = dashboardEventPhotos.find(function (x) { return x.id === id; });
      if (p) { urls.push(p.dataUrl); urls.push(p.thumbUrl); urls.push(p.previewUrl); }
    });
    Promise.all(ids.map(function (id) { return db.collection('photos').doc(id).delete(); })).then(function () {
      urls.forEach(function (url) { if (url) deleteStorageFileByUrl(url); });
      const e = EVENTS.find(function (x) { return x.id === currentEventId; });
      if (e) e.photos = Math.max(0, e.photos - ids.length);
      gridSelectedPhotoIds = [];
      toggleGridSelectMode();
    }).catch(function () { alert('Could not delete some photos — please try again.'); });
  }

  // Bulk Highlight actions — lets the studio select a batch of photos from the main
  // grid (same Select mode already used for bulk delete) and move them all into the
  // Highlights folder-view in one go, instead of opening each photo's lightbox and
  // starring it one at a time. Mirrors deleteSelectedPhotos()'s pattern exactly.
  function addSelectedToHighlights() {
    if (!gridSelectedPhotoIds.length || !db) return;
    const ids = gridSelectedPhotoIds.slice();
    Promise.all(ids.map(function (id) { return db.collection('photos').doc(id).set({ isHighlight: true }, { merge: true }); })).then(function () {
      ids.forEach(function (id) {
        const p = dashboardEventPhotos.find(function (x) { return x.id === id; });
        if (p) p.isHighlight = true;
      });
      gridSelectedPhotoIds = [];
      toggleGridSelectMode();
      const e = EVENTS.find(function (x) { return x.id === currentEventId; });
      if (e) renderAlbumSidebar(e);
    }).catch(function () { alert('Could not add some photos to Highlights — please try again.'); });
  }

  function removeSelectedFromHighlights() {
    if (!gridSelectedPhotoIds.length || !db) return;
    const ids = gridSelectedPhotoIds.slice();
    Promise.all(ids.map(function (id) { return db.collection('photos').doc(id).set({ isHighlight: false }, { merge: true }); })).then(function () {
      ids.forEach(function (id) {
        const p = dashboardEventPhotos.find(function (x) { return x.id === id; });
        if (p) p.isHighlight = false;
      });
      gridSelectedPhotoIds = [];
      toggleGridSelectMode();
      const e = EVENTS.find(function (x) { return x.id === currentEventId; });
      if (e) renderAlbumSidebar(e);
    }).catch(function () { alert('Could not remove some photos from Highlights — please try again.'); });
  }

  // Real fix for "how do I get unsorted photos into an album" now that there's no
  // permanent "Unsorted" folder to leave them sitting in — lets the studio bulk-move
  // the current selection (usually opened via the amber "N photos need an album"
  // banner, but works from any album's grid too) into an existing album, or a brand
  // new one typed right here.
  function openMoveToAlbumModal() {
    const root = document.getElementById('move-album-modal-root');
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!root || !e || !gridSelectedPhotoIds.length) return;
    const count = gridSelectedPhotoIds.length;
    const existingRows = e.albums.map(function (a) {
      return '<div class="toggle-row" data-move-album="' + a.name + '" style="padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;">' +
        (a.cover ? '<img src="' + a.cover + '" style="width:20px;height:20px;border-radius:5px;object-fit:cover;flex-shrink:0;">' : '<i data-icon="FOLDER"></i>') +
        a.name + ' <span style="color:var(--muted);font-size:11.5px;">(' + (a.count || 0) + ')</span>' +
      '</div>';
    }).join('');
    root.innerHTML =
      '<div style="position:fixed;inset:0;background:rgba(20,16,20,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;" onmousedown="if(event.target===this)closeMoveToAlbumModal()">' +
        '<div style="background:var(--surface);border-radius:18px;max-width:420px;width:100%;padding:26px 26px 22px;position:relative;box-shadow:0 30px 70px -24px rgba(0,0,0,.4);">' +
          '<div class="card-title" style="margin:0 0 4px;">Move ' + count + ' photo' + (count === 1 ? '' : 's') + ' to album</div>' +
          '<p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">Pick an existing folder, or create a new one below.</p>' +
          '<div id="move-album-existing-list" style="max-height:220px;overflow-y:auto;margin-bottom:' + (existingRows ? '14px' : '0') + ';">' + existingRows + '</div>' +
          '<div class="field"><label>New album</label><input class="input" id="move-album-new-name" placeholder="e.g. Cam 3"></div>' +
          '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">' +
            '<button class="btn-outline btn-sm" onclick="closeMoveToAlbumModal()">Cancel</button>' +
            '<button class="btn-solid btn-sm" onclick="confirmMoveToNewAlbum()">Create &amp; Move</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    root.querySelectorAll('[data-move-album]').forEach(function (row) {
      row.addEventListener('click', function () { moveSelectedPhotosToAlbum(row.dataset.moveAlbum); });
    });
    fillIcons();
  }

  function closeMoveToAlbumModal() {
    const root = document.getElementById('move-album-modal-root');
    if (root) root.innerHTML = '';
  }

  function confirmMoveToNewAlbum() {
    const input = document.getElementById('move-album-new-name');
    const name = input ? input.value.trim() : '';
    if (!name) { if (input) input.focus(); return; }
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    if (!e) return;
    if (e.albums.some(function (a) { return a.name.toLowerCase() === name.toLowerCase(); })) {
      alert('An album named "' + name + '" already exists — pick it from the list above instead.');
      return;
    }
    e.albums.push({ name: name, count: 0, cover: '' });
    syncEventPrivacyToCloud(e.id, { albums: e.albums });
    moveSelectedPhotosToAlbum(name);
  }

  function moveSelectedPhotosToAlbum(albumName) {
    if (!gridSelectedPhotoIds.length || !db || !albumName) return;
    const ids = gridSelectedPhotoIds.slice();
    Promise.all(ids.map(function (id) { return db.collection('photos').doc(id).set({ album: albumName }, { merge: true }); })).then(function () {
      ids.forEach(function (id) {
        const p = dashboardEventPhotos.find(function (x) { return x.id === id; });
        if (p) p.album = albumName;
      });
      gridSelectedPhotoIds = [];
      gridSelectMode = false;
      closeMoveToAlbumModal();
      const e = EVENTS.find(function (x) { return x.id === currentEventId; });
      if (e) {
        reconcileAlbumCounts(e.id);
        // Jump straight into the album the photos just landed in, so the studio sees
        // them arrive instead of wondering whether the move actually worked.
        selectAlbum(albumName);
      }
    }).catch(function () { alert('Could not move some photos — please try again.'); });
  }

  // ================= Event Detail action panels =================

  // Shows the leads guests submitted through the Gallery's "Interested in booking
  // us?" enquiry form (only appears there when Enquiry / Lead Capture Form is turned

  // Holds the last-fetched real registration docs for the currently-open panel, so

    // guests/views above stay as this event's overall view-tracking counters (separate

        '<div><div style="font-size:22px;font-weight:800;">' + (e ? e.views.toLocaleString() : 0) + '</div><div style="color:var(--muted);font-size:12px;">Gallery Views</div></div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;">' +
        '<div style="font-weight:700;font-size:13.5px;">Registered Guests</div>' +
        '<button class="btn-outline btn-sm" id="guests-download-btn" onclick="downloadGuestsCSV()" disabled>' + ICONS.DOWNLOAD + ' Download CSV</button>' +
      '</div>' +
      '<div id="guests-list-body" style="margin-top:10px;"><div class="empty-note">Loading&hellip;</div></div>' +
      '</div>';

    if (!db) {
      document.getElementById('guests-list-body').innerHTML = '<div class="empty-note">Could not connect to load registered guests.</div>';
      return;
    }
    // where() only (no orderBy) so this doesn't need a composite Firestore index — sorted
    // client-side instead, newest first.
    db.collection('guestRegistrations').where('eventId', '==', currentEventId).get().then(function (snap) {
      GUEST_REGISTRATIONS = snap.docs.map(function (d) { return d.data(); });
      GUEST_REGISTRATIONS.sort(function (a, b) {
        const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return bt - at;
      });
      const body = document.getElementById('guests-list-body');
      const btn = document.getElementById('guests-download-btn');
      if (!body) return;
      if (!GUEST_REGISTRATIONS.length) {
        const isOff = !(e && e.privacy && e.privacy.registration);
        body.innerHTML = '<div class="empty-note">' +
          (isOff
            ? 'Guest Registration is off for this event, so no name/phone/email is being collected. Turn it on in Privacy &amp; Access to start collecting this.'
            : 'No one has registered yet — this fills in as guests enter their details.') +
          (isOff ? '<div style="margin-top:12px;"><button class="btn-outline btn-sm" onclick="openEventSettings()">' + ICONS.SETTINGS + ' Go to Privacy &amp; Access</button></div>' : '') +
          '</div>';
        return;
      }
      if (btn) btn.disabled = false;
      body.innerHTML = '<div class="table-card"><table><thead><tr>' +
        '<th>Name</th><th>Phone</th><th>Email</th><th>Registered</th>' +
        '</tr></thead><tbody>' +
        GUEST_REGISTRATIONS.map(function (g) {
          const when = g.createdAt && g.createdAt.toDate ? g.createdAt.toDate().toLocaleString() : '—';
          return '<tr><td>' + escapeHtmlGD(g.name || '—') + '</td><td>' + escapeHtmlGD(g.phone || '—') + '</td>' +
            '<td>' + escapeHtmlGD(g.email || '—') + '</td><td>' + when + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }).catch(function () {
      const body = document.getElementById('guests-list-body');
      if (body) body.innerHTML = '<div class="empty-note">Could not load registered guests.</div>';
    });
  }

  function escapeHtmlGD(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Real CSV export of whatever's currently loaded in GUEST_REGISTRATIONS — no fake rows,
  // and simply disabled (see the button above) when there's nothing real to export yet.
  function downloadGuestsCSV() {
    if (!GUEST_REGISTRATIONS.length) return;
    const e = EVENTS.find(function (x) { return x.id === currentEventId; });
    const csvEscape = function (v) {
      const s = v === null || v === undefined ? '' : String(v);
      return '"' + s.replace(/"/g, '""') + '"';
    };
    const rows = [['Name', 'Phone', 'Email', 'Registered At'].map(csvEscape).join(',')];
    GUEST_REGISTRATIONS.forEach(function (g) {
      const when = g.createdAt && g.createdAt.toDate ? g.createdAt.toDate().toISOString() : '';
      rows.push([g.name || '', g.phone || '', g.email || '', when].map(csvEscape).join(','));
    });
    const blob = new Blob([rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'guests-' + (e ? e.id : currentEventId) + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }
